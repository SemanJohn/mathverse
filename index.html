/* --- Cerakin --- */
ENJIN.cerakin=c=>()=>{
  let n=R(Math.floor((c.max||999)/10),c.max||999);
  const sn=String(n);
  const NAMA=["sa","puluh","ratus","ribu","puluh ribu","ratus ribu","juta"];
  const bhg=[];                       // [{digit, nilai, nama}]
  for(let i=0;i<sn.length;i++){
    const d=+sn[i],pw=sn.length-1-i;
    if(d)bhg.push({d:d,v:d*Math.pow(10,pw),nm:NAMA[pw]});
  }
  // pengecoh: digit dibaca dari kanan tetapi nilai tempat dari kiri (miskonsepsi biasa).
  // JANGAN sekadar songsangkan susunan — tambah itu kalis tukar tertib, jadi ia tetap betul.
  const terbalik=bhg.map((x,i)=>{
    const d=bhg[bhg.length-1-i].d,pw=NAMA.indexOf(x.nm);
    return{d:d,nm:x.nm,v:d*Math.pow(10,pw)};
  });
  // pengecoh: setiap tempat dibaca satu tingkat terlalu tinggi
  const naikTempat=bhg.map(x=>`${x.d} ${NAMA[NAMA.indexOf(x.nm)+1]||x.nm}`).join(" + ");

  // Buku m/s 16 mengajar DUA bentuk cerakin
  const bentukTempat=Math.random()<.5;
  if(bentukTempat){
    const betul=bhg.map(x=>`${x.d} ${x.nm}`).join(" + ");
    const salah=[
      naikTempat,
      terbalik.map(x=>`${x.d} ${x.nm}`).join(" + "),
      bhg.map(x=>`${x.v} ${x.nm}`).join(" + ")];
    return{q:`Cerakinkan ${fmt(n)} mengikut <b>nilai tempat</b>`,vis:dienes(n),
      opts:shuffle([...new Set([betul,...salah])]).slice(0,4),ans:-1,ansVal:betul,
      hint:`Cerakin nilai tempat menyatakan <b>berapa banyak</b> setiap tempat: ${betul}.`};
  }
  const betul=bhg.map(x=>fmt(x.v)).join(" + ");
  const salah=[
    bhg.map(x=>String(x.d)).join(" + "),
    terbalik.map(x=>fmt(x.v)).join(" + "),
    bhg.map(x=>fmt(x.v*10)).join(" + ")].filter(x=>x&&x!==betul);
  return{q:`Cerakinkan ${fmt(n)} mengikut <b>nilai digit</b>`,vis:dienes(n),
    opts:shuffle([...new Set([betul,...salah])]).slice(0,4),ans:-1,ansVal:betul,
    hint:`Cerakin nilai digit menyatakan <b>nilai sebenar</b> setiap digit: ${betul}.`};
};

/* pengecoh untuk bank nombor: hampir dengan urutan tetapi BUKAN sebahagian daripadanya */
function umpanBank(urutan,bil,max){
  const set=[],ada=new Set(urutan);
  let cuba=0;
  while(set.length<bil&&cuba++<200){
    const asas=pick(urutan);
    const v=asas+pick([1,-1,2,-2,3,-3,10,-10]);
    if(v>=0&&v<=(max||100)&&!ada.has(v)&&!set.includes(v))set.push(v);
  }
  return set;
}
/* --- Susunan nombor (buku teks m/s 32-38) --- */
function jalurNombor(siri,tandaIdx){
  return `<div class="urut">${siri.map((v,i)=>
    `<div class="ubox${i===tandaIdx?" kosong":""}">${v===null?"?":fmt(v)}</div>`).join("")}</div>`;
}
ENJIN.susun=c=>()=>{
  const max=c.max||100,bil=c.bil||4;
  const bentuk=pick(["tertib","tertib","sebelumSelepas","antara","lengkap","lengkap","suai","bilangBerapa"]);

  if(bentuk==="tertib"){
    const set=[];while(set.length<bil){const v=R(1,max);if(!set.includes(v))set.push(v);}
    const naik=Math.random()<.5;
    const betul=set.slice().sort((x,y)=>naik?x-y:y-x).map(fmt).join(", ");
    const o=[betul,set.slice().sort((x,y)=>naik?y-x:x-y).map(fmt).join(", "),
      shuffle(set).map(fmt).join(", "),shuffle(set).map(fmt).join(", ")];
    return{q:`Susun mengikut <b>tertib ${naik?"menaik":"menurun"}</b>`,
      qs:set.map(fmt).join("  ·  "),vis:"",
      opts:shuffle([...new Set(o)]).slice(0,4),ans:-1,ansVal:betul,
      hint:`Tertib ${naik?"menaik bermaksud kecil ke besar":"menurun bermaksud besar ke kecil"}.`};
  }

  if(bentuk==="sebelumSelepas"){
    const n=R(3,max-3);                       // pastikan seluruh jalur kekal dalam julat
    const selepas=Math.random()<.5;
    const jwp=selepas?n+1:n-1;
    const siri=[];for(let i=n-2;i<=n+2;i++)siri.push(i<1||i>max?null:i);
    return{q:`Apakah nombor <b>${selepas?"selepas":"sebelum"} ${fmt(n)}</b>?`,
      vis:jalurNombor(siri.map((v,i)=>i===(selepas?3:1)?null:v),selepas?3:1)
        +`<div class="hint">Bilang ${selepas?"menaik":"menurun"} satu-satu.</div>`,
      opts:shuffle([jwp,n,jwp+1,jwp-1].filter((v,i,x)=>x.indexOf(v)===i&&v>0)).slice(0,4).map(fmt),
      ans:-1,ansVal:fmt(jwp),
      hint:`Nombor ${selepas?"selepas":"sebelum"} ${fmt(n)} ialah <b>${fmt(jwp)}</b>.`};
  }

  if(bentuk==="antara"){
    const n=R(2,max-3);
    return{q:`Apakah nombor <b>di antara ${fmt(n)} dan ${fmt(n+2)}</b>?`,
      vis:jalurNombor([n,null,n+2],1),
      opts:shuffle([n+1,n,n+2,n+3].filter((v,i,x)=>x.indexOf(v)===i)).slice(0,4).map(fmt),
      ans:-1,ansVal:fmt(n+1),
      hint:`Antara ${fmt(n)} dan ${fmt(n+2)} ialah <b>${fmt(n+1)}</b>.`};
  }

  if(bentuk==="lengkap"){
    const beza=pick([1,2,5,10]),naik=Math.random()<.5;
    const panjang=6;
    let mula=naik?R(0,Math.max(1,max-beza*panjang)):R(beza*panjang,max);
    const urutan=[];for(let i=0;i<panjang;i++)urutan.push(mula+(naik?1:-1)*beza*i);
    if(urutan.some(x=>x<0||x>max))return ENJIN.susun(c)();
    const kosong=shuffle([1,2,3,4,5]).slice(0,2).sort((x,y)=>x-y);
    const umpan=umpanBank(urutan,2,max);
    return{mod:"interaktif",
      q:`Lengkapkan susunan nombor <b>${naik?"menaik":"menurun"} ${beza}-${beza}</b>`,
      vis:komponenIsi(urutan,kosong,umpan,
        "Klik nombor di bawah untuk mengisi kotak kuning."),
      cek:()=>ISIbetul(),
      ansVal:kosong.map(i=>fmt(urutan[i])).join(" dan "),
      hint:`Setiap nombor ${naik?"lebih":"kurang"} ${beza} daripada nombor sebelumnya.`};
  }

  if(bentuk==="suai"){
    const asas=[];while(asas.length<3){const v=R(3,max-2);if(!asas.includes(v))asas.push(v);}
    const jenis=pick(["sebelum","selepas","antara"]);
    const pasangan=asas.map(n=>jenis==="sebelum"?[`Sebelum ${fmt(n)}`,fmt(n-1)]
      :jenis==="selepas"?[`Selepas ${fmt(n)}`,fmt(n+1)]
      :[`Antara ${fmt(n-1)} dan ${fmt(n+1)}`,fmt(n)]);
    return{mod:"interaktif",q:"Suaikan setiap kad dengan nombor yang betul",
      vis:komponenSuai(pasangan),
      cek:()=>SUAIbetul(),
      ansVal:pasangan.map(x=>x[1]).join(", "),
      hint:jenis==="sebelum"?"Nombor sebelum bermaksud kurang 1."
        :jenis==="selepas"?"Nombor selepas bermaksud lebih 1."
        :"Nombor di antara terletak di tengah-tengah."};
  }

  // bilangBerapa: bilang dua-dua / lima-lima / sepuluh-sepuluh
  const beza=pick([2,4,5,10]),naik=Math.random()<.5;
  let mula=naik?R(0,Math.max(1,max-beza*6)):R(beza*6,max);
  const siri=[];for(let i=0;i<6;i++)siri.push(mula+(naik?1:-1)*beza*i);
  if(siri.some(x=>x<0||x>max))return ENJIN.susun(c)();
  const idx=R(2,5),jwp=siri[idx];
  return{q:`Bilang <b>${naik?"menaik":"menurun"} ${beza}-${beza}</b>. Apakah nombor yang tertinggal?`,
    vis:jalurNombor(siri.map((v,i)=>i===idx?null:v),idx),
    opts:shuffle([jwp,jwp+beza,jwp-beza,jwp+1].filter((v,i,x)=>x.indexOf(v)===i&&v>=0)).slice(0,4).map(fmt),
    ans:-1,ansVal:fmt(jwp),
    hint:`Setiap nombor ${naik?"lebih":"kurang"} ${beza} daripada nombor sebelumnya. Yang tertinggal ialah <b>${fmt(jwp)}</b>.`};
};

/* --- Pola nombor (buku teks m/s 39-42) --- */
ENJIN.pola=c=>()=>{
  const max=c.max||100;
  const bentuk=pick(["berulang","berulang","aritmetik","aritmetik","lengkapPola","petak","rumah"]);

  // pola BERULANG — bentuk utama Tahun 1 (cth 3,8,3,8 atau 3,5,7,3,5,7)
  if(bentuk==="berulang"){
    const pjg=pick([2,2,3]);
    const unit=[];while(unit.length<pjg){const v=R(1,Math.min(20,max));if(!unit.includes(v))unit.push(v);}
    const siri=[];for(let i=0;i<8;i++)siri.push(unit[i%pjg]);
    const idx=R(4,7),jwp=siri[idx];
    return{q:"Apakah nombor seterusnya dalam pola berulang ini?",
      vis:`<div class="urut">${siri.map((v,i)=>
        `<div class="ubox${i===idx?" kosong":""}">${i===idx?"?":fmt(v)}</div>`).join("")}</div>
        <div class="hint">Nombor ${unit.join(", ")} disusun berulang-ulang.</div>`,
      opts:shuffle([...new Set(unit.concat(jwp,R(1,20)))]).slice(0,4).map(fmt),
      ans:-1,ansVal:fmt(jwp),
      hint:`Pola ini mengulang ${unit.join(", ")}. Nombor seterusnya ialah <b>${fmt(jwp)}</b>.`};
  }

  if(bentuk==="aritmetik"){
    const beza=pick(c.beza||[1,2,5,10]),naik=Math.random()<.5;
    const mula=naik?R(beza,Math.max(beza,max-beza*6)):R(beza*4,max);
    const sk=[];for(let i=0;i<5;i++)sk.push(mula+(naik?1:-1)*beza*i);
    if(sk.some(x=>x<0||x>max))return ENJIN.pola(c)();
    const idx=R(2,4),jwp=sk[idx];
    return{q:"Apakah nombor yang hilang dalam pola ini?",
      vis:`<div class="urut">${sk.map((v,i)=>
        `<div class="ubox${i===idx?" kosong":""}">${i===idx?"?":fmt(v)}</div>`).join("")}</div>`,
      opts:shuffle([jwp,jwp+beza,jwp-beza,jwp+beza*2].filter(x=>x>=0)).map(fmt),
      ans:-1,ansVal:fmt(jwp),
      hint:`Pola ini ${naik?"bertambah":"berkurang"} ${fmt(beza)} setiap kali.`};
  }

  if(bentuk==="lengkapPola"){
    const beza=pick(c.beza||[1,2,5,10]),naik=Math.random()<.5;
    let mula=naik?R(0,Math.max(1,max-beza*6)):R(beza*6,max);
    const urutan=[];for(let i=0;i<6;i++)urutan.push(mula+(naik?1:-1)*beza*i);
    if(urutan.some(x=>x<0||x>max))return ENJIN.pola(c)();
    const kosong=shuffle([1,2,3,4,5]).slice(0,3).sort((x,y)=>x-y);
    return{mod:"interaktif",q:"Kenal pasti polanya, kemudian lengkapkan",
      vis:komponenIsi(urutan,kosong,umpanBank(urutan,2,max),
        "Klik nombor di bawah untuk mengisi kotak kuning."),
      cek:()=>ISIbetul(),
      ansVal:kosong.map(i=>fmt(urutan[i])).join(", "),
      hint:`Pola ini ${naik?"bertambah":"berkurang"} ${fmt(beza)} setiap kali.`};
  }

  if(bentuk==="petak"&&max<=100){
    const beza=pick([2,5,10]);
    const mula=beza;
    return{q:`Nombor yang diwarnakan pada petak 100 ini mengikut pola apa?`,
      vis:petak100(i=>i%beza===0),
      opts:shuffle([...new Set([2,5,10,3])]).map(x=>`Bilang ${x}-${x}`),
      ans:-1,ansVal:`Bilang ${beza}-${beza}`,
      hint:`Nombor berwarna ialah ${mula}, ${mula+beza}, ${mula+beza*2}, … — bilang ${beza}-${beza}.`};
  }

  // rumah: nombor rumah selang dua (genap / ganjil)
  const genap=Math.random()<.5;
  const mula=genap?R(1,Math.floor(max/2)-6)*2:R(1,Math.floor(max/2)-6)*2+1;
  const naik=Math.random()<.5;
  const siri=[];for(let i=0;i<6;i++)siri.push(mula+(naik?1:-1)*2*i);
  if(siri.some(x=>x<1||x>max))return ENJIN.pola(c)();
  const idx=R(1,4),jwp=siri[idx];
  return{q:"Kenal pasti nombor rumah yang hilang",
    vis:`<div class="urut">${siri.map((v,i)=>
      `<div class="ubox${i===idx?" kosong":""}">🏠<br>${i===idx?"?":fmt(v)}</div>`).join("")}</div>
      <div class="hint">Nombor rumah di sebelah jalan yang sama berselang dua.</div>`,
    opts:shuffle([jwp,jwp+2,jwp-2,jwp+1].filter(x=>x>0)).slice(0,4).map(fmt),
    ans:-1,ansVal:fmt(jwp),
    hint:`Nombor rumah ini ${naik?"bertambah":"berkurang"} 2 setiap kali — semuanya nombor ${genap?"genap":"ganjil"}.`};
};

/* --- Kenali anggaran (buku teks m/s 43-44) --- */
ENJIN.anggar=c=>()=>{
  if(c.jenis){   // anggaran ukuran (Tahun 2 ke atas)
    const set={panjang:[["Pensel",15,"cm"],["Meja",120,"cm"],["Pintu",2,"m"],["Buku",25,"cm"],
        ["Bilik darjah",8,"m"],["Klip kertas",4,"cm"],["Papan putih",3,"m"],["Sudu",18,"cm"]],
      jisim:[["Sebiji epal",150,"g"],["Beg sekolah",3,"kg"],["Sekeping duit syiling",5,"g"],
        ["Sebuku roti",400,"g"],["Sebiji tembikai",4,"kg"],["Sebatang pemadam",20,"g"],["Sekampit beras",5,"kg"]],
      isipadu:[["Segelas air",250,"ml"],["Sebotol air mineral",1500,"ml"],["Sesudu ubat",5,"ml"],
        ["Sebaldi air",10,"l"],["Sekotak minuman",200,"ml"],["Sebuah jag",2,"l"],["Sebotol minyak masak",1,"l"]],
      masa:[["Menggosok gigi",3,"minit"],["Waktu rehat sekolah",30,"minit"],["Satu waktu kelas",60,"minit"],
            ["Perjalanan ke sekolah",15,"minit"],["Tidur malam",8,"jam"],["Menonton filem",2,"jam"]]}[c.jenis]
      ||[["Pensel",15,"cm"]];
    const[nm,v,u]=pick(set);
    const o=shuffle([v,v*10,Math.max(1,Math.round(v/10)),v*2]).filter((x,i,a2)=>a2.indexOf(x)===i).slice(0,4);
    if(!o.includes(v))o[0]=v;
    return{q:`Anggarkan: ${nm}`,vis:"",opts:shuffle(o).map(x=>fmt(x)+" "+u),ans:-1,ansVal:fmt(v)+" "+u,
      hint:`Anggaran munasabah bagi ${nm.toLowerCase()} ialah ${fmt(v)} ${u}.`};
  }
  const e=pick(OBJ);
  const bentuk=pick(["banding","banding","istilah","munasabah","muat"]);
  const rujuk=pick(c.rujuk||[10,15,20,25,30]);
  const had=c.max||40;

  // BANDING dengan kumpulan rujukan — kaedah buku teks m/s 43
  if(bentuk==="banding"){
    const lebih=Math.random()<.5;
    const n=lebih?rujuk+R(3,8):Math.max(2,rujuk-R(3,8));
    return{q:`Bakul biru ada <b>${rujuk}</b> objek. Anggarkan bilangan dalam bakul merah.`,
      vis:`<div style="display:flex;gap:clamp(8px,2vh,18px);justify-content:center;flex-wrap:wrap">
        <div style="text-align:center"><div class="lbl" style="font-size:12px;color:var(--dim);font-weight:700;margin-bottom:5px">Bakul biru (${rujuk})</div>
          ${objekAnggaran(rujuk,"🔵")}</div>
        <div style="text-align:center"><div class="lbl" style="font-size:12px;color:var(--dim);font-weight:700;margin-bottom:5px">Bakul merah (?)</div>
          ${objekAnggaran(n,e)}</div></div>`,
      opts:shuffle([`Lebih daripada ${rujuk}`,`Kurang daripada ${rujuk}`,`Sama dengan ${rujuk}`]),
      ans:-1,ansVal:lebih?`Lebih daripada ${rujuk}`:`Kurang daripada ${rujuk}`,
      hint:`Bakul merah ada ${n} objek — <b>${lebih?"lebih":"kurang"} daripada ${rujuk}</b>.`};
  }

  // ISTILAH anggaran: lebih kurang / lebih daripada / kurang daripada
  if(bentuk==="istilah"){
    const n=rujuk+pick([-7,-1,0,1,8]);
    const jwp=Math.abs(n-rujuk)<=1?`Lebih kurang ${rujuk}`
      :n>rujuk?`Lebih daripada ${rujuk}`:`Kurang daripada ${rujuk}`;
    return{q:`Anggarkan bilangan objek ini berbanding <b>${rujuk}</b>`,
      qs:"Lihat sekali imbas — jangan bilang satu per satu",
      vis:objekAnggaran(Math.max(1,n),e),
      opts:shuffle([`Lebih kurang ${rujuk}`,`Lebih daripada ${rujuk}`,`Kurang daripada ${rujuk}`]),
      ans:-1,ansVal:jwp,
      hint:`Bilangan sebenar ialah ${Math.max(1,n)}. Jadi jawapannya <b>${jwp.toLowerCase()}</b>.`};
  }

  // MUAT: berapa yang boleh dimuat
  if(bentuk==="muat"){
    const satu=R(3,6),baris=R(2,4);
    const jum=satu*baris;
    return{q:`Satu baris muat <b>${satu}</b> botol. Anggarkan bilangan botol yang boleh dimuat dalam ${baris} baris.`,
      vis:`<div class="objwrap" style="flex-direction:column;gap:4px">
        ${Array(baris).fill(`<div style="display:flex;gap:4px">${Array(satu).fill('<span class="obj">🧃</span>').join("")}</div>`).join("")}
      </div>`,
      opts:shuffle([jum,jum+satu,Math.max(1,jum-satu),satu+baris].filter((v,i,x)=>x.indexOf(v)===i)).slice(0,4).map(String),
      ans:-1,ansVal:String(jum),
      hint:`${baris} baris × ${satu} botol = <b>${jum}</b> botol.`};
  }

  // MUNASABAH: pilih anggaran yang paling munasabah
  const gandaan=R(1,Math.floor(had/10));
  const betul=10*gandaan;
  const n=betul+R(-2,2);
  const hadA=c.max||40;
  const o=[betul,betul*2,Math.max(5,Math.round(betul/2)),betul+20]
    .filter((v,i,x)=>x.indexOf(v)===i&&v>0&&v<=hadA*2);
  return{q:"Anggaran manakah paling munasabah?",
    qs:"Lihat sekali imbas — jangan bilang satu per satu",
    vis:objekAnggaran(Math.max(1,n),e),
    opts:shuffle(o).slice(0,4).map(x=>"Lebih kurang "+x),ans:-1,ansVal:"Lebih kurang "+betul,
    hint:`Bilangan sebenar ialah ${Math.max(1,n)}, jadi anggaran munasabah ialah <b>lebih kurang ${betul}</b>.`};
};

/* --- Kenali bundar (buku teks m/s 45-48): arnab & lubang, bundar songsang --- */
// nama nilai tempat yang dibundarkan, cth. 10 -> "puluh", 10000 -> "puluh ribu"
const namaBundar=ke=>NAMA_TEMPAT[Math.round(Math.log10(ke))]||fmt(ke);
// nama digit penentu (satu tempat di bawah tempat yang dibundarkan)
const digitPenentu=ke=>NAMA_TEMPAT[Math.round(Math.log10(ke))-1]||"sa";
ENJIN.bundar=c=>()=>{
  const ke=Array.isArray(c.ke)?pick(c.ke):(c.ke||10),max=c.max||100;
  const bentuk=pick(["arnab","arnab","songsang","tengah","suai"]);

  if(bentuk==="arnab"||bentuk==="tengah"){
    let n;
    if(bentuk==="tengah"){                      // kes khas: tepat di tengah
      const bawah0=R(1,Math.floor(max/ke)-1)*ke;
      n=bawah0+ke/2;
    }else{
      n=R(ke,max-ke); if(n%ke===0)n+=R(1,ke-1);
      if(n>max)n=max-R(1,ke-1);
    }
    const bawah=Math.floor(n/ke)*ke,atas=bawah+ke;
    const jwp=(n-bawah)>=ke/2?atas:bawah;
    let tick="";
    for(let i=0;i<=10;i++){const pp=i*10,v=bawah+ke*i/10;
      tick+=`<div class="nltick" style="left:${pp}%"></div>`;
      if(i===0||i===5||i===10)tick+=`<div class="nllbl" style="left:${pp}%">${fmt(v)}</div>`;}
    return{q:`Bundarkan <b>${fmt(n)}</b> kepada ${namaBundar(ke)} terdekat`,
      vis:`<div class="numline">${tick}<div class="nlbar"></div>
        <div class="hole" style="left:0%"></div><div class="hole" style="left:100%"></div>
        <div class="nldot" style="left:${(n-bawah)/ke*100}%">🐰</div></div>
        <div class="hint">Arnab di ${fmt(n)}. Lubang lobak mana lebih dekat?</div>`,
      opts:shuffle([bawah,atas]).map(fmt),ans:-1,ansVal:fmt(jwp),
      hint:bentuk==="tengah"
        ?`${fmt(n)} terletak <b>tepat di tengah</b> antara ${fmt(bawah)} dan ${fmt(atas)}. Hukumnya: bundar ke atas → <b>${fmt(atas)}</b>.`
        :`${fmt(n)} lebih dekat dengan <b>${fmt(jwp)}</b>. Hukum: separuh atau lebih → bundar ke atas.`};
  }

  if(bentuk==="songsang"){                      // buku teks m/s 47: pilih kad yang menjadi 60
    const sasar=R(1,Math.floor(max/ke)-1)*ke;
    const sah=[],tak=[];
    for(let v=sasar-ke/2;v<sasar+ke/2;v++)if(v>0&&v!==sasar)sah.push(v);
    while(tak.length<3){const v=R(1,max);if(Math.round(v/ke)*ke!==sasar&&!tak.includes(v))tak.push(v);}
    const betul=pick(sah);
    const susun=shuffle([betul,...tak]);
    return{kekalSusun:true,
      q:`Nombor manakah menjadi <b>${fmt(sasar)}</b> apabila dibundarkan kepada ${namaBundar(ke)} terdekat?`,
      vis:`<div class="urut">${susun.map(v=>`<div class="ubox">${fmt(v)}</div>`).join("")}</div>`,
      opts:susun.map(fmt),ans:-1,ansVal:fmt(betul),
      hint:`${fmt(betul)} dibundarkan menjadi <b>${fmt(sasar)}</b>. Nombor ${fmt(sasar-ke/2)} hingga ${fmt(sasar+ke/2-1)} semuanya menjadi ${fmt(sasar)}.`};
  }

  // suai: padankan nombor dengan nilai bundarnya
  const pasangan=[];
  while(pasangan.length<3){
    let n=R(ke,max-ke); if(n%ke===0)n+=R(1,ke-1);
    if(n>max)continue;
    const bundar=Math.round(n/ke)*ke;
    if(pasangan.some(x=>x[1]===fmt(bundar)||x[0]===fmt(n)))continue;
    pasangan.push([fmt(n),fmt(bundar)]);
  }
  return{mod:"interaktif",q:"Suaikan setiap nombor dengan nilai bundarnya",
    vis:komponenSuai(pasangan,`Bundarkan kepada ${namaBundar(ke)} terdekat, kemudian padankan.`),
    cek:()=>SUAIbetul(),
    ansVal:pasangan.map(x=>x[0]+"→"+x[1]).join(", "),
    hint:`Lihat digit ${digitPenentu(ke)}. Jika 5 atau lebih, bundar ke atas; jika kurang 5, bundar ke bawah.`};
};

/* --- Operasi asas --- */
ENJIN.ops=c=>()=>{
  const op=pick(c.op),max=c.max||10;
  let a,b,j;
  // --- Fakta asas: kedua-dua nombor satu digit (0-9), hasil tambah <= 18 ---
  if(c.fakta){
    if(op==="+"){a=R(0,9);b=R(0,9);j=a+b;}
    else{a=R(2,18);b=R(0,Math.min(9,a));j=a-b;}
    return soalOpsLazim(a,b,op==="-"?"−":op,j,
      op==="+"?`Fakta asas tambah: ${a} + ${b} = ${j}.`:`Fakta asas tolak: ${a} − ${b} = ${j}.`,
      op==="+"?"Fakta Asas Tambah":"Fakta Asas Tolak",c.gambar?[a,b,op]:null);
  }
  if(op==="+"){
    if(c.tiga){const x=R(1,Math.floor(max/3)),y=R(1,Math.floor(max/3)),z=R(1,Math.floor(max/3));
      return soalTambahTigaLazim(x,y,z,x+y+z);}
    if(c.kumpul&&max<=100){
      // mengumpul semula: digit sa mesti berjumlah 10 atau lebih
      const as=R(1,9),bs=R(10-as,9);
      const ap=R(1,Math.floor((max-10)/10)),bp=R(0,Math.max(0,Math.floor((max-10)/10)-ap));
      a=ap*10+as;b=bp*10+bs;j=a+b;
      if(j>max)return ENJIN.ops(c)();
      return soalOpsLazim(a,b,"+",j,
        `Sa: ${as} + ${bs} = ${as+bs} — kumpul semula 1 puluh. Jawapan ${j}.`,"Tambah (Kumpul Semula)");
    }
    a=R(1,max-1);b=R(1,max-a);j=a+b;   // jumlah tidak boleh melebihi had
  }else if(op==="-"){
    if(c.kumpul&&max<=100){
      // menolak dengan mengumpul semula: digit sa atas lebih kecil
      const as=R(0,8),bs=R(as+1,9);
      const ap=R(2,Math.max(2,Math.floor((max-9)/10))),bp=R(1,ap-1);
      a=ap*10+as;b=bp*10+bs;j=a-b;
      if(a>max)return ENJIN.ops(c)();
      return soalOpsLazim(a,b,"−",j,
        `Sa: ${as} lebih kecil daripada ${bs}, jadi kumpul semula 1 puluh daripada ${ap} puluh. Jawapan ${j}.`,"Tolak (Kumpul Semula)");
    }
    a=R(2,max);b=R(1,a);j=a-b;
  }else if(op==="×"){
    if(c.digit){
      const lo=Math.pow(10,c.digit-1),hi=Math.pow(10,c.digit)-1;
      a=R(lo,hi);b=R(2,Math.min(max,9));j=a*b;
    }else if(c.besar){
      a=R(10,Math.min(max,99));b=R(10,99);j=a*b;
    }else{
      a=R(2,max);b=R(2,max);if(b>12)b=R(2,12);j=a*b;
    }
  }else{
    if(c.digit){
      const lo=Math.pow(10,c.digit-1),hi=Math.pow(10,c.digit)-1;
      b=R(2,Math.min(max,9));j=R(Math.ceil(lo/b),Math.floor(hi/b));a=b*j;
    }else if(c.besar){
      b=R(10,Math.min(max,99));j=R(10,99);a=b*j;
    }else{
      b=R(2,Math.min(max,12));j=R(2,Math.min(max,12));a=b*j;
    }
  }
  const t={"+":"Tambah","-":"Tolak","×":"Darab","÷":"Bahagi"}[op];
  const hint={"+":`${fmt(a)} + ${fmt(b)} = ${fmt(j)}`,"-":`${fmt(a)} − ${fmt(b)} = ${fmt(j)}`,
    "×":`${fmt(a)} × ${fmt(b)} = ${fmt(j)} (${fmt(b)} kumpulan ${fmt(a)})`,
    "÷":`${fmt(a)} ÷ ${fmt(b)} = ${fmt(j)}`}[op];
  if(op==="+"||op==="-")return soalOpsLazim(a,b,op==="-"?"−":op,j,hint,t,
    (c.gambar||Math.max(a,b)<=10)?[a,b,op]:null);
  if(op==="×")return soalDarabTeknikal(a,b,t);
  if(op==="÷")return soalBahagiTeknikal(a,b,j,0,t);
  return soalOpsTaip(`${fmt(a)} ${op} ${fmt(b)}`,j,hint,t,c.masa);
};
/* visual konkrit untuk pengenalan tambah & tolak (Tahun 1) */
function gambarOps(a,b,op){
  const e=pick(OBJ);
  if(op==="+")
    return `<div class="objwrap" style="gap:14px">
      <span style="display:inline-flex;flex-wrap:wrap;gap:5px;max-width:200px;justify-content:center">${Array(a).fill(`<span class="obj">${e}</span>`).join("")}</span>
      <span style="font-size:32px;font-weight:900;color:var(--p1)">+</span>
      <span style="display:inline-flex;flex-wrap:wrap;gap:5px;max-width:200px;justify-content:center">${Array(b).fill(`<span class="obj">${e}</span>`).join("")}</span></div>`;
  return `<div class="objwrap" style="gap:5px;max-width:340px;margin:0 auto">
    ${Array(a-b).fill(`<span class="obj">${e}</span>`).join("")}
    ${Array(b).fill(`<span class="obj" style="opacity:.25;text-decoration:line-through">${e}</span>`).join("")}</div>
    <div class="hint">${b} daripada ${a} objek dibuang (ditanda ✕).</div>`;
}
function soalOpsTaip(ayat,j,hint,tajuk,masa,gbr){
  const g=(gbr&&gbr[0]<=10&&gbr[1]<=10&&gbr[0]>0)?gambarOps(gbr[0],gbr[1],gbr[2]):"";
  return{mod:"interaktif",q:tajuk?tajuk:"Kira",qs:"",
    vis:g+`<div class="objwrap" style="font-size:clamp(20px,3.6vh,31px);font-weight:900;letter-spacing:2px">${ayat} = ?</div>`
      +padNombor("Tulis jawapan sendiri, kemudian tekan ⏎."),
    cek:()=>INP!==""&&parseInt(INP,10)===j,ansVal:fmt(j),hint:hint,masa:masa};
}
function soalOps(ayat,j,hint,tajuk,masa,gbr){
  const darab=String(ayat).replace(/,/g,"").match(/^\s*(\d+)\s*×\s*(\d+)\s*$/);
  if(darab)return soalDarabTeknikal(+darab[1],+darab[2],tajuk);
  const bahagi=String(ayat).replace(/,/g,"").match(/^\s*(\d+)\s*÷\s*(\d+)\s*$/);
  if(bahagi){
    const dividen=+bahagi[1],pembahagi=+bahagi[2];
    return soalBahagiTeknikal(dividen,pembahagi,Math.floor(dividen/pembahagi),
      dividen%pembahagi,tajuk);
  }
  return soalOpsTaip(ayat,j,hint,tajuk,masa,gbr);
}

/* --- Tambah/Tolak Cepat & Mudah (buku teks m/s 60-67, 80-82) ---
   Jawapan ditaip seperti kalkulator, dengan bantuan gambar di atasnya. --- */
function bentukLazim(a,b,op){
  const A=String(a).padStart(2," "),B=String(b).padStart(2," ");
  const sel=x=>x===" "?"":x;
  return `<div class="lazim">
    <div></div><div class="lz-h">puluh</div><div class="lz-h">sa</div>
    <div></div><div class="lz-d">${sel(A[0])}</div><div class="lz-d">${A[1]}</div>
    <div class="lz-op">${op}</div><div class="lz-d">${sel(B[0])}</div><div class="lz-d">${B[1]}</div>
    <div class="lz-garis"></div>
    <div></div><div class="lz-d lz-jwp">?</div><div class="lz-d lz-jwp">?</div>
  </div>`;
}
function garisTerus(mula,langkah,saiz){
  let s=`<div class="tstep mula">${fmt(mula)}</div>`;
  let v=mula;
  for(let i=0;i<langkah;i++){
    v+=saiz;
    s+=`<div class="tarrow">+${saiz}→</div><div class="tstep${i===langkah-1?" akhir":""}">${i===langkah-1?"?":fmt(v)}</div>`;
  }
  return `<div class="terus">${s}</div>`;
}
function cerakinHtml(a,b){
  const ap=Math.floor(a/10)*10,as=a%10,bp=Math.floor(b/10)*10,bs=b%10;
  return `<div class="cerak">
    <div class="cbox">${fmt(ap)}</div><div>+</div><div class="cbox">${as}</div>
    <div style="color:var(--dim)">dan</div>
    <div class="cbox">${fmt(bp)}</div><div>+</div><div class="cbox">${bs}</div>
  </div><div class="hint">Cerakinkan kedua-dua nombor, tambah puluh dengan puluh dan sa dengan sa.</div>`;
}
ENJIN.kiraKalkulator=c=>()=>{
  const op=pick(c.op||["+"]);
  const tambah=op==="+";
  INP="";
  const cepat=Math.random()<.45;          // "Cepat" = fakta asas satu digit
  let a,b,j,bantuan,tajuk,petua;

  if(cepat){
    if(tambah){a=R(0,9);b=R(0,9);j=a+b;}
    else{a=R(2,18);b=R(0,Math.min(9,a));j=a-b;}
    tajuk=tambah?"Tambah Cepat":"Tolak Cepat";
    const e=pick(OBJ);
    bantuan=tambah
      ?`<div class="objwrap" style="gap:clamp(8px,1.8vh,16px)">
          <span style="display:inline-flex;flex-wrap:wrap;gap:4px;max-width:150px;justify-content:center">
            ${Array(a).fill(`<span class="obj">${e}</span>`).join("")||'<span style="color:var(--dim);font-size:13px">tiada</span>'}</span>
          <span style="font-size:clamp(20px,3.4vh,28px);font-weight:900;color:var(--p1)">+</span>
          <span style="display:inline-flex;flex-wrap:wrap;gap:4px;max-width:150px;justify-content:center">
            ${Array(b).fill(`<span class="obj">${e}</span>`).join("")||'<span style="color:var(--dim);font-size:13px">tiada</span>'}</span>
        </div>`
      :`<div class="objwrap" style="gap:4px;max-width:330px;margin:0 auto">
          ${Array(a-b).fill(`<span class="obj">${e}</span>`).join("")}
          ${Array(b).fill(`<span class="obj" style="opacity:.25;text-decoration:line-through">${e}</span>`).join("")}
        </div><div class="hint">${b} daripada ${a} objek dibuang.</div>`;
    petua=`Fakta asas: ${a} ${op} ${b} = <b>${j}</b>.`;
  }else{
    tajuk=tambah?"Tambah Mudah":"Tolak Mudah";
    const gaya=pick(["lazim","lazim","terus","puluh","cerakin"]);
    if(gaya==="puluh"){                    // gandaan sepuluh
      const ap=R(1,4),bp=R(1,9-ap);
      a=ap*10;b=bp*10;j=tambah?a+b:Math.max(a,b)-Math.min(a,b);
      if(!tambah){const x=Math.max(a,b),y=Math.min(a,b);a=x;b=y;j=a-b;}
      bantuan=garisTerus(tambah?a:a-b*0,tambah?b/10:0,10);
      if(!tambah)bantuan=bentukLazim(a,b,"−");
      petua=`${fmt(a)} ${op} ${fmt(b)}: kira puluh sahaja — ${a/10} puluh ${tambah?"+":"−"} ${b/10} puluh = ${j/10} puluh = <b>${fmt(j)}</b>.`;
    }else if(gaya==="terus"){              // bilang terus
      if(tambah){a=R(11,90);b=R(1,8);j=a+b;}
      else{a=R(12,99);b=R(1,8);j=a-b;}
      bantuan=tambah?garisTerus(a,b,1)
        :`<div class="terus">${Array.from({length:b+1},(_,i)=>
            `<div class="tstep${i===0?" mula":i===b?" akhir":""}">${i===b?"?":fmt(a-i)}</div>`
            +(i<b?'<div class="tarrow">←−1</div>':"")).join("")}</div>`;
      petua=`Bilang ${tambah?"terus":"menurun"} ${b} langkah daripada ${fmt(a)} → <b>${fmt(j)}</b>.`;
    }else if(gaya==="cerakin"){
      const as=R(1,4),bs=R(1,5-as);
      const ap=R(1,4),bp=R(1,9-ap);
      a=ap*10+as;b=bp*10+bs;j=a+b;
      if(!tambah){const x=Math.max(a,b),y=Math.min(a,b);
        a=Math.max(x,y);b=Math.min(x,y);
        if(a%10<b%10)a+=(b%10-a%10);
        j=a-b;}
      bantuan=cerakinHtml(a,b);
      petua=tambah
        ?`${Math.floor(a/10)*10} + ${Math.floor(b/10)*10} = ${Math.floor(a/10)*10+Math.floor(b/10)*10}, `
          +`${a%10} + ${b%10} = ${a%10+b%10}. Jumlah: <b>${fmt(j)}</b>.`
        :`${fmt(a)} − ${fmt(b)} = <b>${fmt(j)}</b> (tolak puluh dengan puluh, sa dengan sa).`;
    }else{                                  // bentuk lazim
      const as=R(1,4),bs=R(0,5-as);
      const ap=R(1,4),bp=R(0,9-ap);
      a=ap*10+as;b=bp*10+bs;j=a+b;
      if(!tambah){const x=Math.max(a,b),y=Math.min(a,b);a=x;b=y;
        if(a%10<b%10)a+=(b%10-a%10);
        j=a-b;}
      bantuan=bentukLazim(a,b,tambah?"+":"−");
      petua=`Kira sa dahulu: ${a%10} ${op} ${b%10} = ${tambah?a%10+b%10:a%10-b%10}. `
        +`Kemudian puluh: ${Math.floor(a/10)} ${op} ${Math.floor(b/10)} = ${tambah?Math.floor(a/10)+Math.floor(b/10):Math.floor(a/10)-Math.floor(b/10)} puluh. `
        +`Jawapan <b>${fmt(j)}</b>.`;
    }
  }
  if(j<0||j>(c.max||100))return ENJIN.kiraKalkulator(c)();
  return soalJalanKerjaTerus({q:tajuk,
    vis:bantuan
      +`<div class="objwrap" style="font-size:clamp(22px,4vh,34px);font-weight:900;letter-spacing:2px;margin-top:clamp(5px,1.1vh,10px)">${fmt(a)} ${op} ${fmt(b)} = ?</div>`,
    ansVal:fmt(j),hint:petua},
    "Pilih cara buku teks → Kira mengikut nilai tempat atau bilang → Semak jawapan");
};

/* --- Tambah/Tolak Lagi: bentuk lazim INTERAKTIF dengan kumpul semula.
   Bilangan digit ditetapkan melalui c.digit — enjin yang sama untuk semua tahun. --- */
ENJIN.lazimInteraktif=c=>()=>{
  const tambah=(c.op||"+")==="+";
  const nd=c.digit||2;
  const lo=Math.pow(10,nd-1),hi=Math.pow(10,nd)-1;
  let a,b;
  if(tambah){
    const as=R(1,9),bs=R(10-as,9);
    a=R(lo,hi);a=a-a%10+as;
    b=R(Math.max(1,Math.floor(lo/10)),Math.floor(hi/2));b=b-b%10+bs;
    if(a<lo||b<1)return ENJIN.lazimInteraktif(c)();
  }else{
    const as=R(0,8),bs=R(as+1,9);
    a=R(lo,hi);a=a-a%10+as;
    // 1 daripada 4 soalan (3 digit ke atas) melibatkan pinjam berantai — cth 305 − 76
    const mahuRantai=nd>=3&&Math.random()<.25;
    if(nd>=3){
      const adaSifar=Math.floor(a/10)%10===0;
      if(mahuRantai&&!adaSifar)a=a-((Math.floor(a/10)%10)*10);      // jadikan digit puluh sifar
      if(!mahuRantai&&adaSifar)a=a+R(1,9)*10;
      if(a>hi)return ENJIN.lazimInteraktif(c)();
    }else if(Math.floor(a/10)%10===0)return ENJIN.lazimInteraktif(c)();
    b=R(Math.max(1,Math.floor(lo/10)),Math.max(2,Math.floor(a/2)));b=b-b%10+bs;
    if(a-b<0||b<1)return ENJIN.lazimInteraktif(c)();
  }
  const j=tambah?a+b:a-b;
  if(c.had&&j>c.had)return ENJIN.lazimInteraktif(c)();   // hormati had nombor tahun
  const as=a%10,bs=b%10;
  return{mod:"interaktif",
    q:tambah?"Tambah dengan <b>kumpul semula</b>":"Tolak dengan <b>kumpul semula</b>",
    vis:komponenLazim(a,b,tambah?"+":"−",
      tambah?"Taip jumlah setiap lajur bermula dari sa. Lebihan naik ke lajur sebelah."
            :"Kumpul semula jika perlu, kemudian taip jawapan setiap lajur."),
    cek:()=>LZMbetul(),
    ansVal:fmt(j),
    hint:tambah
      ?`Sa: ${as} + ${bs} = ${as+bs} — melebihi 10, jadi <b>1 puluh naik</b> ke lajur sebelah. `
        +`Teruskan lajur demi lajur. Jawapan <b>${fmt(j)}</b>.`
      :`Sa: ${as} lebih kecil daripada ${bs}, jadi <b>1 puluh ditukar kepada 10 sa</b> — ${as} menjadi ${as+10}. `
        +`Teruskan lajur demi lajur. Jawapan <b>${fmt(j)}</b>.`};
};

/* --- Bina Sifir (buku T2 m/s 84, 99): lengkapkan jadual sifir --- */
let GILIR_BAHAGI_SIFAR_T2=0;
ENJIN.sifir=c=>()=>{
  if(c.bahagi&&c.sifar&&GILIR_BAHAGI_SIFAR_T2++%3===0){
    const pembahagi=R(2,10);
    return{q:"Bahagi melibatkan sifar",vis:`<div class="ref" style="text-align:center">
        Tiada objek untuk dikongsi kepada <b>${pembahagi}</b> kumpulan.<br>
        <span style="font-size:clamp(24px,4vh,34px);font-weight:950">0 ÷ ${pembahagi} = ?</span></div>`,
      opts:["0","1",String(pembahagi),"Tidak boleh"],ans:-1,ansVal:"0",
      hint:`0 dibahagi dengan sebarang nombor selain 0 ialah 0. Jadi 0 ÷ ${pembahagi} = 0. Nombor tidak boleh dibahagi dengan 0.`};
  }
  const s=pick(c.sifir);
  const bahagi=!!c.bahagi;
  // 55% soalan: lengkapkan jadual sifir (kaedah buku)
  if(Math.random()<.55){
    const urutan=[];
    for(let i=1;i<=10;i++)urutan.push(bahagi?i:s*i);
    const kosong=shuffle([3,4,5,6,7,8,9]).slice(0,3).sort((x,y)=>x-y);
    const baris=urutan.map((v,i)=>{
      const k=kosong.indexOf(i);
      const kiri=bahagi?`${fmt(s*(i+1))} ÷ ${s}`:`${i+1} × ${s}`;
      return `<tr><td style="padding:2px 8px 2px 0;text-align:right;font-family:monospace;
        font-size:clamp(12px,2vh,16px)">${kiri} =</td>
        <td style="font-weight:900;color:${k<0?"var(--p2)":"var(--p1)"};font-size:clamp(13px,2.2vh,17px)">${k<0?fmt(v):"?"}</td></tr>`;
    }).join("");
    return{mod:"interaktif",
      q:`Lengkapkan <b>sifir ${bahagi?"bahagi":"darab"} ${s}</b>`,
      vis:`<div class="ref" style="max-height:26vh"><table style="margin:0 auto">${baris}</table></div>`
        +komponenIsi(urutan,kosong,umpanBank(urutan,2,120),
          "Klik nombor di bawah untuk melengkapkan sifir."),
      cek:()=>ISIbetul(),
      ansVal:kosong.map(i=>fmt(urutan[i])).join(", "),
      hint:bahagi?`Sifir bahagi ${s} ialah songsangan sifir darab ${s}.`
        :`Sifir ${s} bertambah ${s} setiap kali: ${s}, ${s*2}, ${s*3}, …`};
  }
  const b=R(1,10);
  if(bahagi){const hh=s*b;
    return soalOps(`${fmt(hh)} ÷ ${fmt(s)}`,b,`Sifir ${s}: ${s} × ${b} = ${hh}, jadi ${hh} ÷ ${s} = ${b}.`,"Sifir Bahagi "+s);}
  return soalOps(`${fmt(s)} × ${fmt(b)}`,s*b,`${b} kumpulan ${s} = ${s*b}.`,"Sifir Darab "+s);
};

/* --- Bahagi berbaki (buku T2 m/s 109) --- */
ENJIN.bahagiBaki=c=>()=>{
  const pembahagi=R(2,9);
  const hasil=R(2,9);
  const baki=R(1,pembahagi-1);
  const jum=pembahagi*hasil+baki;
  return soalBahagiTeknikal(jum,pembahagi,hasil,baki,"Bahagi berbaki",
    `Ada <b>${jum}</b> keping kad dibahagi sama banyak kepada <b>${pembahagi}</b> orang. `
      +`Lengkapkan bentuk lazim: berapa seorang dapat, dan berapa bakinya?`);
};

/* --- Tambah berulang / tolak berturut --- */
ENJIN.berulang=c=>()=>{
  const n=R(2,c.max||5),k=R(2,5),e=pick(OBJ);
  let h="";for(let i=0;i<k;i++)h+=`<div style="display:inline-block;background:#0d1233;border:2px dashed var(--line);border-radius:11px;padding:9px;margin:4px">${Array(n).fill(`<span style="font-size:22px">${e}</span>`).join("")}</div>`;
  if(c.mod==="tambah"){
    let cara="";for(let i=2;i<=k;i++)cara+=`${n*(i-1)} + ${n} = ${n*i}. `;
    return soalJalanKerjaTerus({q:`Tambah berulang: ${k} kumpulan, setiap satu ${n}`,
      vis:`<div style="text-align:center">${h}</div>`,ansVal:String(n*k),
      hint:`${cara}${Array(k).fill(n).join(" + ")} = ${n*k}. Ini asas darab: ${n} × ${k}.`},
      "Gabungkan satu kumpulan pada satu masa → Catat jumlah baharu → Semak dengan darab");
  }
  const t=n*k;
  let cara="",baki=t;for(let i=1;i<=k;i++){cara+=`${baki} − ${n} = ${baki-n}. `;baki-=n;}
  return soalJalanKerjaTerus({q:`${t} tolak ${n} berturut-turut sehingga sifar. Berapa kali?`,
    vis:`<div class="objwrap" style="font-size:20px;font-weight:800">${t} − ${n} − ${n} … = 0</div>`,
    ansVal:String(k),hint:`${cara}${t} ÷ ${n} = ${k} kali. Ini asas bahagi.`},
    "Tolak nilai yang sama berulang kali → Kira bilangan langkah → Semak dengan bahagi");
};

/* --- Operasi bergabung --- */
ENJIN.bergabung=c=>()=>{
  const max=Math.min(c.max||100,999);
  // Operasi bergabung berkurungan: kurungan didahulukan.
  // Pengecoh utama ialah jawapan bila murid mengabaikan kurungan dan mengira ikut hukum biasa.
  if(c.kurungan){
    const a=R(2,12),b=R(2,12),k=R(2,9);
    let ayat,j,salah,cara;
    switch(pick(["tambahDarab","darabTambah","tolakDarab","tambahBahagi"])){
      case "tambahDarab":
        ayat=`(${a} + ${b}) × ${k}`;j=(a+b)*k;salah=a+b*k;
        cara=`Kira dalam kurungan dahulu: ${a} + ${b} = ${a+b}. Kemudian ${a+b} × ${k} = ${j}.`;break;
      case "darabTambah":
        ayat=`${k} × (${a} + ${b})`;j=k*(a+b);salah=k*a+b;
        cara=`Kira dalam kurungan dahulu: ${a} + ${b} = ${a+b}. Kemudian ${k} × ${a+b} = ${j}.`;break;
      case "tolakDarab":{
        // pastikan beza bukan sifar - (7 - 7) x k = 0 bukan soalan yang bermakna
        let a2=a,b2=b; if(a2===b2)b2=(b2>2?b2-1:b2+1);
        const besar=Math.max(a2,b2),kecil=Math.min(a2,b2);
        ayat=`(${besar} − ${kecil}) × ${k}`;j=(besar-kecil)*k;salah=besar-kecil*k;
        cara=`Kira dalam kurungan dahulu: ${besar} − ${kecil} = ${besar-kecil}. Kemudian ${besar-kecil} × ${k} = ${j}.`;break;}
      default:{
        const hasil=R(2,9);const jum=k*hasil;const p=R(1,jum-1);const q2=jum-p;
        ayat=`(${p} + ${q2}) ÷ ${k}`;j=hasil;salah=p+Math.round(q2/k);
        cara=`Kira dalam kurungan dahulu: ${p} + ${q2} = ${jum}. Kemudian ${jum} ÷ ${k} = ${j}.`;}
    }
    const o=[...new Set([j,salah,j+k,Math.abs(j-k)])].filter(x=>x>=0&&x<=max*10);
    // tambah pengecoh baharu sahaja - jangan sesekali ulang nilai yang sudah ada
    let tokok=1;
    while(o.length<4&&tokok<60){const calon=j+tokok;if(!o.includes(calon))o.push(calon);tokok++;}
    return soalJalanKerjaTerus({q:"Operasi Bergabung",qs:"",
      vis:`<div class="objwrap" style="font-size:clamp(20px,3.6vh,31px);font-weight:900;letter-spacing:2px">${ayat} = ?</div>`,
      opts:shuffle(o).slice(0,4).map(fmt),ans:-1,ansVal:fmt(j),
      hint:`Operasi dalam <b>kurungan</b> mesti dikira dahulu. ${cara}`},
      "Kurungan dahulu → Darab atau bahagi → Tambah atau tolak → Semak");
  }
  if(c.op.includes("×")&&Math.random()<.5){
    const a=R(2,9),b=R(2,9),d=R(1,20);
    const j=a*b+d;
    return soalJalanKerjaTerus({q:"Operasi Bergabung",
      vis:`<div class="objwrap" style="font-size:clamp(20px,3.6vh,31px);font-weight:900">${a} × ${b} + ${d} = ?</div>`,
      ansVal:fmt(j),hint:`Darab dahulu: ${a} × ${b} = ${a*b}. Kemudian ${a*b} + ${d} = ${j}.`},
      "Darab atau bahagi dahulu → Tambah atau tolak → Semak");
  }
  const a=R(10,max),b=R(1,Math.floor(max/2)),d=R(1,Math.floor(max/2));
  const j=a+b-d;
  if(j<0)return ENJIN.bergabung(c)();
  return soalJalanKerjaTerus({q:"Operasi Bergabung",
    vis:`<div class="objwrap" style="font-size:clamp(20px,3.6vh,31px);font-weight:900">${fmt(a)} + ${fmt(b)} − ${fmt(d)} = ?</div>`,
    ansVal:fmt(j),hint:`Kira dari kiri ke kanan: ${a} + ${b} = ${a+b}. Kemudian ${a+b} − ${d} = ${j}.`},
    "Tambah dan tolak sama taraf → Kira dari kiri ke kanan → Semak");
};

/* --- Anu (kotak kosong) --- */
ENJIN.anu=c=>()=>{
  const op=pick(c.op),max=c.max||100;
  let a,b,j,ayat;
  if(op==="+"){a=R(1,max);b=R(1,max);j=a+b;ayat=`${a} + ▢ = ${j}`;}
  else if(op==="-"){a=R(10,max);b=R(1,a);j=a-b;ayat=`${a} − ▢ = ${j}`;}
  else if(op==="×"){a=R(2,12);b=R(2,12);j=a*b;ayat=`${a} × ▢ = ${j}`;}
  else{b=R(2,12);j=R(2,12);a=b*j;ayat=`${a} ÷ ▢ = ${j}`;}
  return{q:"Cari nilai <b>Anu</b> (▢)",vis:`<div class="objwrap" style="font-size:clamp(19px,3.4vh,29px);font-weight:900;letter-spacing:2px">${ayat}</div>`,
    opts:shuffle([b,b+1,Math.max(1,b-1),b+2]).filter((v,i,a2)=>a2.indexOf(v)===i).slice(0,4).map(String),
    ans:-1,ansVal:String(b),
    hint:`Anu ialah kuantiti yang tidak diketahui. Di sini ▢ = ${b}.`};
};

/* --- Pecahan --- */
ENJIN.pecahan=c=>{
  const modAsal=c.mod||"kenal";
  const senaraiSah=[...new Set((c.senarai||[]).map(String))].filter(x=>{
    const m=x.match(/^(\d+)\/(\d+)$/);return m&&+m[1]>0&&+m[1]<+m[2];
  });
  const fokusAsas=c.fokus==="asas";
  const fokusDuaTigaSuku=c.fokus==="dua-tiga-suku";
  let giliranPecahan=0,giliranTakwajar=0;
  const kitarAsas=[
    {nilai:"1/2",jenis:"tulis",gaya:"bulatan"},
    {nilai:"1/4",jenis:"pilih",gaya:"segiempat"},
    {nilai:"1/2",jenis:"warna",gaya:"jalur"},
    {nilai:"1/4",jenis:"tulis",gaya:"bulatan"},
    {nilai:"1/2",jenis:"pilih",gaya:"segiempat"},
    {nilai:"1/4",jenis:"warna",gaya:"berlian"}
  ];
  const kitarSuku=[
    {nilai:"2/4",jenis:"tulis",gaya:"bulatan"},
    {nilai:"3/4",jenis:"pilih",gaya:"segiempat"},
    {nilai:"2/4",jenis:"warna",gaya:"jalur"},
    {nilai:"3/4",jenis:"tulis",gaya:"bulatan"},
    {nilai:"2/4",jenis:"pilih",gaya:"segiempat"},
    {nilai:"3/4",jenis:"warna",gaya:"berlian"}
  ];
  const kitarJenis={
    kenal:["tulis","pilih","warna","pilih","tulis","warna"],
    tulis:["tulis","pilih","warna","tulis","pilih","warna"],
    warna:["warna","pilih","tulis","warna","pilih","tulis"]
  };
  const pilihanPecahan=(isi,bhg)=>{
    const calon=[...senaraiSah,
      ...Array.from({length:Math.max(0,bhg-1)},(_,i)=>`${i+1}/${bhg}`),
      "1/2","1/3","2/3","1/4","2/4","3/4","1/5","2/5","3/5","4/5"];
    const salah=[...new Set(calon)].filter(x=>{
      const m=x.match(/^(\d+)\/(\d+)$/);if(!m)return false;
      const p=+m[1],q=+m[2];
      return p>0&&p<q&&!(p===isi&&q===bhg)&&p*bhg!==isi*q;
    });
    return shuffle([`${isi}/${bhg}`,...shuffle(salah).slice(0,3)]);
  };
  return()=>{
  const mod=modAsal;
  if(mod==="kenal"||mod==="warna"||mod==="tulis"){
    const nomborGiliran=giliranPecahan++;
    const khas=fokusAsas?kitarAsas[nomborGiliran%kitarAsas.length]
      :fokusDuaTigaSuku?kitarSuku[nomborGiliran%kitarSuku.length]:null;
    const nilaiKhas=khas?khas.nilai.split("/").map(Number):null;
    const bhg=nilaiKhas?nilaiKhas[1]:pick(c.bhg||[2,4]);
    const isi=nilaiKhas?nilaiKhas[0]:R(1,bhg-1);
    const nama=PECWORD[isi+"/"+bhg]||`${perkataan(isi)} per${bhg===2?"dua":bhg===3?"tiga":bhg===4?"empat":bhg===5?"lima":bhg===6?"enam":bhg===8?"lapan":perkataan(bhg)}`;
    const kaitan=isi===2&&bhg===4?" Dua perempat sama nilainya dengan satu perdua.":"";
    const jenis=khas?khas.jenis:(kitarJenis[mod]||kitarJenis.kenal)[nomborGiliran%6];
    if(jenis==="warna"){
      const gaya=khas&&khas.gaya?khas.gaya:pilihGayaWarnaPecahan(bhg);
      return{mod:"interaktif",interaksi:"warna-pecahan",
        q:`Warnakan model supaya menunjukkan <b>${isi}/${bhg}</b>.`,
        vis:komponenWarnaPecahan(bhg,isi,gaya),cek:()=>FRWbetul(),ansVal:`${isi}/${bhg}`,
        kunciModel:`${isi}/${bhg}|${gaya}`,
        kunciCorak:`${isi}/${bhg}|warna`,
        hint:`Penyebut ${bhg} bermaksud model dibahagi kepada ${bhg} bahagian sama besar. Warnakan ${isi} bahagian.${kaitan}`};
    }
    if(mod==="kenal"&&!khas&&Math.random()<.2){
      const asal=c.senarai||["1/2","1/3","1/4","2/3","2/4","3/4","1/5","3/5"];
      const senarai=[...new Set(asal)].filter(x=>{const [p,q]=x.split("/").map(Number);return p>0&&p<q;});
      if(senarai.length>=3){
        const pasangan=shuffle(senarai).slice(0,3).map(x=>{
          const[p,q]=x.split("/").map(Number);
          const nm=PECWORD[x]||`${perkataan(p)} per${q===2?"dua":q===3?"tiga":q===4?"empat":q===5?"lima":q===6?"enam":q===8?"lapan":perkataan(q)}`;
          return[miniPecahan(p,q),nm];
        });
        return{mod:"interaktif",interaksi:"suai-pecahan",q:"Suaikan setiap model pecahan dengan namanya.",
          vis:komponenSuai(pasangan,"Klik model di kiri, kemudian klik nama pecahan yang sepadan."),
          cek:()=>SUAIbetul(),ansVal:"semua padanan betul",
          hint:"Kira bahagian berwarna sebagai pengangka dan jumlah semua bahagian sebagai penyebut."};
      }
    }
    // Model ringkas: murid sama ada menulis pecahan atau memilih jawapan.
    const gaya=khas&&khas.gaya?khas.gaya:pick(["bulatan","segiempat","jalur"]);
    const asas={
      q:jenis==="tulis"?"Tulis pecahan yang ditunjukkan oleh model.":"Pilih pecahan yang ditunjukkan oleh model.",
      vis:modelPecahan(bhg,isi,"",false,false,gaya,true),
      ans:-1,ansVal:isi+"/"+bhg,kunciModel:`${isi}/${bhg}|${gaya}`,
      kunciCorak:`${isi}/${bhg}|${jenis}`,
      hint:`${isi} daripada ${bhg} bahagian sama besar = ${isi}/${bhg} (${nama}).${kaitan}`
    };
    if(jenis==="pilih"){
      asas.opts=pilihanPecahan(isi,bhg);
      asas.kekalPilihan=true;
      asas.interaksi="pilih-pecahan";
    }else{
      asas.opts=[];
      asas.jawapanTepat=true;
      asas.interaksi="tulis-pecahan";
    }
    return asas;
  }
  if(mod==="banding"){
    const jenis=R(0,2);
    if(jenis===0){
      const bhg=pick([2,3,4,5,6,8]);let a=R(1,bhg-1),b=R(1,bhg-1);
      if(a===b)return ENJIN.pecahan(c)();
      return{q:"Bandingkan model. Manakah pecahan lebih besar?",
        vis:visualOperasiPecahan(a,b,bhg,"?"),
        opts:[a+"/"+bhg,b+"/"+bhg],ans:a>b?0:1,
        hint:`Penyebut sama, jadi bandingkan pengangka: ${Math.max(a,b)} > ${Math.min(a,b)}.`};
    }
    if(jenis===1){
      const[q1,q2]=pick([[2,4],[3,6],[4,8],[5,10],[3,9],[4,6]]);
      const p=R(1,Math.min(q1,q2)-1),simbol=q1<q2?">":"<";
      return{q:`Pilih simbol yang betul: ${p}/${q1} □ ${p}/${q2}`,
        vis:visualOperasiPecahanBebas(p,q1,p,q2,"□"),
        opts:["<",">","="],ans:-1,ansVal:simbol,
        hint:`Pengangka sama. Bahagian daripada ${q1} bahagian ${q1<q2?"lebih besar":"lebih kecil"} daripada bahagian daripada ${q2}.`};
    }
    const[p,q,k]=pick([[1,2,2],[1,3,2],[2,3,2],[1,4,3],[3,4,2]]);
    return{q:`Pilih simbol yang betul: ${p}/${q} □ ${p*k}/${q*k}`,
      vis:visualOperasiPecahanBebas(p,q,p*k,q*k,"□"),
      opts:["<",">","="],ans:-1,ansVal:"=",
      hint:`Kedua-dua model meliputi bahagian yang sama. ${p}/${q} dan ${p*k}/${q*k} ialah pecahan setara.`};
  }
  if(mod==="setara"){
    if(Math.random()<.28){
      const pasangan=shuffle([
        [miniPecahan(1,2),miniPecahan(2,4)],
        [miniPecahan(1,3),miniPecahan(2,6)],
        [miniPecahan(2,3),miniPecahan(4,6)],
        [miniPecahan(1,4),miniPecahan(2,8)]
      ]).slice(0,3);
      return{mod:"interaktif",interaksi:"suai-pecahan-setara",
        q:"Padankan model-model yang menunjukkan nilai pecahan yang sama.",
        vis:komponenSuai(pasangan,"Bandingkan keluasan berwarna, bukan hanya nombornya."),
        cek:()=>SUAIbetul(),ansVal:"semua pecahan setara dipadankan",
        hint:"Pecahan setara mempunyai nilai yang sama walaupun pengangka dan penyebutnya berbeza."};
    }
    const p=R(1,4),q=R(p+1,8),k=R(2,4);
    const betul=(p*k)+"/"+(q*k);
    if(Math.random()<.5){
      return soalPecahanBerlangkah(
        `Lengkapkan tempat kosong: ${p}/${q} = ${p*k}/□`,
        modelPecahan(q,p,"Cari faktor pengganda yang sama",false,true)
          +`<div class="frac-rule">${pecahanBadge(p,q)} <b>=</b> ${pecahanBadge(p*k,"□")}</div>`,
        [
          langkahPecahan("Cari faktor pengganda",`${p*k} ÷ ${p} = ?`,k),
          langkahPecahan("Darab penyebut",`${q} × ${k} = ?`,q*k),
          langkahPecahan("Lengkapkan pecahan",`${p}/${q} = ?`,betul)
        ],betul,
        `Pengangka didarab dengan ${k}; penyebut juga mesti didarab dengan ${k}. Jadi ${p}/${q}=${betul}.`,
        "Cari perubahan pada pengangka → Gunakan faktor sama pada penyebut → Semak nilai kekal"
      );
    }
    return soalPecahanBerlangkah(
      `Lengkapkan pecahan setara ${p}/${q}. Darab pengangka dan penyebut dengan ${k}.`,
      modelPecahan(q,p,"Nilainya kekal apabila kedua-duanya didarab",false,true),
      [
        langkahPecahan("Darab pengangka",`${p} × ${k} = ?`,p*k),
        langkahPecahan("Darab penyebut",`${q} × ${k} = ?`,q*k),
        langkahPecahan("Pecahan setara",`${p}/${q} = ?`,betul)
      ],betul,
      `Darab pengangka dan penyebut dengan nombor yang sama: (${p}×${k})/(${q}×${k}) = ${betul}.`,
      "Darab pengangka dan penyebut dengan nombor yang sama → Nilai pecahan kekal"
    );
  }
  if(mod==="termudah"){
    const asas=pick([[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[1,6],[5,6]]);
    const k=pick([2,3,4].filter(x=>asas[1]*x<=12));
    const p2=asas[0]*k,q2=asas[1]*k;
    const betul=`${asas[0]}/${asas[1]}`;
    return soalPecahanBerlangkah(
      `Tulis ${p2}/${q2} dalam <b>bentuk termudah</b>.`,
      modelPecahan(q2,p2,"Cari faktor sepunya pengangka dan penyebut",false,true),
      [
        langkahPecahan("Bahagi pengangka",`${p2} ÷ ${k} = ?`,asas[0]),
        langkahPecahan("Bahagi penyebut",`${q2} ÷ ${k} = ?`,asas[1]),
        langkahPecahan("Bentuk termudah",`${p2}/${q2} = ?`,betul)
      ],betul,
      `Bahagi pengangka dan penyebut dengan faktor sepunya ${k}: (${p2}÷${k})/(${q2}÷${k}) = ${betul}.`,
      "Cari faktor sepunya → Bahagi pengangka dan penyebut → Semak tiada lagi faktor sepunya"
    );
  }
  if(mod==="takwajar"){
    const bhg=pick([2,3,4,5]),bulat=R(1,3),baki=R(1,bhg-1);
    const peng=bulat*bhg+baki;
    const betul=`${bulat} ${baki}/${bhg}`;
    const keTakWajar=c.mangkuk?(giliranTakwajar++%2===1):Math.random()<.5;
    if(keTakWajar){
      const takWajar=`${peng}/${bhg}`;
      return soalPecahanBerlangkah(
        `Tukar nombor bercampur ${betul} kepada pecahan tak wajar.`,
        visualPecahanTakwajar(peng,bhg),
        [
          langkahPecahan("Darab nombor bulat dengan penyebut",`${bulat} × ${bhg} = ?`,bulat*bhg),
          langkahPecahan("Tambah pengangka",`${bulat*bhg} + ${baki} = ?`,peng),
          langkahPecahan("Tulis pecahan tak wajar",`Pengangka baharu/penyebut asal = ?`,takWajar)
        ],takWajar,
        `${bulat}×${bhg}=${bulat*bhg}; tambah ${baki} menjadi ${peng}. Penyebut kekal ${bhg}, jadi ${takWajar}.`,
        "Darab nombor bulat dengan penyebut → Tambah pengangka → Kekalkan penyebut asal"
      );
    }
    if(c.mangkuk)return{mod:"interaktif",interaksi:"teknik-mangkuk-campur",
      q:`Tukar pecahan tak wajar ${peng}/${bhg} kepada nombor bercampur menggunakan teknik mangkuk.`,
      vis:komponenMangkukCampur(peng,bhg,bulat,baki),cek:()=>MANGKUKCbetul(),ansVal:betul,
      hint:`${peng} &divide; ${bhg} = ${bulat} baki ${baki}. Hasil bahagi ialah nombor bulat, baki ialah pengangka dan pembahagi ialah penyebut.`};
    return soalPecahanBerlangkah(
      `Tukar pecahan tak wajar ${peng}/${bhg} kepada nombor bercampur.`,
      visualPecahanTakwajar(peng,bhg),
      [
        langkahPecahan("Cari bilangan keseluruhan",`${peng} ÷ ${bhg}: hasil bahagi = ?`,bulat),
        langkahPecahan("Cari baki",`${peng} − (${bulat} × ${bhg}) = ?`,baki),
        langkahPecahan("Nombor bercampur",`Keseluruhan baki/penyebut = ?`,betul)
      ],betul,
      `${peng} ÷ ${bhg} = ${bulat} baki ${baki}. Penyebut kekal ${bhg}, jadi ${betul}.`,
      "Bahagi pengangka dengan penyebut → Catat hasil bahagi → Letak baki di atas penyebut asal"
    );
  }
  if(mod==="ops"){
    const tam=c.op==="+"?true:c.op==="-"?false:Math.random()<.5;
    const op=tam?"+":"−";
    if((c.aras||3)>=4&&Math.random()<.48){
      let[q1,q2]=pick([[2,4],[3,6],[4,8],[5,10],[3,9],[2,6]]);
      let a=R(1,q1-1),b=R(1,q2-1),l=kpk(q1,q2);
      let na=a*(l/q1),nb=b*(l/q2);
      if(!tam&&na<nb){[a,b]=[b,a];[q1,q2]=[q2,q1];[na,nb]=[nb,na];}
      if(!tam&&na===nb)return ENJIN.pecahan(c)();   // elak jawapan 0/n
      const j=tam?na+nb:na-nb,mentah=`${j}/${l}`,akhir=bentukPecahan(j,l).teks;
      const cerita=Math.random()<.35
        ?`<div class="ref">Sebuah bekas mengandungi ${a}/${q1} L air. ${tam?`Kemudian ditambah ${b}/${q2} L`:`Sebanyak ${b}/${q2} L digunakan`}. Berapakah isi padu air sekarang?</div>`:"";
      return soalPecahanBerlangkah(
        cerita?`Selesaikan masalah pecahan.`:`Kira pecahan berlainan penyebut: ${a}/${q1} ${op} ${b}/${q2}`,
        cerita+visualOperasiPecahanBebas(a,q1,b,q2,op),
        [
          langkahPecahan("Tukar pecahan pertama",`${a}/${q1} dengan penyebut ${l} = ?`,`${na}/${l}`),
          langkahPecahan("Tukar pecahan kedua",`${b}/${q2} dengan penyebut ${l} = ?`,`${nb}/${l}`),
          langkahPecahan(`${tam?"Tambah":"Tolak"} pengangka`,`${na} ${op} ${nb} = ?`,j),
          langkahPecahan("Jawapan termudah",`${mentah} = ?`,akhir)
        ],akhir,
        `Samakan penyebut kepada ${l}: ${a}/${q1}=${na}/${l} dan ${b}/${q2}=${nb}/${l}. Kemudian ${na}${op}${nb}=${j}; ${mentah}=${akhir}.`,
        "Cari penyebut sepunya → Tukar kepada pecahan setara → Operasi pengangka → Permudahkan"
      );
    }
    const bhg=pick([4,5,6,8,10]);
    let a=R(1,bhg-2),b=R(1,bhg-a-1>0?bhg-a-1:1);
    // Tolak: pengangka mesti berbeza supaya jawapan bukan 0/n
    if(!tam&&a===b)b=(b>1)?b-1:b+1;
    const j=tam?a+b:Math.max(a,b)-Math.min(a,b);
    if(!tam&&j===0)return ENJIN.pecahan(c)();
    const aa=tam?a:Math.max(a,b),bb=tam?b:Math.min(a,b);
    const mentah=`${j}/${bhg}`,akhir=bentukPecahan(j,bhg).teks;
    const cerita=Math.random()<.35
      ?`<div class="ref">${tam
        ?`Mira mewarna ${aa}/${bhg} daripada sekeping kad. Dia mewarna lagi ${bb}/${bhg}. Berapakah bahagian yang telah diwarnakan?`
        :`Sebuah kek masih berbaki ${aa}/${bhg}. Sebanyak ${bb}/${bhg} dimakan. Berapakah baki kek?`}</div>`:"";
    const langkah=[
      langkahPecahan(`${tam?"Tambah":"Tolak"} pengangka`,`${aa} ${op} ${bb} = ?`,j),
      langkahPecahan("Kekalkan penyebut",`Tulis ${j} di atas penyebut ${bhg}`,mentah)
    ];
    if(akhir!==mentah)langkah.push(langkahPecahan("Permudahkan jawapan",`${mentah} = ?`,akhir));
    return soalPecahanBerlangkah(
      cerita?"Selesaikan masalah pecahan.":`Kira: ${aa}/${bhg} ${op} ${bb}/${bhg}`,
      cerita+visualOperasiPecahan(aa,bb,bhg,op),
      langkah,akhir,
      `Penyebut sama. ${tam?"Tambah":"Tolak"} pengangka: ${aa}${op}${bb}=${j}; penyebut kekal ${bhg}. ${mentah}${akhir!==mentah?` = ${akhir}`:""}.`,
      "Semak penyebut sama → Tambah atau tolak pengangka sahaja → Kekalkan penyebut → Permudahkan"
    );
  }
  if(mod==="opsdarab"){
    if(c.gabung){
      const jenis=R(0,2),bhg=pick([4,5,6,8]),k=R(2,3);
      if(jenis===1){
        const a=R(1,bhg-2),b=R(1,bhg-a-1),jumlah=a+b;
        const selepasKurung=`${jumlah}/${bhg}`,mentah=`${jumlah*k}/${bhg}`,akhir=bentukPecahan(jumlah*k,bhg).teks;
        const langkah=[
          langkahPecahan("Selesaikan kurungan",`${a}/${bhg} + ${b}/${bhg} = ?`,selepasKurung),
          langkahPecahan("Darab hasil kurungan",`${selepasKurung} × ${k} = ?`,mentah)
        ];
        if(akhir!==mentah)langkah.push(langkahPecahan("Permudahkan",`${mentah} = ?`,akhir));
        return soalPecahanBerlangkah(
          `Kira operasi bergabung: (${a}/${bhg} + ${b}/${bhg}) × ${k}`,
          `<div class="frac-rule"><b>(</b>${pecahanBadge(a,bhg)} <b>+</b> ${pecahanBadge(b,bhg)}<b>) × ${k}</b></div>`
            +visualOperasiPecahan(a,b,bhg,"+"),
          langkah,akhir,
          `Kurungan dahulu: ${a}/${bhg}+${b}/${bhg}=${selepasKurung}. Kemudian ×${k}=${mentah}${akhir!==mentah?`=${akhir}`:""}.`,
          "Kurungan dahulu → Darab hasil kurungan → Permudahkan atau tukar kepada nombor bercampur"
        );
      }
      if(jenis===2){
        const a=R(1,bhg-1),darab=a*k,b=R(1,Math.min(bhg-1,darab-1));
        const j=darab-b,mentah=`${j}/${bhg}`,akhir=bentukPecahan(j,bhg).teks;
        const langkah=[
          langkahPecahan("Darab dahulu",`${a}/${bhg} × ${k} = ?`,`${darab}/${bhg}`),
          langkahPecahan("Tolak pengangka",`${darab} − ${b} = ?`,j),
          langkahPecahan("Kekalkan penyebut",`Tulis ${j} di atas penyebut ${bhg}`,mentah)
        ];
        if(akhir!==mentah)langkah.push(langkahPecahan("Permudahkan",`${mentah} = ?`,akhir));
        return soalPecahanBerlangkah(
          `Kira operasi bergabung: ${a}/${bhg} × ${k} − ${b}/${bhg}`,
          `<div class="frac-rule">${pecahanBadge(a,bhg)} <b>× ${k} −</b> ${pecahanBadge(b,bhg)}</div>`
            +visualOperasiPecahan(a,b,bhg,"−"),
          langkah,akhir,
          `Darab dahulu: ${a}/${bhg}×${k}=${darab}/${bhg}. Kemudian ${darab}/${bhg}−${b}/${bhg}=${mentah}${akhir!==mentah?`=${akhir}`:""}.`,
          "Darab dahulu → Tolak pecahan → Kekalkan penyebut → Permudahkan"
        );
      }
      const a=R(1,bhg-2),b=R(1,bhg-a-1),darab=b*k,j=a+darab;
      const mentah=`${j}/${bhg}`,akhir=bentukPecahan(j,bhg).teks;
      const langkah=[
        langkahPecahan("Darab dahulu",`${b}/${bhg} × ${k} = ?`,`${darab}/${bhg}`),
        langkahPecahan("Tambah pengangka",`${a} + ${darab} = ?`,j),
        langkahPecahan("Kekalkan penyebut",`Tulis ${j} di atas penyebut ${bhg}`,mentah)
      ];
      if(akhir!==mentah)langkah.push(langkahPecahan("Permudahkan",`${mentah} = ?`,akhir));
      return soalPecahanBerlangkah(
        `Kira operasi bergabung: ${a}/${bhg} + ${b}/${bhg} × ${k}`,
        `<div class="frac-rule">${pecahanBadge(a,bhg)} <b>+</b> ${pecahanBadge(b,bhg)} <b>× ${k}</b></div>`
          +visualOperasiPecahan(a,b,bhg,"+"),
        langkah,akhir,
        `Darab dahulu: ${b}/${bhg}×${k}=${darab}/${bhg}. Kemudian ${a}/${bhg}+${darab}/${bhg}=${mentah}${akhir!==mentah?`=${akhir}`:""}.`,
        "Darab atau bahagi dahulu → Tambah atau tolak → Kekalkan penyebut yang sama → Permudahkan"
      );
    }
    if(Math.random()<.5){
      const [p,bhg,k]=pick([[4,5,2],[3,4,3],[6,7,3],[2,3,2],[6,8,3],[3,5,2]]);
      const mentah=`${p}/${bhg*k}`,akhir=bentukPecahan(p,bhg*k).teks;
      const langkah=[
        langkahPecahan("Songsangkan pembahagi",`${k} = ${k}/1, songsangnya = ?`,`1/${k}`),
        langkahPecahan("Tukar bahagi kepada darab",`${p}/${bhg} × 1/${k} = ?`,mentah)
      ];
      if(akhir!==mentah)langkah.push(langkahPecahan("Permudahkan",`${mentah} = ?`,akhir));
      return soalPecahanBerlangkah(
        `Bahagi pecahan: ${p}/${bhg} ÷ ${k}`,
        modelPecahan(bhg,p,"Pecahan yang hendak dibahagi",false,true)
          +`<div class="frac-rule">${pecahanBadge(p,bhg)} <b>÷ ${k}</b> → songsangkan ${k}/1 → ${pecahanBadge(p,bhg)} <b>×</b> ${pecahanBadge(1,k)}</div>`,
        langkah,akhir,
        `${k}=${k}/1. Songsangkan menjadi 1/${k}, kemudian ${p}/${bhg}×1/${k}=${mentah}${akhir!==mentah?`=${akhir}`:""}.`,
        "Tulis nombor bulat sebagai pecahan → Songsangkan pembahagi → Tukar ÷ kepada × → Darab → Permudahkan"
      );
    }
    const bhg=pick([4,5,6,8,10]),p=R(1,bhg-1),k=R(2,4);
    const has=p*k,mentah=`${has}/${bhg}`,akhir=bentukPecahan(has,bhg).teks;
    const nomborDahulu=Math.random()<.5;
    const langkah=[
      langkahPecahan("Tulis nombor bulat sebagai pecahan",`${k} = ?`,`${k}/1`),
      langkahPecahan("Darab pengangka dan penyebut",
        nomborDahulu?`${k}/1 × ${p}/${bhg} = ?`:`${p}/${bhg} × ${k}/1 = ?`,mentah)
    ];
    if(akhir!==mentah)langkah.push(langkahPecahan("Permudahkan atau tukar bentuk",`${mentah} = ?`,akhir));
    return soalPecahanBerlangkah(
      `Darab pecahan: ${nomborDahulu?`${k} × ${p}/${bhg}`:`${p}/${bhg} × ${k}`}`,
      modelPecahan(bhg,p,"Pecahan yang didarab",false,true)
        +`<div class="frac-rule">${nomborDahulu
          ?`${pecahanBadge(k,1)} <b>×</b> ${pecahanBadge(p,bhg)}`
          :`${pecahanBadge(p,bhg)} <b>×</b> ${pecahanBadge(k,1)}`}</div>`,
      langkah,akhir,
      `${k}=${k}/1. Darab pengangka: ${p}×${k}=${has}; darab penyebut: ${bhg}×1=${bhg}. ${mentah}${akhir!==mentah?`=${akhir}`:""}.`,
      "Tulis nombor bulat sebagai pecahan berpenyebut 1 → Darab pengangka → Darab penyebut → Permudahkan"
    );
  }
  return ENJIN.pecahan({mod:"kenal",bhg:[2,4]})();
  };
};

/* --- Teknik mangkuk: tukar pecahan persepuluh kepada perpuluhan --- */
let MANGKUK={p:0,q:10,d:"",i:0,inp:"",jawab:[]};
function komponenMangkuk(p,q,d){
  return `<div id="mangkukWrap" class="mangkuk-wrap" data-p="${p}" data-q="${q}" data-d="${d}">
    <div class="mangkuk-papan">
      <div class="mangkuk-asal">${pecahanBadge(p,q)} <span>=</span> <span>${p} &divide; ${q}</span></div>
      <div class="mangkuk-luar" id="mangkukLuar">${q}</div>
      <div class="mangkuk-kanan">
        <div class="mangkuk-hasil"><span class="mangkuk-digit" id="mangkukSa">?</span>
          <span class="mangkuk-titik" id="mangkukTitik">.</span>
          <span class="mangkuk-digit" id="mangkukPersepuluh">?</span></div>
        <div class="mangkuk-dalam"><span>${p}</span><span class="mangkuk-turun" id="mangkukTurun">0</span></div>
      </div>
    </div>
    <div class="mangkuk-arahan" id="mangkukArahan"></div>
    <div class="mangkuk-maklum" id="mangkukMaklum"></div>
  </div>${padNombor("","MANGKUKenter()",true,[])}`;
}
function MANGKUKsedia(){
  const w=document.getElementById("mangkukWrap");if(!w)return;
  MANGKUK={p:+w.getAttribute("data-p")||0,q:+w.getAttribute("data-q")||10,
    d:w.getAttribute("data-d")||"",i:0,inp:"",jawab:[]};
  MODINP="mangkuk";MANGKUKdraw();
}
function MANGKUKdraw(){
  const sa=document.getElementById("mangkukSa"),ps=document.getElementById("mangkukPersepuluh");
  const titik=document.getElementById("mangkukTitik"),turun=document.getElementById("mangkukTurun");
  const arahan=document.getElementById("mangkukArahan"),maklum=document.getElementById("mangkukMaklum");
  const butang=document.getElementById("kbdEnter");if(!sa||!ps||!arahan)return;
  const nilai=(el,siap,aktif,isi)=>{el.textContent=isi!==""?isi:"?";
    el.classList.toggle("siap",siap);el.classList.toggle("aktif",aktif);};
  nilai(sa,MANGKUK.i>0,MANGKUK.i===0,MANGKUK.i===0?MANGKUK.inp:(MANGKUK.jawab[0]||""));
  nilai(ps,MANGKUK.i>1,MANGKUK.i===1,MANGKUK.i===1?MANGKUK.inp:(MANGKUK.jawab[1]||""));
  if(titik)titik.style.visibility=MANGKUK.i>0?"visible":"hidden";
  if(turun)turun.classList.toggle("nampak",MANGKUK.i>0);
  if(MANGKUK.i===0){
    arahan.innerHTML=`${MANGKUK.q} tidak boleh membahagi ${MANGKUK.p}. Tulis <b>0</b> pada rumah sa.`;
    if(maklum)maklum.textContent="Penyebut di luar mangkuk, pengangka di dalam mangkuk.";
  }else if(MANGKUK.i===1){
    arahan.innerHTML=`Titik perpuluhan dan sifar dimasukkan secara automatik. Sekarang ${MANGKUK.p*10} &divide; ${MANGKUK.q} = <b>?</b>`;
    if(maklum)maklum.textContent=`${MANGKUK.p} menjadi ${MANGKUK.p}0 supaya pembahagian boleh diteruskan.`;
  }else{
    arahan.innerHTML=`Selesai: ${MANGKUK.p} &divide; ${MANGKUK.q} = <b>${MANGKUK.d}</b>`;
    if(maklum)maklum.textContent=`Jadi ${MANGKUK.p}/${MANGKUK.q} bersamaan ${MANGKUK.d}.`;
  }
  if(butang)butang.textContent=MANGKUK.i>=1?"✓ Semak":"Seterusnya ›";
}
function MANGKUKtambah(d){
  if(MANGKUK.i>1||!/^[0-9]$/.test(String(d)))return;
  MANGKUK.inp=String(d);MANGKUKdraw();
}
function MANGKUKpadam(){MANGKUK.inp="";MANGKUKdraw();}
function MANGKUKkosong(){
  MANGKUK.i=0;MANGKUK.inp="";MANGKUK.jawab=[];MANGKUKdraw();
}
function MANGKUKenter(){
  if(MANGKUK.i>1||MANGKUK.inp==="")return;
  const betul=MANGKUK.i===0?MANGKUK.inp==="0":MANGKUK.inp===String(MANGKUK.p);
  const maklum=document.getElementById("mangkukMaklum");
  if(!betul){MANGKUK.inp="";MANGKUKdraw();
    if(maklum)maklum.innerHTML="<span style='color:var(--p3)'>Belum tepat. Cuba lagi.</span>";return;}
  MANGKUK.jawab[MANGKUK.i]=MANGKUK.inp;MANGKUK.i++;MANGKUK.inp="";MANGKUKdraw();
  if(MANGKUK.i>1)setTimeout(()=>cekInteraktif(),220);
}
const MANGKUKbetul=()=>MANGKUK.i>1&&MANGKUK.jawab[0]==="0"
  &&MANGKUK.jawab[1]===String(MANGKUK.p)&&`0.${MANGKUK.p}`===MANGKUK.d;

/* Teknik mangkuk Tahun 4 untuk pecahan tak wajar kepada nombor bercampur. */
let MANGKUKC={peng:0,bhg:1,bulat:0,baki:0,produk:0,i:0,inp:"",jawab:[]};
function komponenMangkukCampur(peng,bhg,bulat,baki){

      data-bhg="${bhg}" data-bulat="${bulat}" data-baki="${baki}">
    <div class="mangkuk-campur-papan" role="img" aria-label="Teknik mangkuk ${peng} bahagi ${bhg}">
      <div class="mkc-label-atas">hasil bahagi</div>
      <div class="mkc-hasil mkc-kosong" id="mkcHasil">?</div>
      <div class="mkc-pembahagi" id="mkcPembahagi">${bhg}</div>
      <div class="mkc-mangkuk" id="mkcPengangka">${peng}</div>
      <div class="mkc-kira"><div class="mkc-produk mkc-kosong" id="mkcProduk">- ?</div>
        <div class="mkc-garis"></div><div class="mkc-baki mkc-kosong" id="mkcBaki">?</div></div>
    </div>
    <div class="mkc-jawapan" id="mkcJawapan">${pecahanBadge(peng,bhg)} <b>=</b>
      <span class="mkc-campur"><span>?</span>${pecahanBadge("?",bhg)}</span></div>
    <div class="mkc-arahan" id="mkcArahan"></div><div class="mkc-maklum" id="mkcMaklum"></div>
