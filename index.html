<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<!-- "Tambah ke Skrin Utama" pada iPhone/iPad: buka skrin penuh tanpa bar Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MathVerse">
<meta name="theme-color" content="#0e1430">
<link rel="apple-touch-icon" href="assets/ikon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/ikon/favicon-32.png">
<link rel="manifest" href="manifest.json">
<title>MathVerse — Matematik KSSR Tahun 1–6</title>
<style>
:root{
  --bg:#0e1430; --bg2:#161e46; --card:#1e2757; --card2:#28336b;
  --line:#3a4587; --txt:#eef2ff; --dim:#a6b0e0;
  --p1:#ffd166; --p2:#06d6a0; --p3:#ef476f; --p4:#4cc9f0; --p5:#c77dff; --p6:#ff8fab;
  --ok:#06d6a0; --no:#ef476f; --gold:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible,.row:focus-visible,.card:focus-visible{
  outline:3px solid var(--p1);outline-offset:3px}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  /* warna ini menutup kawasan selamat atas & bawah iPhone.
     Tanpanya, jalur PUTIH muncul di bawah skrin. */
  background:var(--bg);overscroll-behavior:none}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%,#243066 0%,var(--bg) 60%);
  color:var(--txt);height:100dvh;overflow:hidden
}
/* Rangka satu skrin: bar atas tetap, kandungan fleksibel, bar tindakan bawah */
:root{--jidar-x:14px;--jidar-atas:8px;--jidar-bawah:10px}
/* Kawasan selamat iPhone SENTIASA ditambah di sini. Media query hanya
   menukar --jidar-*, jadi jidak takuk/bar utama tidak boleh hilang. */
#app{max-width:1000px;height:100dvh;margin:0 auto;
  padding:calc(var(--jidar-atas) + env(safe-area-inset-top))
          calc(var(--jidar-x) + env(safe-area-inset-right))
          calc(var(--jidar-bawah) + env(safe-area-inset-bottom))
          calc(var(--jidar-x) + env(safe-area-inset-left));
  display:flex;flex-direction:column;overflow:hidden}
/* Skrin aktiviti tidak perlu selebar 1000px — lebih selesa dibaca */
.skrin.aktiviti>.stage{width:min(100%,720px);margin:0 auto}
.skrin{flex:1;min-height:0;display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.skrin.aktiviti{overflow:hidden}
.skrin::-webkit-scrollbar{width:6px}
.skrin::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.hide{display:none!important}

/* ---------- topbar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:2px 0 10px;flex:none;z-index:40;min-height:44px}
.back{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;
  /* 44px = saiz sasaran sentuh minimum Apple. Jangan turunkan. */
  min-height:44px;min-width:44px;padding:9px 15px;font-size:14px;font-weight:800;
  cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;
  white-space:nowrap;line-height:1;
  transition:transform .1s,background .12s,border-color .12s}

.back:active{transform:scale(.96)}
.versi{flex:none;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--dim);
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:8px;
  padding:4px 8px;line-height:1;align-self:center}
.crumb{font-size:13px;color:var(--dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coin{background:linear-gradient(135deg,#ffd166,#ff9f1c);color:#2b1d00;font-weight:800;
  border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 #c47f00}

/* ---------- hero ---------- */
.hero{text-align:center;padding:clamp(4px,2vh,18px) 0 clamp(8px,2.5vh,22px);flex:none}
.logo{font-size:clamp(28px,7vh,54px);font-weight:900;letter-spacing:-1.5px;
  background:linear-gradient(90deg,#ffd166,#06d6a0,#4cc9f0,#c77dff);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.tagline{color:var(--dim);font-size:14px;margin-top:8px}

/* ---------- grids & cards ---------- */
.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(10px,1.8vh,16px);
  cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}

.card:active{transform:scale(.98)}
.card.flat{cursor:default}

.yr{text-align:center;padding:clamp(12px,2.4vh,22px) 12px}
.yr .n{font-size:clamp(30px,5.4vh,46px);font-weight:900;line-height:1}
.yr .l{font-size:13px;color:var(--dim);margin-top:6px}
.yr .s{font-size:11px;color:var(--dim);margin-top:10px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;
  background:#3a2a00;color:var(--p1);border:1px solid #6b4e00;margin-top:8px}
.unit-h{display:flex;align-items:center;gap:12px}
.unit-n{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;
  font-weight:900;font-size:18px;color:#0e1430}
.unit-t{font-weight:700;font-size:16px;line-height:1.25}
.unit-m{font-size:12px;color:var(--dim);margin-top:3px}
.bar{height:7px;border-radius:99px;background:#0d1233;margin-top:12px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#06d6a0,#4cc9f0);transition:width .4s}

/* ---------- subtopic rows ---------- */
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:clamp(9px,1.5vh,14px) 13px;cursor:pointer;
  transition:transform .1s,background .12s,border-color .12s,box-shadow .12s}

.row:active{transform:scale(.985)}
.row .ic{width:clamp(28px,4.6vh,36px);height:clamp(28px,4.6vh,36px);flex:none;border-radius:10px;
  display:grid;place-items:center;font-size:clamp(14px,2.6vh,17px);
  background:var(--card2);border:1px solid var(--line)}
.row .tx{flex:1;min-width:0}
.row .t1{font-weight:600;font-size:clamp(13px,2vh,15px);line-height:1.25}
.row .t2{font-size:11.5px;color:var(--dim);margin-top:3px}
.row .st{font-size:19px;flex:none}
.pill{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;background:#123;color:var(--p4);
  border:1px solid #1d4a5c;margin-left:6px;white-space:nowrap}
.pill.play{background:#06301f;color:var(--p2);border-color:#0a5c3b}

h2.sec{font-size:clamp(16px,2.6vh,20px);margin:2px 0 clamp(8px,1.6vh,14px);font-weight:800;flex:none}
h3.sub{font-size:clamp(11px,1.7vh,13px);color:var(--dim);margin:clamp(10px,2vh,20px) 0 clamp(6px,1.2vh,10px);
  text-transform:uppercase;letter-spacing:1px;flex:none}

/* ---------- activity stage ---------- */
.stage{background:linear-gradient(180deg,rgba(40,51,107,.76),rgba(30,39,87,.96));
  border:1px solid #46529a;border-radius:20px;box-shadow:0 14px 36px rgba(0,0,0,.22);
  padding:clamp(10px,2vh,20px);flex:1;min-height:0;display:flex;flex-direction:column;
  position:relative}
/* Hanya bekas kandungan di dalam .stage. Diskopkan supaya nama kelas "isi"
   tidak sesekali melanggar mana-mana kotak jawapan di dalamnya. */
.stage>.isi{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;
  overflow:hidden}
/* Zon input (papan kekunci, kotak jawapan) sentiasa dipaku ke bawah pentas,
   supaya soalan di atas dan papan di bawah — kekal di semua saiz skrin. */
.isi-dalam{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;
  justify-content:flex-start;overflow:hidden;gap:clamp(2px,.7vh,6px);
  transform-origin:top center;transition:transform .12s ease-out}
/* Soalan di atas, papan kekunci dipaku ke bawah — kedudukan sama di semua saiz skrin. */
.isi-dalam>.inpbox,.isi-dalam>.slots,.isi-dalam>.padact{flex:none}
.isi-dalam>.pad,.isi-dalam>.kbd,.isi-dalam>.opts{margin-top:auto}
/* petua di bawah papan tidak menolak papan ke atas */
.isi-dalam>.pad~.hint,.isi-dalam>.kbd~.hint,.isi-dalam>.padact~.hint{flex:none;margin-top:6px}
/* visual soalan mengecil dahulu apabila skrin sempit, papan kekunci kekal besar */
.isi-dalam>.objwrap,.isi-dalam>.vis{flex:0 1 auto;min-height:0;overflow:hidden}
@media(min-height:720px) and (max-width:900px){
  /* ruang lebihan dibahagi dua: soalan turun sedikit dari bar atas,
     jawapan kekal dalam jangkauan ibu jari - tiada lagi lompang besar */
  .isi-dalam>.q:first-child{margin-top:auto}
}
.q{font-size:clamp(15px,2.6vh,23px);font-weight:700;text-align:center;
  margin:clamp(2px,.6vh,6px) 0 clamp(6px,1.6vh,16px);line-height:1.35;flex:none}
.qs{font-size:clamp(11px,1.5vh,13px);color:var(--dim);text-align:center;
  margin:clamp(-10px,-1.2vh,-6px) 0 clamp(6px,1.4vh,14px);flex:none}
.opts{display:grid;gap:clamp(6px,1.2vh,11px);grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  max-width:640px;margin:0 auto;width:100%;flex:none}
.opt{background:var(--card2);border:2px solid var(--line);border-radius:15px;
  min-height:48px;padding:clamp(9px,1.8vh,16px) 12px;font-size:clamp(15px,2.2vh,19px);font-weight:800;
  cursor:pointer;text-align:center;transition:transform .1s,background .12s,border-color .12s;color:var(--txt)}

.opt:active{transform:scale(.97)}
.opt.ok{background:#06402c;border-color:var(--ok);color:#7effd0}
.opt.no{background:#4a1024;border-color:var(--no);color:#ffb3c6}
.opt:disabled{cursor:default}
.fb{text-align:center;margin-top:clamp(6px,1.4vh,14px);font-size:clamp(14px,2vh,16px);
  font-weight:700;min-height:22px;flex:none}
.fb:empty,.stage>.hint:empty{display:none}
.fb.ok{color:var(--ok)} .fb.no{color:var(--no)}
.stage.keputusan-terbuka .isi-dalam>.pad,
.stage.keputusan-terbuka .isi-dalam>.kbd,
.stage.keputusan-terbuka .isi-dalam>.padact,
.stage.keputusan-terbuka>.aksi{display:none!important}
.keputusan-lapik{position:absolute;inset:0;z-index:30;display:grid;place-items:center;
  padding:clamp(14px,3vh,28px);border-radius:inherit;
  background:rgba(5,9,30,.82);backdrop-filter:blur(5px)}
.keputusan-kad{width:min(100%,430px);padding:clamp(20px,4vh,34px);
  border:2px solid var(--line);border-radius:24px;text-align:center;
  background:linear-gradient(160deg,#1c275f,#10183e);
  box-shadow:0 22px 60px rgba(0,0,0,.48);animation:pop .28s ease-out}
.keputusan-ikon{width:clamp(74px,13vh,104px);height:clamp(74px,13vh,104px);
  margin:0 auto clamp(10px,2vh,18px);display:grid;place-items:center;border-radius:50%;
  font:900 clamp(48px,8vh,72px)/1 Arial;color:#071b13}
.keputusan-kad.betul .keputusan-ikon{background:var(--ok);box-shadow:0 0 0 9px rgba(6,214,160,.13)}
.keputusan-kad.salah .keputusan-ikon{background:var(--no);color:#2c0711;
  box-shadow:0 0 0 9px rgba(239,71,111,.13)}
.keputusan-kad h2{margin:0 0 7px;font-size:clamp(22px,4vh,32px)}
.keputusan-kad p{margin:0;color:var(--dim);font-size:clamp(13px,2vh,16px);line-height:1.45}
.keputusan-tindakan{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.keputusan-tindakan .btn{flex:1;min-width:145px}
.btn.senyap{background:#303b77;box-shadow:0 4px 0 #1d2556}
.hint{text-align:center;font-size:clamp(11px,1.6vh,13px);color:var(--dim);
  margin-top:clamp(4px,.9vh,8px);line-height:1.45;flex:none}
.btn{background:linear-gradient(135deg,#4cc9f0,#4361ee);color:#fff;border:0;border-radius:14px;
  min-height:48px;padding:13px 26px;font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 0 #2c3fa8;transition:filter .12s,transform .1s,box-shadow .1s}

.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2c3fa8}
.btn.g{background:linear-gradient(135deg,#06d6a0,#059669);box-shadow:0 4px 0 #04724f}
.btn.sm{padding:9px 16px;font-size:14px;box-shadow:none}
.btn:disabled,.pk:disabled,.opt:disabled{opacity:.58;cursor:default;filter:saturate(.5)}
.center{text-align:center;margin-top:20px}
/* bar tindakan melekat di bawah skrin — sentiasa kelihatan tanpa perlu tatal */
.aksi{flex:none;margin-top:clamp(6px,1.4vh,14px);text-align:center}
.aksi .btn{width:100%;max-width:340px;padding:clamp(11px,2.1vh,16px) 26px;
  font-size:clamp(15px,2.2vh,18px)}
.prog{display:flex;gap:5px;justify-content:center;margin-bottom:clamp(6px,1.4vh,14px);
  flex-wrap:wrap;flex:none}
.dot{width:11px;height:11px;border-radius:50%;background:#33407e}
.dot.ok{background:var(--ok)} .dot.no{background:var(--no)} .dot.now{background:var(--p1);transform:scale(1.35)}

/* ---------- shared visual bits ---------- */
.objwrap{display:flex;flex-wrap:wrap;gap:clamp(4px,.8vh,7px);justify-content:center;
  padding:clamp(8px,1.6vh,14px);background:#0d1233;border-radius:14px;
  min-height:clamp(48px,8vh,70px);align-content:center;max-height:34vh;overflow:auto;flex:none}
.obj{font-size:clamp(19px,3.4vh,29px);line-height:1}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;max-width:620px;margin:0 auto}
.vs .lbl{text-align:center;font-size:12px;color:var(--dim);margin-bottom:6px;font-weight:700}
.vsx{font-size:22px;color:var(--dim);font-weight:900}
.blocks{display:flex;gap:clamp(8px,1.8vh,16px);justify-content:center;flex-wrap:wrap;
  padding:clamp(8px,1.6vh,14px);background:#0d1233;border-radius:14px;flex:none;
  max-height:30vh;overflow:auto}
.bcol{text-align:center}
.bcol .bl{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
/* Blok Dienes — setiap kiub dilukis berasingan supaya murid nampak 10 kiub bercantum */
.dn{display:flex;flex-wrap:wrap;gap:clamp(3px,.8vh,6px);justify-content:center;align-items:flex-start;
  --kb:clamp(7px,1.6vh,13px)}
.kb{display:block;width:var(--kb);height:var(--kb);border-radius:2px;
  border:1px solid rgba(0,0,0,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.kb.s{background:linear-gradient(145deg,#ffe08a,#e8a800)}   /* sa    - kuning */
.kb.p{background:linear-gradient(145deg,#8be3ff,#1f8fc4)}   /* puluh - biru   */
/* batang puluh: 10 kiub bercantum menegak, jaluran jelas antara setiap kiub */
.rod{display:flex;flex-direction:column;gap:1px;padding:2px;
  background:#0a1030;border:1.5px solid #2f7fa8;border-radius:4px}
.rod .kb{border-radius:1px}
/* petak ratus & kubus ribu: grid 10x10 dilukis dengan garisan */
.flat{--g:calc(var(--kb) + 1px);
  width:calc(var(--g)*10);height:calc(var(--g)*10);
  background-color:#ef476f;
  background-image:linear-gradient(to right,rgba(0,0,0,.5) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(0,0,0,.5) 1px,transparent 1px);
  background-size:var(--g) var(--g);border:1.5px solid #8c1e39;border-radius:3px}
.kubus1000{--g:calc(var(--kb) + 1px);
  width:calc(var(--g)*10);height:calc(var(--g)*10);
  background-color:#c77dff;
  background-image:linear-gradient(to right,rgba(0,0,0,.5) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(0,0,0,.5) 1px,transparent 1px);
  background-size:var(--g) var(--g);border:3px solid #7a3ba8;border-radius:4px;
  box-shadow:3px -3px 0 -1px #9d5fd0}
/* susunan lajur nilai tempat */
.dn.sa{max-width:calc(var(--kb)*3 + 18px)}
.dn.puluh{max-width:none;align-items:flex-end}
.coins{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px 0}
.cn{border-radius:50%;display:grid;place-items:center;font-weight:800;cursor:pointer;flex:none;
  border:3px solid rgba(0,0,0,.25);font-size:12px;color:#3b2f00;transition:transform .1s}
.cn:active{transform:scale(.9)}
.cn.silver{background:linear-gradient(145deg,#e8e8e8,#a8a8a8)}
.cn.gold{background:linear-gradient(145deg,#ffdf7e,#e0a800)}
.cn.note{border-radius:8px;width:78px!important;height:44px!important;color:#0b3d2e;
  background:linear-gradient(145deg,#8ee4c0,#3aa87e);font-size:14px}
.wang-msia{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:clamp(8px,1.5vh,14px);margin:clamp(7px,1.4vh,14px) auto;max-width:720px}
.wang-kertas-msia{--wk1:#2373bd;--wk2:#79c5ed;position:relative;isolation:isolate;overflow:hidden;
  width:clamp(132px,25vh,205px);aspect-ratio:2.08/1;border:2px solid rgba(255,255,255,.65);
  border-radius:9px;color:#07152b;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 0 0 2px rgba(255,255,255,.28);
  background:linear-gradient(125deg,var(--wk2),var(--wk1) 52%,color-mix(in srgb,var(--wk1),#fff 34%));
  flex:none;font-family:Arial,sans-serif;text-align:left}
.wang-kertas-msia::before{content:"";position:absolute;inset:8% 11%;border:1px solid rgba(10,20,35,.45);
  border-radius:45% 12% 42% 15%;transform:rotate(-3deg);z-index:-1}
.wang-kertas-msia::after{content:"";position:absolute;width:48%;aspect-ratio:1;border-radius:50%;
  right:8%;top:16%;background:repeating-conic-gradient(from 5deg,rgba(255,255,255,.28) 0 8deg,transparent 8deg 18deg);
  border:1px solid rgba(255,255,255,.4);z-index:-1}
.wang-kertas-msia.rm1{--wk1:#2474bd;--wk2:#8bd3ef}.wang-kertas-msia.rm5{--wk1:#218a65;--wk2:#a2db9c}
.wang-kertas-msia.rm10{--wk1:#c93845;--wk2:#f6a0a0}.wang-kertas-msia.rm20{--wk1:#d97827;--wk2:#ffd078}
.wang-kertas-msia.rm50{--wk1:#168c98;--wk2:#89d7cb}.wang-kertas-msia.rm100{--wk1:#684090;--wk2:#c4a0dc}
.wk-bank{position:absolute;left:7%;top:8%;font-size:clamp(5px,.9vh,8px);font-weight:900;letter-spacing:.3px}
.wk-rm{position:absolute;left:7%;bottom:27%;font-size:clamp(8px,1.3vh,12px);font-weight:900}
.wk-value{position:absolute;left:6%;bottom:4%;font-size:clamp(22px,4.6vh,38px);font-weight:1000;line-height:.85}
.wk-name{position:absolute;right:5%;bottom:7%;font-size:clamp(5px,.85vh,8px);font-weight:900;letter-spacing:.2px}
.wk-flower{position:absolute;right:25%;top:34%;font-size:clamp(20px,4.5vh,38px);line-height:1;color:rgba(255,255,255,.82);
  text-shadow:0 1px 0 rgba(0,0,0,.4)}
.wk-stripe{position:absolute;left:35%;top:0;width:5%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.68),transparent)}
.wang-kertas-msia.belakang .wk-rm,.wang-kertas-msia.belakang .wk-bank{opacity:.72}
.wang-kertas-msia.belakang .wk-flower{right:42%;top:25%;font-size:clamp(28px,6vh,48px)}
.wang-kertas-msia.mini{width:clamp(88px,17vh,132px);border-radius:6px}.wang-kertas-msia.mini .wk-name{display:none}
.wang-syiling-msia{--metal1:#f4f5f5;--metal2:#8f969b;position:relative;display:grid;place-items:center;
  width:clamp(54px,9.5vh,76px);aspect-ratio:1;border-radius:50%;flex:none;color:#303438;
  border:2px solid rgba(20,25,28,.55);box-shadow:0 3px 0 rgba(0,0,0,.28),inset 0 0 0 3px rgba(255,255,255,.45),inset 0 0 0 6px rgba(70,70,70,.15);
  background:repeating-conic-gradient(from 0deg,var(--metal1) 0 5deg,var(--metal2) 6deg 10deg)}

/* digit kecil di atas: bawa (tambah) atau pinjam (tolak) */
.atas{position:absolute;top:-0.62em;left:50%;transform:translateX(-50%);
  font-size:.44em;font-weight:900;color:var(--p1);line-height:1}
.atas.pinjam{color:var(--p3)}
.coret{position:relative;color:var(--dim)}
.coret::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;
  background:var(--p3);transform:rotate(-14deg)}
@keyframes terbangNaik{
  0%{transform:translate(0,0) scale(1);opacity:1}
  60%{transform:translate(-1.15em,-1.5em) scale(1.5);opacity:1}
  100%{transform:translate(-1.15em,-1.75em) scale(1);opacity:1}
}
.terbang{display:inline-block;animation:terbangNaik .75s ease-out forwards;

<script>
/* =========================================================================
   MathVerse — Pangkalan Data Kurikulum
   Skema: Tahun > Jilid > ID_Unit > ID_Subtopik > Aktiviti
   Sumber: Buku Teks & Buku Aktiviti KSSR Semakan (DBP/KPM)
   ========================================================================= */
/* ===================== VERSI & KEMAS KINI AUTOMATIK =====================
   Naikkan VERSI setiap kali ada perubahan. bina-luar-talian.py akan
   menyalin nombor ini ke versi.json secara automatik, jadi kedua-duanya
   tidak boleh terpesong.

   Aplikasi yang ditambah ke Skrin Utama iPhone menyimpan salinan lama.
   Kod di bawah menyemak versi.json di pelayan setiap kali aplikasi dibuka
   (dan setiap kali dikembalikan ke hadapan), kemudian memuat semula
   sendiri jika ada versi baharu. */
const VERSI="1.2";

let SEMAK_TERAKHIR=0;
async function semakVersiBaharu(paksa){
  // fail tempatan (dibuka terus dari cakera) tiada pelayan untuk disemak
  if(location.protocol==="file:")return;
  const kini=Date.now();
  if(!paksa&&kini-SEMAK_TERAKHIR<60000)return;   // paling kerap sekali seminit
  SEMAK_TERAKHIR=kini;
  try{
    const r=await fetch("versi.json?t="+kini,{cache:"no-store"});
    if(!r.ok)return;
    const data=await r.json();
    if(!data||!data.versi||data.versi===VERSI)return;
    // Ada versi baharu — kosongkan cache dan muat semula.
    if(window.caches&&caches.keys)
      try{(await caches.keys()).forEach(k=>caches.delete(k));}catch(e){}
    location.reload();
  }catch(e){ /* tiada internet — teruskan guna versi sedia ada */ }
}
addEventListener("load",()=>semakVersiBaharu(true));
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden)semakVersiBaharu(false);
});

/* nombor dalam perkataan (Bahasa Melayu) */
function perkataan(n){
  if(n===0)return"sifar";
  const sa=["","satu","dua","tiga","empat","lima","enam","tujuh","lapan","sembilan"];
  function h(x){
    let o="";
    if(x>=100){o+=(x>=200?sa[Math.floor(x/100)]+" ratus":"seratus");x%=100;if(x)o+=" ";}
    if(x>=20){o+=sa[Math.floor(x/10)]+" puluh";x%=10;if(x)o+=" "+sa[x];return o;}
    if(x>=12){o+=sa[x%10]+" belas";return o;}
    if(x===11)return o+"sebelas";
    if(x===10)return o+"sepuluh";
    if(x>0)o+=sa[x];
    return o;
  }
  let out="",j=Math.floor(n/1000000),r=Math.floor((n%1000000)/1000),k=n%1000;
  if(j)out+=h(j)+" juta ";
  if(r)out+=(r===1?"seribu":h(r)+" ribu")+" ";
  if(k)out+=h(k);
  return out.trim();
}

/* ===================== SKOR & KEMAJUAN ===================== */
function markah(betul,mata){
  S.jawab++;
  if(betul){S.betul++;S.skor+=mata||10;S.rentetan++;if(S.rentetan>S.rentetanMax)S.rentetanMax=S.rentetan;}
  else{S.salah++;S.rentetan=0;}
  save(S);
}
function tandaSiap(uid,sid){
  const k=uid+"_"+sid;
  if(!S.siap[k]){
    S.siap[k]=1;
    const u=cariUnit(uid);
    if(u&&u.s.every(x=>S.siap[uid+"_"+x.id])){S.unitSiap++;setTimeout(()=>toast("Unit selesai: "+u.n),400);}
    save(S);
  }
}
function cariUnit(uid){
  for(const t in CURR){const u=CURR[t].unit.find(x=>x.id===uid);if(u)return u;}
  return null;
}
function kemajuanUnit(u){
  const d=u.s.filter(x=>S.siap[u.id+"_"+x.id]).length;
  return{d:d,j:u.s.length,pct:Math.round(d/u.s.length*100)};
}
function kemajuanTahun(t){
  let d=0,j=0;
  CURR[t].unit.forEach(u=>{const k=kemajuanUnit(u);d+=k.d;j+=k.j;});
  return{d:d,j:j,pct:Math.round(d/j*100)};
}

/* Tukar teks 1/4 kepada bentuk pecahan bertindan untuk PAPARAN sahaja.
   Nilai asal dan kekunci "/" tidak berubah, jadi semakan jawapan kekal sama. */
function kemasPaparanPecahan(root){
  if(!root||!document.createTreeWalker)return;
  const nod=[],jalan=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let n;
  while((n=jalan.nextNode())){
    const p=n.parentElement;
    if(!p||!/\d+\s*\/\s*\d+/.test(n.nodeValue||""))continue;
    if(p.closest(".pecahan-tindan,.frac-badge,script,style"))continue;
    nod.push(n);
  }
  nod.forEach(teks=>{
    const asal=teks.nodeValue||"",re=/(\d+)\s*\/\s*(\d+)/g,frag=document.createDocumentFragment();
    let mula=0,m;
    while((m=re.exec(asal))){
      if(m.index>mula)frag.appendChild(document.createTextNode(asal.slice(mula,m.index)));
      const f=document.createElement("span");
      f.className="pecahan-tindan";
      f.setAttribute("role","math");
      f.setAttribute("aria-label",`${m[1]} per ${m[2]}`);
      const atas=document.createElement("span"),bawah=document.createElement("span");
      atas.className="pecahan-pengangka";atas.textContent=m[1];
      bawah.className="pecahan-penyebut";bawah.textContent=m[2];
      f.appendChild(atas);f.appendChild(bawah);frag.appendChild(f);
      mula=re.lastIndex;
    }
    if(mula<asal.length)frag.appendChild(document.createTextNode(asal.slice(mula)));
    teks.parentNode.replaceChild(frag,teks);
  });
}
function modelPecahan(bhg,isi,label,klik,tunjukNilai,jenis,ringkas){
  const warna=Array.from({length:Math.max(0,Math.min(isi,bhg))},(_,i)=>i);
  const gaya=jenis||pick(["bulatan","segiempat","bulatan","segiempat","jalur"]);
  let visual="";
  if(gaya==="bulatan"){
    // Bagi 1/2, garis pembahagi mesti sehala dengan sempadan warna:
    // dua jejari mendatar membentuk satu diameter, bukan empat suku.
    const sudutJejari=bhg===2?[90,270]:Array.from({length:bhg},(_,i)=>i*360/bhg);
    const jejari=sudutJejari.map(sudut=>
      `<span class="frac-spoke" style="--putar:${sudut}deg" aria-hidden="true"></span>`).join("");
    visual=`<div class="frac-visual"><div class="frac-circle" data-pecahan="${isi}/${bhg}"
      style="--sudut:${360/bhg}deg;--isi:${isi/bhg*360}deg">${jejari}</div></div>`;
  }else if(gaya==="segiempat"||gaya==="jubin"){
    const kol=bhg===4?2:bhg===6?3:bhg===8?4:bhg===9?3:bhg===10?5:Math.min(bhg,5);
    const h=Array.from({length:bhg},(_,i)=>`<div class="frac-tile${warna.includes(i)?" on":""}">
      ${ringkas||warna.includes(i)?"":`1/${bhg}`}</div>`).join("");
    visual=`<div class="frac-visual"><div class="frac-tile-grid" style="--kol:${kol}">${h}</div></div>`;
  }else if(gaya==="objek"){
    const ikon=pick(["🍎","🍪","🌟","🌸","⚽","🧁"]);
    const h=Array.from({length:bhg},(_,i)=>`<span class="frac-object${warna.includes(i)?" on":""}">${ikon}</span>`).join("");
    visual=`<div class="frac-visual"><div class="frac-object-set">${h}</div></div>`;
  }else if(gaya==="bentuk"){
    const h=Array.from({length:bhg},(_,i)=>`<span class="frac-shape${warna.includes(i)?" on":""}">
      ${ringkas||warna.includes(i)?"":`1/${bhg}`}</span>`).join("");
    visual=`<div class="frac-visual"><div class="frac-shape-row">${h}</div></div>`;
  }else{
    let h="";
    for(let i=0;i<bhg;i++){
      h+=`<div class="frac-part ${warna.includes(i)?"on":""}" ${klik?`role="button" tabindex="0" onclick="FP(${i})"`:""}><span>${ringkas?"":`1/${bhg}`}</span></div>`;
    }
    visual=`<div class="frac-strip" style="grid-template-columns:repeat(${bhg},1fr)">${h}</div>`;
  }
  const kepala=label||"Model pecahan";
  const kaki=tunjukNilai
    ?`${pecahanBadge(isi,bhg)}<span>${isi} daripada ${bhg} bahagian sama besar</span>`
    :`<span><b>${isi}</b> bahagian berwarna daripada <b>${bhg}</b> bahagian sama besar</span>`;
  return `<div class="frac-model${ringkas?" ringkas":""}" role="img" aria-label="${isi} daripada ${bhg} bahagian sama besar">
    ${ringkas?"":`<div class="frac-model-head"><span>${kepala}</span><span class="frac-unit">Setiap bahagian = 1/${bhg}</span></div>`}
    ${visual}
    ${ringkas?"":`<div class="frac-model-foot">${kaki}</div>`}</div>`;
}

function fpb(a,b){

  if(SLOTAKTIF>=SLOT.length)return;
  SLOT[SLOTAKTIF]+=ch;
  // sambung terus ke kotak seterusnya apabila perkataan sudah cukup panjang
  if(SLOT[SLOTAKTIF].length>=SLOTPJG[SLOTAKTIF]&&SLOTAKTIF<SLOT.length-1)SLOTAKTIF++;
  SLOTdraw();
}
function SLOTpadam(){
  if(SLOT[SLOTAKTIF]===""&&SLOTAKTIF>0)SLOTAKTIF--;
  SLOT[SLOTAKTIF]=SLOT[SLOTAKTIF].slice(0,-1);
  SLOTdraw();
}
const SLOTjawapan=()=>SLOT.join(" ").trim().toLowerCase().replace(/\s+/g," ");

const BARIS_KEKUNCI=["qwertyuiop","asdfghjkl","zxcvbnm"];

  if(MODINP==="darab"){if(d!==" ")DRBtambah(d);return;}
  if(MODINP==="bahagi"){if(d!==" ")BHGtambah(d);return;}
  if(MODINP==="mangkuk"){if(d!==" ")MANGKUKtambah(d);return;}
  if(MODINP==="mangkuk-campur"){if(d!==" ")MANGKUKCtambah(d);return;}

  if(MODINP==="bahagi"){BHGpadam();return;}

function INPkosong(){
  if(MODINP==="pecahan"){PINPkosong();return;}
  if(MODINP==="slot"){SLOT=SLOT.map(()=>"");SLOTAKTIF=0;SLOTdraw();return;}
  if(MODINP==="teknik"){TEKkosong();return;}
  if(MODINP==="darab"){DRBkosong();return;}
  if(MODINP==="bahagi"){BHGkosong();return;}
  if(MODINP==="mangkuk"){MANGKUKkosong();return;}
  if(MODINP==="mangkuk-campur"){MANGKUKCkosong();return;}

/* ---------- Mekanik: Bentuk lazim interaktif (bilangan lajur automatik) ----------
   Satu enjin untuk semua tahun. Yang berubah hanya bilangan digit:
   2 lajur (sa, puluh) · 3 lajur (+ratus) · 4 lajur (+ribu) dan seterusnya. */
const NAMA_TEMPAT=["sa","puluh","ratus","ribu","puluh ribu","ratus ribu","juta"];
let LZM={a:0,b:0,op:"+",n:2,atas:[],bawah:[],kerja:[],jwp:[],bawa:[],pinjam:[],
         lajur:0,fasa:"kira",pjLangkah:0,pjRantai:[],pjIdx:0};
function komponenLazim(a,b,op,nota){
  return `<div id="lazimWrap" data-a="${a}" data-b="${b}" data-op="${op}"></div>
    <div class="lzlangkah" id="lzLangkah"></div>`
    // Bentuk lazim sudah ada kotak jawapan pada setiap lajur —
    // kotak "Tulis jawapan di sini" tidak diperlukan lagi (tanpaKotak=true).
    +padNombor(nota||"Taip jawapan setiap lajur, kemudian tekan ⏎.","LZMenter()",true);
}
const digitArr=(v,n)=>String(v).padStart(n,"·").split("").reverse();
function LZMsedia(){
  const w=document.getElementById("lazimWrap");
  if(!w)return;
  const a=+w.getAttribute("data-a"),b=+w.getAttribute("data-b"),op=w.getAttribute("data-op");
  const hasil=op==="+"?a+b:a-b;
  const n=Math.max(String(a).length,String(b).length,String(hasil).length);
  LZM={a:a,b:b,op:op,n:n,
    atas:digitArr(a,n),bawah:digitArr(b,n),
    kerja:digitArr(a,n).map(x=>x==="·"?0:+x),
    jwp:Array(n).fill(null),bawa:Array(n+1).fill(0),pinjam:Array(n+1).fill(false),
    lajur:0,fasa:"kira",pjLangkah:0,pjRantai:[],pjIdx:0,langkau:Array(n).fill(false)};
  LZMlangkauKosong();
  LZMsemakPinjam();
  MODINP="lazim";INP="";
  LZMdraw();
}
/* Langkau lajur paling kiri yang tiada apa-apa untuk dikira —
   murid tidak perlu menulis sifar di hadapan (cth 105 − 76 = 29, bukan 029). */
function LZMlangkauKosong(){
  // Sifar di HADAPAN tidak ditulis (cth 203 − 198 = 5, bukan 005).
  // Sifar di TENGAH mesti ditulis (cth 205 − 5 = 200).
  const betulPenuh=String(LZM.op==="+"?LZM.a+LZM.b:LZM.a-LZM.b);
  const bilKosongHadapan=LZM.n-betulPenuh.length;
  while(LZM.lajur<LZM.n){
    const i=LZM.lajur;
    if(i<LZM.n-bilKosongHadapan)break;          // bukan lagi lajur hadapan yang kosong
    LZM.jwp[i]=0;LZM.langkau[i]=true;LZM.lajur++;
  }
}
function LZMsemakPinjam(){
  if(LZM.op!=="−")return;
  const i=LZM.lajur;
  if(i>=LZM.n)return;
  const bw=LZM.bawah[i]==="·"?0:+LZM.bawah[i];
  if(LZM.kerja[i]>=bw)return;
  // cari lajur terdekat di sebelah kiri yang masih ada nilai untuk dipinjam
  let m=i+1;
  while(m<LZM.n&&LZM.kerja[m]===0)m++;
  if(m>=LZM.n)return;
  // bina rantai pinjaman: dari lajur m turun satu-satu hingga ke lajur i
  LZM.pjRantai=[];
  for(let j=m;j>i;j--)LZM.pjRantai.push([j,j-1]);
  LZM.pjIdx=0;LZM.pjLangkah=0;LZM.fasa="pinjam";
  INP="";                                   // buang apa-apa taipan yang tertinggal
}
function LZMdraw(){
  const w=document.getElementById("lazimWrap");
  if(!w)return;
  const n=LZM.n,PJ=LZM.pjLangkah,i=LZM.lajur;
  const memPinjam=LZM.fasa==="pinjam";
  const pas=memPinjam?LZM.pjRantai[LZM.pjIdx]:null;
  const pDari=pas?pas[0]:i+1, pKe=pas?pas[1]:i;   // lajur beri → lajur terima
  const sel=(isi,kelas,id)=>`<div class="sel ${kelas||""}" ${id?`id="${id}"`:""}>${isi}</div>`;
  let baris1="",baris2="",baris3="",kepala="",tok="";
  for(let k=n-1;k>=0;k--){
    kepala+=`<div class="h">${NAMA_TEMPAT[k]||""}</div>`;
    const dipinjam=LZM.pinjam[k];
    const asalA=(LZM.atas[k]==="·")?"":LZM.atas[k];
    const atasKecil=LZM.op==="+"
      ?(LZM.bawa[k]?`<span class="atas">${LZM.bawa[k]}</span>`:"")
      :(dipinjam?`<span class="atas pinjam">${LZM.kerja[k]}</span>`:"");
    const fokusA=memPinjam&&((PJ===1&&k===pDari)||(PJ>=2&&k===pKe));
    baris1+=sel(atasKecil+(dipinjam?`<span class="coret">${asalA}</span>`:asalA),
      "selAtas"+(fokusA?" fokus":"")+(memPinjam&&PJ===3&&k===pKe?" tumbuh":""),"selL"+k);
    baris2+=sel(LZM.bawah[k]==="·"?"":LZM.bawah[k]);
    const aktif=!memPinjam&&k===i;
    if(LZM.langkau[k]){ baris3+=sel("","jwp",""); continue; }   // lajur dilangkau: biar kosong
    const isi=aktif?INP:(LZM.jwp[k]!==null?String(LZM.jwp[k]):"");
    // JANGAN guna || di sini — digit 0 ialah nilai sah, bukan kotak kosong
    baris3+=sel(isi!==""?isi:(aktif?"":"?"),
      "jwp"+(aktif?" aktif":"")+(LZM.jwp[k]!==null&&!aktif?" terisi":""));
  }
  if(memPinjam&&(PJ===1||PJ===2))
    tok=`<div class="pjtok${PJ===2?" sampai":""}" id="pjtok">${PJ===2?"= 10 "+NAMA_TEMPAT[pKe]:"1 "+NAMA_TEMPAT[pDari]}</div>`;
  const gab=(memPinjam&&PJ===3)
    ?`<div class="gabung">${LZM.kerja[pKe]-10} + 10 = <b>${LZM.kerja[pKe]} ${NAMA_TEMPAT[pKe]}</b></div>`:"";
  w.className="lzi";
  w.style.gridTemplateColumns="auto repeat("+n+",auto)";
  w.innerHTML=`<div></div>${kepala}
    <div></div>${baris1}${tok}${gab}
    <div class="sel op">${LZM.op}</div>${baris2}
    <div class="garis" style="grid-column:1/${n+2}"></div>
    <div></div>${baris3}`;
  const L=document.getElementById("lzLangkah");
  if(!L)return;
  const t=NAMA_TEMPAT[i]||"";
  const nDari=NAMA_TEMPAT[pDari],nKe=NAMA_TEMPAT[pKe];
  const berantai=memPinjam&&LZM.pjRantai.length>1;
  const kiraRantai=berantai?` <span style="color:var(--dim)">(pinjaman ${LZM.pjIdx+1} daripada ${LZM.pjRantai.length})</span>`:"";
  L.innerHTML= memPinjam?(
      PJ===0?(LZM.pjIdx>0
          ?`Lajur <b>${nDari}</b> kini ada <b>${LZM.kerja[pDari]}</b>. `
           +`Sekarang kita boleh ambil 1 ${nDari} untuk lajur <b>${nKe}</b>.`
          :berantai
          ?`Digit <b>${t}</b> tidak cukup, dan lajur <b>${NAMA_TEMPAT[i+1]}</b> pula kosong. `
           +`Kita perlu ambil daripada lajur <b>${nDari}</b> dahulu.`
          :`Digit <b>${t}</b> tidak cukup untuk ditolak. Kita perlu kumpul semula.`)
        +`<button type="button" class="btnKumpul" onclick="LZMkumpul()">`
        +(LZM.pjIdx>0?`Ambil 1 ${nDari} ›`:"🔁 Mula Kumpul Semula")+`</button>`
      :PJ===1?`<b>Langkah 1 — Ambil.</b> 1 ${nDari} diambil daripada lajur ${nDari}.${kiraRantai}`
        +`<button type="button" class="btnKumpul" onclick="LZMkumpul()">Bawa ke lajur ${nKe} ›</button>`
      :PJ===2?`<b>Langkah 2 — Bawa.</b> 1 ${nDari} sama dengan <b>10 ${nKe}</b>.${kiraRantai}`
        +`<button type="button" class="btnKumpul" onclick="LZMkumpul()">Gabungkan ›</button>`
      :`<b>Langkah 3 — Gabung.</b> Lajur ${nKe} kini ada <b>${LZM.kerja[pKe]} ${nKe}</b>.${kiraRantai}`
        +`<button type="button" class="btnKumpul" onclick="LZMkumpul()">`
        +(LZM.pjIdx+1<LZM.pjRantai.length?`Pinjam untuk lajur ${NAMA_TEMPAT[pKe-1]} ›`:"Mula Kira ›")+`</button>`)
    : i<LZM.n
      ? `Lajur <b>${t}</b>: ${LZM.op==="+"?"tambah":"tolak"} digit ${t}`
        +(LZM.op==="−"?" — <span style='color:var(--dim)'>satu digit sahaja</span>":"")
        +(LZM.op==="+"&&LZM.bawa[i]?` — campur juga <b>${LZM.bawa[i]}</b> yang dibawa naik`:"")
        +(LZM.op==="−"&&LZM.pinjam[i]?` — gunakan <b>${LZM.kerja[i]}</b>`:"")
      : "Selesai — tekan Semak";
  const masuk=document.getElementById("kbdEnter");
  if(masuk){
    masuk.textContent=memPinjam?"Langkah ›":i<LZM.n?"Seterusnya ›":"✓ Semak";
  }
}
function LZMkumpul(){
  if(LZM.fasa!=="pinjam")return;
  const pas=LZM.pjRantai[LZM.pjIdx];
  if(!pas){LZM.fasa="kira";LZMdraw();return;}
  const dari=pas[0],ke=pas[1];
  LZM.pjLangkah++;
  if(LZM.pjLangkah===1){LZM.kerja[dari]-=1;LZM.pinjam[dari]=true;}
  if(LZM.pjLangkah===3){LZM.kerja[ke]+=10;LZM.pinjam[ke]=true;}
  if(LZM.pjLangkah>3){
    LZM.pjIdx++;
    if(LZM.pjIdx>=LZM.pjRantai.length){LZM.fasa="kira";LZM.pjRantai=[];LZM.pjIdx=0;}
    else LZM.pjLangkah=0;
    INP="";                                 // mula mengira dengan kotak kosong
    LZMdraw();return;
  }
  LZMdraw();
  setTimeout(LZMposToken,20);
}
function LZMposToken(){
  const t=document.getElementById("pjtok");
  if(!t)return;
  const pas=LZM.pjRantai[LZM.pjIdx]||[LZM.lajur+1,LZM.lajur];
  const sasar=document.getElementById("selL"+(LZM.pjLangkah>=2?pas[1]:pas[0]));
  if(sasar&&sasar.offsetWidth)t.style.left=(sasar.offsetLeft+sasar.offsetWidth/2)+"px";
}
function LZMenter(){
  if(LZM.fasa==="pinjam"){LZMkumpul();return;}
  const i=LZM.lajur;
  if(i>=LZM.n){cekInteraktif();return;}
  if(INP==="")return;
  const v=parseInt(INP,10);
  if(LZM.op==="+"){
    if(v>=10&&i+1<LZM.n){LZM.jwp[i]=v%10;LZM.bawa[i+1]=Math.floor(v/10);}
    else LZM.jwp[i]=v;
  }else LZM.jwp[i]=v;
  LZM.lajur++;INP="";
  LZMlangkauKosong();
  if(LZM.lajur<LZM.n)LZMsemakPinjam();
  LZMdraw();
  if(LZM.lajur>=LZM.n)setTimeout(()=>cekInteraktif(),260);
}
function LZMtambah(d){
  // Semasa kumpul semula, papan nombor dikunci — murid belum boleh menjawab lagi
  if(LZM.fasa==="pinjam")return;
  // Tolak: setiap lajur hanya satu digit. Tambah: boleh dua digit kerana
  // jumlah lajur boleh mencecah 19 (cth 9 + 9 + 1 dibawa naik)
  const had=LZM.op==="−"?1:2;
  if(INP.length<had){INP+=d;LZMdraw();}
}
function LZMpadam(){
  if(LZM.fasa==="pinjam")return;
  INP=INP.slice(0,-1);LZMdraw();
}
const LZMjawapan=()=>{
  let s="";
  for(let k=LZM.n-1;k>=0;k--)s+=(LZM.jwp[k]===null?"":LZM.jwp[k]);
  return parseInt(s||"NaN",10);
};
const LZMbetul=()=>LZM.lajur>=LZM.n&&LZM.jwp.every(x=>x!==null)
  &&LZMjawapan()===(LZM.op==="+"?LZM.a+LZM.b:LZM.a-LZM.b);

/* ---------- Bentuk lazim umum: tiga nombor, darab dan bahagi ---------- */
function komponenOperasiLazim(nombor,op,jawapan,nota,tanpaPad){
  const nums=[].concat(nombor).map(Number);
  const n=Math.max(String(Math.abs(jawapan)).length,...nums.map(x=>String(Math.abs(x)).length));
  if(op==="÷"){
    return `<div class="opl-bahagi" id="operasiLazimWrap" data-n="${String(jawapan).length}"
      data-had="${String(jawapan).length}">
        <div class="opl-kosong"></div><div class="opl-hasil" id="oplHasil">?</div>
        <div class="opl-pembahagi">${fmt(nums[1])}</div>
        <div class="opl-dividen">${fmt(nums[0])}</div>
      </div>
      <div class="opl-nota">${nota||"Tulis hasil bahagi pada ruang di atas."}</div>`
      +(tanpaPad?"":padNombor("", "cekInteraktif()", true));
  }
  let kepala="",baris="";
  for(let k=n-1;k>=0;k--)kepala+=`<div class="h">${NAMA_TEMPAT[k]||""}</div>`;
  nums.forEach((v,idx)=>{
    const digit=String(v).padStart(n," ").split("");
    baris+=`<div class="sel op">${idx===nums.length-1?op:""}</div>`
      +digit.map(x=>`<div class="sel">${x===" "?"":x}</div>`).join("");
  });
  const kotak=Array(n).fill(0).map((_,i)=>`<div class="sel opl-jwp" data-pos="${i}">${i===n-1?"?":""}</div>`).join("");
  return `<div class="lzi${tanpaPad?" lzi-kecil":""}" id="operasiLazimWrap" data-n="${n}" data-had="${String(jawapan).length}"
      style="grid-template-columns:auto repeat(${n},auto)">
      <div></div>${kepala}${baris}
      <div class="garis" style="grid-column:1/${n+2}"></div>
      <div></div>${kotak}
    </div>
    <div class="opl-nota">${nota||"Susun digit mengikut nilai tempat dan kira dari kanan."}</div>`
    +(tanpaPad?"":padNombor("", "cekInteraktif()", true));
}
function OPLdraw(){
  const w=document.getElementById("operasiLazimWrap");
  if(!w)return;
  const hasil=document.getElementById("oplHasil");
  if(hasil){hasil.textContent=INP||"?";return;}
  const n=+w.getAttribute("data-n")||1;
  const digit=INP.padStart(n," ").slice(-n).split("");
  w.querySelectorAll(".opl-jwp").forEach((el,i)=>{
    const v=digit[i]||" ";
    el.textContent=v===" "?(i===n-1&&INP===""?"?":""):v;
    el.classList.toggle("ada",v!==" ");
  });
}
function soalOpsLazim(a,b,op,j,hint,tajuk,gbr){
  if(op==="+"||op==="−"){
    return{mod:"interaktif",q:`${tajuk||{"+":"Tambah","−":"Tolak"}[op]} menggunakan <b>bentuk lazim</b>`,
      vis:(gbr?gambarOps(gbr[0],gbr[1],gbr[2]):"")+komponenLazim(a,b,op,op==="+"
        ?"Kira setiap lajur dari sa. Kumpul semula apabila perlu."
        :"Kira setiap lajur dari sa. Kumpul semula apabila perlu."),
      cek:()=>LZMbetul(),ansVal:fmt(j),hint:hint};
  }
  return op==="×"?soalDarabTeknikal(a,b,tajuk):soalBahagiTeknikal(a,b,j,0,tajuk);
}
function soalCeritaTambahTolakLazim(a,b,op,j,cerita){
  return{mod:"interaktif",q:"Selesaikan masalah menggunakan <b>bentuk lazim</b>",
    vis:`<div class="ref">${cerita}</div>`+komponenLazim(a,b,op,
      "Fahami maklumat, tulis ayat matematik, kemudian kira dari rumah sa."),
    cek:()=>LZMbetul(),ansVal:fmt(j),
    hint:`Fahami soalan → Fikir cara → ${fmt(a)} ${op} ${fmt(b)} = ${fmt(j)} → Semak.`};
}
function soalTambahTigaLazim(a,b,c,j){

let DRB={atas:0,bawah:0,aDigit:[],mDigit:[],langkah:[],jawab:[],i:0,inp:"",n:1};
function DRBbina(atas,bawah){
  const aDigit=String(atas).split("").reverse().map(Number);
  const mDigit=String(bawah).split("").reverse().map(Number);
  const langkah=[];
  mDigit.forEach((m,row)=>{
    let bawa=0;
    aDigit.forEach((d,col)=>{
      const mentah=d*m+bawa;
      const akhir=col===aDigit.length-1;
      const jangka=String(mentah);
      const bawaBaru=akhir?0:Math.floor(mentah/10);
      langkah.push({jenis:"digit",row,col,d,m,bawa,mentah,bawaBaru,akhir,jangka});
      bawa=bawaBaru;
    });
  });
  if(mDigit.length>1){
    const separa=mDigit.map((m,row)=>atas*m*Math.pow(10,row));
    const n=String(atas*bawah).length;
    let bawa=0;
    for(let col=0;col<n;col++){
      const tambah=separa.map(v=>Math.floor(v/Math.pow(10,col))%10);
      const mentah=tambah.reduce((x,y)=>x+y,0)+bawa;
      const akhir=col===n-1;
      const jangka=String(mentah);
      const bawaBaru=akhir?0:Math.floor(mentah/10);
      langkah.push({jenis:"jumlah",col,tambah,bawa,mentah,bawaBaru,akhir,jangka});
      bawa=bawaBaru;
    }
  }
  return{atas,bawah,aDigit,mDigit,langkah,jawab:Array(langkah.length).fill(null),
    i:0,inp:"",n:Math.max(String(atas*bawah).length,String(atas).length,String(bawah).length)};
}

    const tempatPendarab=NAMA_TEMPAT[semasa.row]||`digit ${semasa.row+1}`;

      +`${semasa.d} × ${semasa.m}${tambah}.${awalBaris} `
      +(semasa.akhir?"Tulis <b>semua hasil</b> kerana ini digit terakhir."
        :`Taip <b>hasil penuh</b>. Sistem akan menulis digit akhir di rumah <b>${rumahTulis}</b> `

          +`dan membawa lebihan ke rumah seterusnya.`);

  const lalu=DRB.langkah[DRB.i-1];

      const kira=`${lalu.d} × ${lalu.m}${lalu.bawa?` + ${lalu.bawa}`:""} = ${lalu.mentah}`;

let BHG={dividen:0,pembahagi:1,digit:[],pusingan:[],langkah:[],jawab:[],i:0,inp:"",n:1};
function BHGbina(dividen,pembahagi){
  const digit=String(dividen).split("").map(Number);
  const pusingan=[],langkah=[];
  let bakiBawa=0,mulaHasil=false;
  digit.forEach((d,akhir)=>{
    const no=akhir;
    const semasa=bakiBawa*10+d;
    const hasil=Math.floor(semasa/pembahagi);
    const darab=hasil*pembahagi;
    const baki=semasa-darab;
    const turun=akhir<digit.length-1?digit[akhir+1]:null;
    const seterusnya=turun===null?null:baki*10+turun;
    const sorokHasil=!mulaHasil&&hasil===0&&akhir<digit.length-1;
    if(hasil!==0||!sorokHasil)mulaHasil=true;
    pusingan.push({no,akhir,semasa,hasil,darab,baki,turun,seterusnya,sorokHasil});
    langkah.push({jenis:"bahagi",pusingan:no,jangka:String(hasil)});
    langkah.push({jenis:"darab",pusingan:no,jangka:String(darab)});
    langkah.push({jenis:"tolak",pusingan:no,jangka:String(baki)});
    bakiBawa=baki;
  });
  return{dividen,pembahagi,digit,pusingan,langkah,jawab:Array(langkah.length).fill(null),
    i:0,inp:"",n:digit.length};
}

  }
  h+=BHGbaris("Hasil",hasil,"bhgl-hasil",aktifHasil);

  const dividen=BHG.digit.map(String);
  const sorotDividen=[];
  if(no===0)for(let x=0;x<=kitar.akhir;x++)sorotDividen.push(x);
  else sorotDividen.push(kitar.akhir);
  h+=BHGbaris(`${BHG.pembahagi}`,dividen,"bhgl-dividen",[],sorotDividen);

  const nilai=Array(BHG.n).fill("");
  BHGletak(nilai,kitar.semasa,kitar.akhir);
  h+=BHGbaris("Semasa",nilai,"bhgl-semasa");

  if(BHG.i>=asas+1){
    const produk=Array(BHG.n).fill("");
    let aktifProduk=[];
    if(langkah&&langkah.jenis==="darab"){
      BHGletak(produk,BHG.inp||"?",kitar.akhir);
      aktifProduk=Array(Math.max(1,(BHG.inp||"?").length)).fill(0)
        .map((_,x)=>kitar.akhir-Math.max(1,(BHG.inp||"?").length)+1+x).filter(x=>x>=0);
    }else BHGletak(produk,BHG.jawab[asas+1],kitar.akhir);
    h+=BHGbaris("− Darab",produk,"bhgl-produk",aktifProduk);
    h+='<div class="bhgl-garis"></div>';
  }
  if(BHG.i>=asas+2){
    const baki=Array(BHG.n).fill("");
    let aktifBaki=[];
    if(langkah&&langkah.jenis==="tolak"){
      BHGletak(baki,BHG.inp||"?",kitar.akhir);
      aktifBaki=Array(Math.max(1,(BHG.inp||"?").length)).fill(0)
        .map((_,x)=>kitar.akhir-Math.max(1,(BHG.inp||"?").length)+1+x).filter(x=>x>=0);
    }else BHGletak(baki,BHG.jawab[asas+2],kitar.akhir);
    h+=BHGbaris("Baki",baki,"bhgl-baki",aktifBaki);
  }
  p.innerHTML=h;

  const a=document.getElementById("bhgArahan");
  const m=document.getElementById("bhgMaklum");
  const prog=document.getElementById("bhgKemajuan");
  if(langkah&&langkah.jenis==="bahagi")
    a.innerHTML=`${kitar.semasa} ÷ ${BHG.pembahagi}. Taip <b>satu digit hasil bahagi</b>.`;
  else if(langkah&&langkah.jenis==="darab")
    a.innerHTML=`${kitar.hasil} × ${BHG.pembahagi}. Taip hasil darab; nombor itu akan ditulis <b>di bawah ${kitar.semasa}</b>.`;
  else if(langkah)
    a.innerHTML=`${kitar.semasa} − ${kitar.darab}. Taip hasil tolak untuk mendapatkan <b>baki</b>.`;
  else a.innerHTML="Semua digit telah dibahagi.";

  const lalu=BHG.langkah[BHG.i-1];
  if(m){
    if(!lalu)m.textContent=`Mulakan dengan ${kitar.semasa} ÷ ${BHG.pembahagi}.`;
    else{
      const pk=BHG.pusingan[lalu.pusingan];
      if(lalu.jenis==="bahagi"&&pk.sorokHasil)
        m.innerHTML=`Jawapan <b>0</b> betul kerana ${pk.semasa} lebih kecil daripada ${BHG.pembahagi}. `
          +`Sifar pendahulu tidak ditulis pada hasil; sekarang darab 0 × ${BHG.pembahagi}.`;
      else if(lalu.jenis==="bahagi")
        m.innerHTML=`Tulis <b>${pk.hasil}</b> di atas digit ${BHG.digit[pk.akhir]}. Sekarang darab ${pk.hasil} × ${BHG.pembahagi}.`;
      else if(lalu.jenis==="darab")
        m.innerHTML=`${pk.hasil} × ${BHG.pembahagi} = <b>${pk.darab}</b>. ${pk.darab} ditulis di bawah ${pk.semasa}; sekarang tolak.`;
      else if(pk.turun!==null)
        m.innerHTML=`${pk.semasa} − ${pk.darab} = <b>${pk.baki}</b>. Digit <b>${pk.turun}</b> turun automatik: `
          +`${pk.baki} dan ${pk.turun} menjadi <b>${pk.seterusnya}</b>.`;
      else m.innerHTML=`${pk.semasa} − ${pk.darab} = <b>${pk.baki}</b>. Ini baki akhir.`;
    }
  }
  if(prog)prog.textContent=`Langkah ${Math.min(BHG.i+1,BHG.langkah.length)} daripada ${BHG.langkah.length}`;
  const btn=document.getElementById("kbdEnter");
  if(btn)btn.textContent=BHG.i>=BHG.langkah.length-1?"✓ Semak":"Seterusnya ›";
}
function BHGtambah(d){
  const s=BHG.langkah[BHG.i];
  if(!s)return;
  if(BHG.inp.length<Math.max(1,s.jangka.length))BHG.inp+=d;
  BHGdraw();
}
function BHGpadam(){BHG.inp=BHG.inp.slice(0,-1);BHGdraw();}
function BHGkosong(){BHG.inp="";BHGdraw();}
function BHGenter(){
  const s=BHG.langkah[BHG.i];
  if(!s||BHG.inp===""){
    const p=document.getElementById("bhgPapan");
    if(p){p.classList.add("shake");setTimeout(()=>p.classList.remove("shake"),350);}
    return;
  }
  if(String(BHG.inp)!==String(s.jangka)){
    BHG.inp="";BHGdraw();
    const m=document.getElementById("bhgMaklum");
    if(m)m.innerHTML="<span style='color:var(--p3)'>Belum tepat. Kira semula langkah ini.</span>";
    return;
  }
  BHG.jawab[BHG.i]=BHG.inp;
  BHG.i++;BHG.inp="";
  BHGdraw();
  if(BHG.i>=BHG.langkah.length)setTimeout(()=>cekInteraktif(),260);
}
const BHGbetul=()=>BHG.i>=BHG.langkah.length
  &&BHG.langkah.every((s,i)=>String(BHG.jawab[i])===String(s.jangka));
function komponenBahagiTeknikal(dividen,pembahagi){
  return `<div id="bahagiWrap" data-dividen="${dividen}" data-pembahagi="${pembahagi}">
    <div class="teknik-card bhgl-card">
      <div class="teknik-tag">BENTUK LAZIM BAHAGI — LANGKAH DEMI LANGKAH</div>
      <div class="bhgl-papan" id="bhgPapan"></div>
      <div class="bhgl-arahan" id="bhgArahan"></div>
      <div class="bhgl-maklum" id="bhgMaklum"></div>
      <div class="bhgl-kemajuan" id="bhgKemajuan"></div>
    </div>${padBahagi()}</div>`;
}
function soalBahagiTeknikal(dividen,pembahagi,hasil,baki,tajuk,cerita){
  return{mod:"interaktif",
    q:cerita?"Selesaikan masalah menggunakan <b>bentuk lazim bahagi</b>"
      :`${tajuk||"Bahagi"}: lengkapkan <b>bentuk lazim</b> dan cari baki`,
    vis:(cerita?`<div class="ref">${cerita}</div>`:"")+komponenBahagiTeknikal(dividen,pembahagi),
    cek:()=>BHGbetul(),
    ansVal:`hasil ${fmt(hasil)}${baki?" baki "+fmt(baki):""}`,
    hint:`Bahagi satu bahagian pada satu masa. Setiap kali: bahagi, darab semula, tolak dan turunkan digit. `
      +`Jadi, ${fmt(dividen)} ÷ ${fmt(pembahagi)} = <b>${fmt(hasil)}${baki?" baki "+fmt(baki):""}</b>.`};
}

/* ---------- Mekanik: Suaikan (padankan pasangan) ---------- */
let SUAI={kiri:[],kanan:[],jawab:{},pilih:null};
function komponenSuai(pasangan,nota){
  const kiri=pasangan.map((x,i)=>({t:x[0],id:i}));
  const kanan=shuffle(pasangan.map((x,i)=>({t:x[1],id:i})));
  return `<div class="suai" id="suaiWrap"
    data-kiri='${esc(JSON.stringify(kiri))}' data-kanan='${esc(JSON.stringify(kanan))}'></div>
    ${nota?`<div class="hint">${nota}</div>`:'<div class="hint">Klik satu kad di kiri, kemudian pasangannya di kanan.</div>'}`;
}
function SUAIsedia(){
  const w=document.getElementById("suaiWrap");
  if(!w)return;
  SUAI={kiri:JSON.parse(w.getAttribute("data-kiri")),
        kanan:JSON.parse(w.getAttribute("data-kanan")),jawab:{},pilih:null};
  SUAIdraw();
}
function SUAIdraw(){
  const w=document.getElementById("suaiWrap");
  if(!w)return;
  let html="";
  SUAI.kiri.forEach((k,i)=>{
    const no=SUAI.jawab[k.id]!==undefined?Object.keys(SUAI.jawab).filter(x=>+x<=k.id).length:0;
    const siap=SUAI.jawab[k.id]!==undefined;
    html+=`<div class="sitem${SUAI.pilih===k.id?" pilih":""}${siap?" siap":""}"
      onclick="SUAIkiri(${k.id})">${k.t}${siap?`<span class="snum">${no}</span>`:""}</div>`;
    html+=`<div class="sgaris"></div>`;
    const r=SUAI.kanan[i];
    const dipakai=Object.values(SUAI.jawab).indexOf(r.id);
    const noR=dipakai>=0?Object.keys(SUAI.jawab).filter(x=>+x<=Object.keys(SUAI.jawab).find(y=>SUAI.jawab[y]===r.id)).length:0;
    html+=`<div class="sitem${dipakai>=0?" siap":""}" onclick="SUAIkanan(${r.id})">${r.t}${dipakai>=0?`<span class="snum">${noR}</span>`:""}</div>`;
  });
  w.innerHTML=html;
}
function SUAIkiri(id){
  if(SUAI.jawab[id]!==undefined){delete SUAI.jawab[id];SUAI.pilih=null;}
  else SUAI.pilih=(SUAI.pilih===id?null:id);
  SUAIdraw();
}
function SUAIkanan(id){
  if(SUAI.pilih===null)return;
  Object.keys(SUAI.jawab).forEach(k=>{if(SUAI.jawab[k]===id)delete SUAI.jawab[k];});
  SUAI.jawab[SUAI.pilih]=id;SUAI.pilih=null;SUAIdraw();
}
const SUAIbetul=()=>SUAI.kiri.length>0
  && Object.keys(SUAI.jawab).length===SUAI.kiri.length
  && SUAI.kiri.every(k=>SUAI.jawab[k.id]===k.id);

/* ---------- Mekanik: Lengkapkan (isi tempat kosong) ---------- */
let ISI={urut:[],kosong:[],nilai:[],bank:[],aktif:0};
function komponenIsi(urutan,indeksKosong,bankTambahan,nota){
  const betul=indeksKosong.map(i=>urutan[i]);
  const bank=shuffle([...betul,...(bankTambahan||[])]);
  return `<div class="urut" id="urutWrap"
      data-urut='${esc(JSON.stringify(urutan))}'
      data-kosong='${esc(JSON.stringify(indeksKosong))}'
      data-bank='${esc(JSON.stringify(bank))}'></div>
    <div class="bank" id="bankWrap"></div>
    ${nota?`<div class="hint">${nota}</div>`:'<div class="hint">Klik nombor di bawah untuk mengisi kotak berwarna.</div>'}`;
}
function ISIsedia(){
  const w=document.getElementById("urutWrap");
  if(!w)return;
  ISI.urut=JSON.parse(w.getAttribute("data-urut"));
  ISI.kosong=JSON.parse(w.getAttribute("data-kosong"));
  ISI.bank=JSON.parse(w.getAttribute("data-bank"));
  ISI.nilai=ISI.kosong.map(()=>null);
  ISI.aktif=0;
  ISIdraw();
}
function ISIdraw(){
  const w=document.getElementById("urutWrap"),b=document.getElementById("bankWrap");
  if(!w)return;
  w.innerHTML=ISI.urut.map((v,i)=>{
    const k=ISI.kosong.indexOf(i);
    if(k<0)return `<div class="ubox">${fmt(v)}</div>`;
    const nilai=ISI.nilai[k];
    return `<div class="ubox ${nilai===null?"kosong":"terisi"}${ISI.aktif===k&&nilai===null?" aktif":""}"
      onclick="ISIklik(${k})">${nilai===null?"?":fmt(nilai)}</div>`;
  }).join("");
  if(b)b.innerHTML=ISI.bank.map((v,i)=>
    `<button type="button" class="btile${ISI.nilai.includes(v)&&ISI.bank.filter(x=>x===v).length<=ISI.nilai.filter(x=>x===v).length?" guna":""}"
      onclick="ISIambil(${v});this.blur()">${fmt(v)}</button>`).join("");
}
function ISIklik(k){
  if(ISI.nilai[k]!==null){ISI.nilai[k]=null;ISI.aktif=k;}
  else ISI.aktif=k;
  ISIdraw();
}
function ISIambil(v){
  let k=ISI.aktif;
  if(ISI.nilai[k]!==null)k=ISI.nilai.findIndex(x=>x===null);
  if(k<0)return;
  ISI.nilai[k]=v;
  const seterus=ISI.nilai.findIndex(x=>x===null);
  ISI.aktif=seterus<0?k:seterus;
  ISIdraw();
}
const ISIbetul=()=>ISI.kosong.length>0
  && ISI.nilai.every((v,i)=>v!==null&&v===ISI.urut[ISI.kosong[i]]);

/* ---------- Petak 100 ---------- */
function petak100(warnai,mula,tamat){
  let s="";
  for(let i=(mula||1);i<=(tamat||100);i++)
    s+=`<i class="${warnai(i)?"warna":""}">${i}</i>`;
  return `<div class="p100">${s}</div>`;
}

/* ===================== ENJIN AKTIVITI ===================== */
const ENJIN={};

/* --- Banding: banyak/sedikit, panjang, jisim, nombor --- */
ENJIN.banding=c=>()=>{
  if(c.angka){
    const max=c.max||100,a=R(1,max),b=R(1,max);
    if(a===b)return ENJIN.banding(c)();
    return{q:`Manakah lebih besar?`,vis:`<div class="vs">
      <div><div class="lbl">A</div><div class="objwrap" style="font-size:30px;font-weight:900">${fmt(a)}</div></div>
      <div class="vsx">?</div>
      <div><div class="lbl">B</div><div class="objwrap" style="font-size:30px;font-weight:900">${fmt(b)}</div></div></div>`,
      opts:[fmt(a),fmt(b)],ans:a>b?0:1,
      hint:`${fmt(Math.max(a,b))} lebih besar daripada ${fmt(Math.min(a,b))}.`};
  }
  if(c.mod==="panjang"){
    const p=[["Pensel","✏️",3],["Pembaris","📏",6],["Buku","📕",5],["Klip kertas","📎",1],["Payung","☂️",9]];
    let[x,y]=shuffle(p).slice(0,2); if(x[2]===y[2])return ENJIN.banding(c)();
    return{q:"Manakah lebih panjang?",vis:`<div class="vs">
      <div><div class="lbl">${x[0]}</div><div class="objwrap"><span style="font-size:${20+x[2]*5}px">${x[1]}</span></div></div>
      <div class="vsx">vs</div>
      <div><div class="lbl">${y[0]}</div><div class="objwrap"><span style="font-size:${20+y[2]*5}px">${y[1]}</span></div></div></div>`,
      opts:[x[0],y[0]],ans:x[2]>y[2]?0:1,hint:`${x[2]>y[2]?x[0]:y[0]} lebih panjang.`};
  }
  if(c.mod==="jisim"){
    const p=[["Bulu","🪶",1],["Belon","🎈",1],["Buku","📕",4],["Batu","🪨",8],["Batu bata","🧱",9],["Bola","⚽",3]];
    let[x,y]=shuffle(p).slice(0,2); if(x[2]===y[2])return ENJIN.banding(c)();
    return{q:"Manakah lebih berat?",vis:`<div class="vs">
      <div><div class="lbl">${x[0]}</div><div class="objwrap"><span class="obj">${x[1]}</span></div></div>
      <div class="vsx">⚖️</div>
      <div><div class="lbl">${y[0]}</div><div class="objwrap"><span class="obj">${y[1]}</span></div></div></div>`,
      opts:[x[0],y[0]],ans:x[2]>y[2]?0:1,hint:`${x[2]>y[2]?x[0]:y[0]} lebih berat.`};
  }
  const max=c.max||12;
  const e1=pick(OBJ);let e2=pick(OBJ);while(e2===e1)e2=pick(OBJ);
  // 1 daripada 4 soalan menguji konsep "sama banyak" (DSKP Tahun 1)
  const sama=Math.random()<.25;
  let a=R(1,max),b=sama?a:R(1,max);
  if(!sama&&a===b)b=a===max?a-1:a+1;
  const vis=padanan(a,b,e1,e2,"Kumpulan A","Kumpulan B");
  if(sama)
    return{q:"Bandingkan dua kumpulan ini",vis:vis,
      opts:["Sama banyak","Kumpulan A lebih banyak","Kumpulan B lebih banyak"],
      ans:0,hint:`Setiap objek A dapat dipadankan dengan satu objek B, tiada lebihan. Kedua-duanya ${a} — sama banyak.`};
  const tanya=pick(["banyak","sedikit"]);
  const jwp=tanya==="banyak"?(a>b?"Kumpulan A":"Kumpulan B"):(a<b?"Kumpulan A":"Kumpulan B");
  return{q:`Kumpulan manakah lebih ${tanya}?`,vis:vis,
    opts:["Kumpulan A","Kumpulan B","Sama banyak"],ans:-1,ansVal:jwp,
    hint:`A ada ${a}, B ada ${b}. ${a>b?"A":"B"} ada lebihan selepas dipadankan, `
      +`jadi ${jwp} yang lebih ${tanya}.`};
};

/* --- Kira / kenali nombor --- */
ENJIN.kira=c=>()=>{
  const min=c.min||1,max=c.max||10;
  if(max<=20){
    // subtopik "Kenali Sifar": paksi separuh soalan menunjukkan sifar
    const n=(c.sifar&&Math.random()<.5)?0:R(c.sifar?1:min,max),e=pick(OBJ);
    const o=shuffle([n,n+1,Math.max(min,n-1),n+2].filter((v,i,a)=>a.indexOf(v)===i&&v>=0)).slice(0,4);
    if(!o.includes(n))o[0]=n;
    return{q:"Berapa banyak semuanya?",
      vis:n===0?`<div class="objwrap" style="flex-direction:column;gap:6px">
        <span style="font-size:clamp(26px,5vh,40px);opacity:.35">🧺</span>
        <span style="color:var(--dim);font-size:13px">Bakul ini kosong — tiada objek langsung</span></div>`:objek(n,e),
      opts:shuffle(o).map(String),ans:-1,ansVal:String(n),
      hint:n===0?"Tiada objek bermakna sifar (0).":`Bilang satu per satu: ${n}.`};
  }
  const n=R(min,max);
  const o=shuffle([n,n+R(1,9),n-R(1,9),n+R(10,Math.max(11,Math.floor(max/4)))])
    .filter(x=>x>=0&&x<=max).map(String);
  return{q:"Nombor yang manakah ini?",vis:dienes(n),opts:[...new Set(o)],ans:-1,ansVal:String(n),
    hint:`Bilang blok: ${perkataan(n)}.`};
};

/* --- Kenali Sifar: 7 pendekatan berbeza (KSSR Tahun 1, m/s 7) --- */
ENJIN.sifar=c=>()=>{
  const e=pick(OBJ);
  const jenis=c.jenis||pick(["kosong","habis","menurun","simbol","pilihbekas",

      opts:["0","1","2"],ans:-1,ansVal:"0",

      ["burung","🐤","Semua burung terbang pergi"],

  }

        ${siri.map((x,i)=>i===siri.length-1?'<span style="color:var(--p1)">❓</span>':x).join("  ,  ")}</div>`,
      opts:["0","1","2"],ans:-1,ansVal:"0",
      hint:`Selepas 1 ialah <b>0</b>. Sifar ialah nombor paling kecil dalam bilangan ini.`};
  }

  if(jenis==="simbol"){

  }

  if(jenis==="pilihbekas"){
    const isi=[R(1,4),R(1,4),0];
    const susun=shuffle(isi.map((v,i)=>({v:v,k:String.fromCharCode(65+i)})));
    const jwp=susun.find(x=>x.v===0).k;
    return{q:"Bekas manakah mempunyai <b>sifar</b> objek?",
      vis:`<div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">
        ${susun.map(x=>`<div style="text-align:center">
          <div class="lbl" style="font-size:13px;color:var(--dim);font-weight:700;margin-bottom:6px">Bekas ${x.k}</div>
          <div style="background:#0d1233;border-radius:12px;padding:12px;min-width:86px;min-height:66px;
            display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center">
            ${x.v?Array(x.v).fill(`<span style="font-size:22px">${e}</span>`).join(""):'<span style="color:#3a4587;font-size:12px">kosong</span>'}
          </div></div>`).join("")}</div>`,
      opts:susun.map(x=>"Bekas "+x.k),ans:-1,ansVal:"Bekas "+jwp,
      hint:`Bekas ${jwp} tiada objek langsung — bilangannya <b>sifar (0)</b>.`};
  }

  if(jenis==="perkataan"){
    return{q:"Bagaimana kita sebut nombor <b>0</b>?",
      vis:`<div class="objwrap" style="font-size:clamp(38px,7.5vh,66px);font-weight:900;color:var(--p1)">0</div>`,
      opts:shuffle(["sifar","satu","sepuluh","sembilan"]),ans:-1,ansVal:"sifar",
      hint:`Nombor 0 disebut <b>sifar</b>. Ia bermaksud tiada apa-apa.`};
  }

  if(jenis==="sebelum"){
    const t=R(1,5);
    const siri=[];for(let i=0;i<=5;i++)siri.push(i);
    return{q:`Apakah nombor <b>sebelum ${t}</b>?`,
      vis:`<div class="objwrap" style="font-size:clamp(17px,3vh,25px);font-weight:900;letter-spacing:5px">
        ${siri.map(x=>x===t-1?'<span style="color:var(--p1)">❓</span>'
          :x===t?`<span style="color:var(--p2)">${x}</span>`:`<span style="opacity:.4">${x}</span>`).join("  ")}</div>`,
      opts:shuffle([String(t-1),String(t+1),String(t)]),ans:-1,ansVal:String(t-1),
      hint:t===1?`Nombor sebelum 1 ialah <b>0</b>. Sifar ialah nombor pertama.`
        :`Pada garis nombor, sebelum ${t} ialah <b>${t-1}</b>.`};
  }

  if(jenis==="tiada"){
    const ada=pick([["🐶","anjing"],["🐟","ikan"],["🐤","itik"],["🦋","rama-rama"]]);
    let cari=pick([["🐱","kucing"],["🐘","gajah"],["🐢","kura-kura"],["🐝","lebah"]]);
    const bil=R(3,6);
    return{q:`Berapa ekor <b>${cari[1]}</b> dalam gambar ini?`,
      vis:`<div class="objwrap">${Array(bil).fill(`<span class="obj">${ada[0]}</span>`).join("")}</div>
        <div class="hint">Gambar ini hanya menunjukkan ${ada[1]}.</div>`,
      opts:shuffle(["0","1",String(bil)]),ans:-1,ansVal:"0",
      hint:`Tiada ${cari[1]} langsung dalam gambar. Jawapannya <b>0</b> (sifar).`};
  }

  if(jenis==="angka"){
    return{q:'Perkataan <b>"sifar"</b> ditulis dalam angka sebagai?',
      vis:`<div class="objwrap" style="font-size:clamp(22px,4.6vh,34px);font-weight:900;color:var(--p2);padding:clamp(8px,1.7vh,18px)">sifar</div>`,
      opts:shuffle(["0","1","10","4"]),ans:-1,ansVal:"0",
      hint:`Perkataan <b>sifar</b> ditulis sebagai angka <b>0</b>.`};
  }

  if(jenis==="garisnombor"){
    const siri=[0,1,2,3,4,5];
    return{q:"Nombor manakah <b>paling kecil</b> pada garis nombor ini?",
      vis:`<div class="numline" style="height:66px">
        ${siri.map((x,i)=>`<div class="nltick" style="left:${i*20}%"></div>
          <div class="nllbl" style="left:${i*20}%;font-size:14px;font-weight:800;color:var(--txt)">${x}</div>`).join("")}
        <div class="nlbar"></div></div>`,
      opts:shuffle(["0","1","5"]),ans:-1,ansVal:"0",
      hint:`Pada garis nombor, <b>0</b> berada paling kiri — ia nombor paling kecil.`};
  }

  // banding: sifar ialah yang paling sedikit
  const n2=R(1,5);
  return{q:"Kumpulan manakah lebih sedikit?",
    vis:padanan(0,n2,e,e,"Kumpulan A","Kumpulan B"),
    opts:["Kumpulan A","Kumpulan B","Sama banyak"],ans:-1,ansVal:"Kumpulan A",
    hint:`Kumpulan A tiada objek (sifar), Kumpulan B ada ${n2}. Sifar lebih sedikit daripada mana-mana nombor.`};
};

/* --- Tulis 0 hingga 10: murid MENULIS jawapan sendiri (nombor & perkataan) --- */
const EJAAN={0:["sifar","kosong"],1:["satu"],2:["dua"],3:["tiga"],4:["empat"],5:["lima"],
             6:["enam"],7:["tujuh"],8:["lapan","delapan"],9:["sembilan"],10:["sepuluh"]};
ENJIN.tulisAngka=c=>{
 // seimbangkan kedua-dua arah supaya setiap set 6 soalan melatih kedua-duanya
 let bilHuruf=0,bilNombor=0;
 return ()=>{

  const e=pick(OBJ);
  INP="";
  const pilihHuruf=(bilHuruf===bilNombor)?(Math.random()<.5):(bilHuruf<bilNombor);
  // ARAH 1: tunjuk NOMBOR → murid eja PERKATAAN (papan huruf / papan kekunci)
  if(pilihHuruf){
    bilHuruf++;
    return{mod:"interaktif",q:"Tulis nombor ini dalam <b>perkataan</b>",

        +padHuruf("Tekan huruf di atas untuk mengeja, atau taip guna papan kekunci."),
      cek:()=>{
        const j=INP.trim().toLowerCase().replace(/\s+/g,"");
        return EJAAN[n].some(x=>x.replace(/\s+/g,"")===j);
      },
      ansVal:EJAAN[n][0],
      hint:`Nombor <b>${n}</b> dieja <b>${EJAAN[n][0]}</b>.`};
  }
  // ARAH 2: tunjuk PERKATAAN atau OBJEK → murid tulis NOMBOR (papan nombor)
  bilNombor++;
  const dariObjek=Math.random()<.4;
  const gambar=dariObjek
    ?(n===0
      ?`<div class="objwrap" style="flex-direction:column;gap:6px">

          <span style="color:var(--dim);font-size:13px">Bakul ini kosong</span></div>`
      :objek(n,e))
    :`<div class="objwrap" style="font-size:clamp(24px,5vh,36px);font-weight:900;color:var(--p2);padding:clamp(8px,1.8vh,20px);text-transform:capitalize">${EJAAN[n][0]}</div>`;
  return{mod:"interaktif",
    q:dariObjek?"Bilang, kemudian tulis <b>nombornya</b>":"Tulis perkataan ini dalam <b>nombor</b>",
    vis:gambar+padNombor("Tekan nombor di atas, atau taip guna papan kekunci."),
    cek:()=>INP!==""&&parseInt(INP,10)===n,
    ansVal:String(n),
    hint:dariObjek
      ?(n===0?"Tiada objek — tulis <b>0</b>.":`Ada ${n} objek. Tulis <b>${n}</b>.`)
      :`<b>${EJAAN[n][0]}</b> ditulis sebagai <b>${n}</b>.`};
 };
};

/* --- Tulis nombor / perkataan --- */
ENJIN.tulisnom=c=>()=>{
  const mx=c.max||10,n=R(c.min||0,mx);
  const langkah=mx<=20?[1,2,10]:mx<=100?[1,10,20]:[1,10,100];
  if(Math.random()<.5){
    const salah=langkah.flatMap(d=>[n+d,n-d]).filter(x=>x>=0&&x<=mx&&x!==n);
    return{q:`Tulis dalam angka:`,qs:`"${perkataan(n)}"`,vis:"",
      opts:shuffle([n,...shuffle(salah).slice(0,3)]).map(fmt),ans:-1,ansVal:fmt(n),
      hint:`${perkataan(n)} = ${fmt(n)}`};
  }
  const salah=langkah.flatMap(d=>[n+d,n-d]).filter(x=>x>=0&&x<=mx&&x!==n);
  return{q:`Tulis dalam perkataan:`,qs:fmt(n),vis:"",
    opts:shuffle([n,...shuffle(salah).slice(0,3)]).map(perkataan),ans:-1,ansVal:perkataan(n),
    hint:`${fmt(n)} = ${perkataan(n)}`};
};

/* --- Mengenal nombor: objek berkumpulan, petak sepuluh, blok, nombor↔perkataan --- */
function objekKumpulan(n,e,saiz){
  const penuh=Math.floor(n/saiz),baki=n%saiz;
  let kotak="";
  for(let i=0;i<penuh;i++)
    kotak+=`<div class="kbox">${Array(saiz).fill(`<span class="obj">${e}</span>`).join("")}</div>`;
  if(baki)kotak+=`<div class="kbox baki">${Array(baki).fill(`<span class="obj">${e}</span>`).join("")}</div>`;
  return `<div class="kump">${kotak}</div>
    <div class="hint">Bilang mengikut kumpulan ${saiz}${baki?`, kemudian tambah baki`:""}.</div>`;
}
function petakSepuluh(n,e){
  let bingkai="",tinggal=n;
  while(tinggal>0){
    const isi=Math.min(10,tinggal);tinggal-=isi;
    let sel="";
    for(let i=0;i<10;i++)sel+=`<div class="tfc ${i<isi?"terisi":""}">${i<isi?e:""}</div>`;
    bingkai+=`<div class="tf">${sel}</div>`;
  }
  return `<div class="kump">${bingkai}</div>
    <div class="hint">Setiap petak penuh mewakili 10.</div>`;
}
ENJIN.kenalNombor=c=>()=>{
  const mn=c.min||1,mx=c.max||20;
  const n=R(mn,mx),e=pick(OBJ);
  const gaya=pick(c.gaya||["kumpul","kumpul","petak","perkataan","nombor"]);
  const dekat=[n+1,n-1,n+10,n-10,n+2].filter(x=>x>=0&&x<=Math.max(mx,100)&&x!==n);

  if(gaya==="perkataan"){   // nombor → perkataan
    const salah=shuffle(dekat).slice(0,3).map(perkataan);
    return{gaya:gaya,q:"Tulis nombor ini dalam <b>perkataan</b>",
      vis:`<div class="objwrap" style="font-size:clamp(38px,7.5vh,68px);font-weight:900;color:var(--p1)">${n}</div>`,
      opts:shuffle([perkataan(n),...salah]),ans:-1,ansVal:perkataan(n),
      hint:`${n} dibaca <b>${perkataan(n)}</b>.`};
  }
  if(gaya==="nombor"){      // perkataan → nombor
    const salah=shuffle(dekat).slice(0,3).map(String);
    return{gaya:gaya,q:"Tulis perkataan ini dalam <b>angka</b>",
      vis:`<div class="objwrap" style="font-size:clamp(20px,4vh,34px);font-weight:900;color:var(--p2);text-transform:capitalize;padding:clamp(8px,1.8vh,20px)">${perkataan(n)}</div>`,
      opts:shuffle([String(n),...salah]),ans:-1,ansVal:String(n),
      hint:`<b>${perkataan(n)}</b> ditulis sebagai <b>${n}</b>.`};
  }
  if(gaya==="tulisPerkataan"){   // murid MENULIS perkataan
    INP="";
    return{gaya:gaya,mod:"interaktif",q:"Tulis nombor ini dalam <b>perkataan</b>",
      vis:`<div class="objwrap" style="font-size:clamp(34px,6.5vh,62px);font-weight:900;color:var(--p1)">${n}</div>`
        +padPerkataan(perkataan(n),"Setiap kotak untuk satu perkataan. Taip terus — kotak akan bersambung sendiri."),
      cek:()=>SLOTjawapan().replace(/\s+/g,"")===perkataan(n).replace(/\s+/g,""),
      ansVal:perkataan(n),
      hint:`${n} dieja <b>${perkataan(n)}</b>.`};
  }
  if(gaya==="tulisNombor"){      // murid MENULIS angka
    INP="";
    return{gaya:gaya,mod:"interaktif",q:"Tulis perkataan ini dalam <b>angka</b>",
      vis:`<div class="objwrap" style="font-size:clamp(20px,3.8vh,32px);font-weight:900;color:var(--p2);text-transform:capitalize;padding:clamp(8px,1.8vh,18px)">${perkataan(n)}</div>`
        +padNombor("Tekan nombor, kemudian ⏎."),
      cek:()=>INP!==""&&parseInt(INP,10)===n,
      ansVal:String(n),
      hint:`<b>${perkataan(n)}</b> ditulis sebagai <b>${n}</b>.`};
  }
  if(gaya==="petak")
    return{gaya:gaya,q:"Berapakah bilangan semuanya?",vis:petakSepuluh(n,e),
      opts:shuffle([n,...shuffle(dekat).slice(0,3)]).map(String),ans:-1,ansVal:String(n),
      hint:`${Math.floor(n/10)} petak penuh (${Math.floor(n/10)*10}) dan ${n%10} lagi = <b>${n}</b>.`};
  if(gaya==="blok")
    return{gaya:gaya,q:"Nombor yang manakah ini?",vis:dienes(n),
      opts:shuffle([n,...shuffle(dekat).slice(0,3)]).map(String),ans:-1,ansVal:String(n),
      hint:`${Math.floor(n/10)} batang puluh dan ${n%10} kiub sa = <b>${n}</b> (${perkataan(n)}).`};

  // kumpul: objek disusun berkumpulan.
  // Nombor besar (>40) tidak sesuai dipapar sebagai objek longgar —
  // tukar kepada petak sepuluh yang lebih mudah dibilang.
  if(n>40)
    return{gaya:"petak",q:"Berapakah bilangan semuanya?",vis:petakSepuluh(n,e),
      opts:shuffle([n,...shuffle(dekat).slice(0,3)]).map(String),ans:-1,ansVal:String(n),
      hint:`${Math.floor(n/10)} petak penuh (${Math.floor(n/10)*10}) dan ${n%10} lagi = <b>${n}</b>.`};
  const calon=n<=20?[2,3,5,5,10]:[5,5,10,10,7,4];
  const saiz=pick(calon.filter(x=>x<=n))||5;
  return{gaya:"kumpul",q:"Berapakah bilangan objek semuanya?",vis:objekKumpulan(n,e,saiz),
    opts:shuffle([n,...shuffle(dekat).slice(0,3)]).map(String),ans:-1,ansVal:String(n),
    hint:`${Math.floor(n/saiz)} kumpulan ${saiz} = ${Math.floor(n/saiz)*saiz}${n%saiz?`, tambah baki ${n%saiz}`:""} = <b>${n}</b>.`};
};

/* --- Banding nombor: pelbagai bentuk soalan & istilah perbandingan --- */
function kadNombor(v,warna){
  return `<div style="background:#0d1233;border:3px solid ${warna||"var(--line)"};border-radius:14px;
    padding:clamp(8px,1.8vh,16px) clamp(12px,2.4vh,22px);font-size:clamp(26px,4.8vh,42px);
    font-weight:900;color:var(--txt);min-width:clamp(70px,12vh,110px);text-align:center">${fmt(v)}</div>`;
}
ENJIN.bandingNombor=c=>()=>{
  const max=c.max||100;
  const bentuk=pick(["pilihBesar","pilihKecil","isiTempatKosong","isiTempatKosong",
    "objekBanyak","objekSedikit","betulSalah","palingBesar","palingKecil","lebihKurangDaripada"]);
  let a=R(1,max),b=R(1,max);
  if(a===b)b=(b===max)?b-1:b+1;

  if(bentuk==="pilihBesar"||bentuk==="pilihKecil"){
    const besar=bentuk==="pilihBesar";
    const soal=pick(besar?["Nombor manakah <b>lebih besar</b>?","Nombor manakah <b>lebih banyak</b>?"]
                         :["Nombor manakah <b>lebih kecil</b>?","Nombor manakah <b>lebih sedikit</b>?"]);
    const jwp=besar?Math.max(a,b):Math.min(a,b);
    return{q:soal,
      vis:`<div style="display:flex;gap:clamp(10px,2.4vh,22px);justify-content:center;align-items:center">
        ${kadNombor(a)}<div class="psym">dan</div>${kadNombor(b)}</div>`,
      kekalSusun:true,opts:[fmt(a),fmt(b)],ans:-1,ansVal:fmt(jwp),
      hint:`${fmt(Math.max(a,b))} lebih besar, ${fmt(Math.min(a,b))} lebih kecil. `
        +`Jawapannya <b>${fmt(jwp)}</b>.`};
  }

  if(bentuk==="isiTempatKosong"){
    if(Math.random()<.25)b=a;                    // sesekali uji "sama dengan"
    const jwp=a>b?"lebih besar daripada":a<b?"lebih kecil daripada":"sama dengan";
    return{q:"Lengkapkan ayat perbandingan ini",
      vis:`<div style="display:flex;gap:clamp(8px,1.8vh,16px);justify-content:center;align-items:center;flex-wrap:wrap">
        ${kadNombor(a)}
        <div style="background:rgba(255,209,102,.1);border:3px dashed var(--p1);border-radius:12px;
          padding:clamp(8px,1.8vh,16px) clamp(10px,2vh,18px);font-size:clamp(22px,4vh,34px);
          font-weight:900;color:var(--p1)">?</div>
        ${kadNombor(b)}</div>`,
      opts:shuffle(["lebih besar daripada","lebih kecil daripada","sama dengan"]),
      ans:-1,ansVal:jwp,
      hint:`${fmt(a)} <b>${jwp}</b> ${fmt(b)}.`};
  }

  if(bentuk==="objekBanyak"||bentuk==="objekSedikit"){
    const banyak=bentuk==="objekBanyak";
    const had=Math.min(12,max);
    let x=R(1,had),y=R(1,had);
    const sama=Math.random()<.2;
    if(sama)y=x; else if(x===y)y=(y===had)?y-1:y+1;
    const e1=pick(OBJ);let e2=pick(OBJ);while(e2===e1)e2=pick(OBJ);
    const jwp=sama?"Sama banyak":(banyak?(x>y?"Kumpulan A":"Kumpulan B"):(x<y?"Kumpulan A":"Kumpulan B"));
    return{q:`Kumpulan manakah <b>lebih ${banyak?"banyak":"sedikit"}</b>?`,
      vis:padanan(x,y,e1,e2,"Kumpulan A","Kumpulan B"),
      opts:["Kumpulan A","Kumpulan B","Sama banyak"],ans:-1,ansVal:jwp,
      hint:sama?`Kedua-duanya ada ${x} — <b>sama banyak</b>.`
        :`A ada ${x}, B ada ${y}. Jawapannya <b>${jwp}</b>.`};
  }

  if(bentuk==="betulSalah"){
    if(Math.random()<.2)b=a;                  // sesekali uji "sama dengan"
    const benarnya=a>b?"lebih besar daripada":a<b?"lebih kecil daripada":"sama dengan";
    // separuh soalan ayat betul, separuh salah — supaya murid tidak meneka "Salah" sahaja
    const istilah=Math.random()<.5?benarnya
      :pick(["lebih besar daripada","lebih kecil daripada","sama dengan"].filter(x=>x!==benarnya));
    const betul=istilah===benarnya;
    return{q:"Adakah ayat ini betul?",
      vis:`<div class="ref" style="text-align:center;font-size:clamp(16px,2.8vh,24px);font-weight:800">
        ${fmt(a)} &nbsp;${istilah}&nbsp; ${fmt(b)}</div>`,
      opts:["Betul","Salah"],ans:-1,ansVal:betul?"Betul":"Salah",
      hint:`Sebenarnya ${fmt(a)} <b>${benarnya}</b> ${fmt(b)}.`};
  }

  if(bentuk==="palingBesar"||bentuk==="palingKecil"){
    const besar=bentuk==="palingBesar";
    const set=[];while(set.length<3){const v=R(1,max);if(!set.includes(v))set.push(v);}
    const jwp=besar?Math.max(...set):Math.min(...set);
    return{kekalSusun:true,
      q:`Nombor manakah <b>paling ${besar?"besar":"kecil"}</b>?`,
      vis:`<div style="display:flex;gap:clamp(8px,1.8vh,16px);justify-content:center;flex-wrap:wrap">
        ${set.map(v=>kadNombor(v)).join("")}</div>`,
      opts:set.map(fmt),ans:-1,ansVal:fmt(jwp),
      hint:`Bandingkan nilai tempat dari kiri. Yang paling ${besar?"besar":"kecil"} ialah <b>${fmt(jwp)}</b>.`};
  }

  // lebihKurangDaripada: pilih nombor yang lebih / kurang daripada satu nilai rujukan
  const lebih=Math.random()<.5;
  const rujuk=R(Math.floor(max/4),Math.floor(max*3/4));
  const sah=[],tak=[];
  while(sah.length<1){const v=R(1,max);if(lebih?v>rujuk:v<rujuk)sah.push(v);}
  while(tak.length<2){const v=R(1,max);if((lebih?v<rujuk:v>rujuk)&&!tak.includes(v))tak.push(v);}
  const susun=shuffle([...sah,...tak]);      // satu susunan sahaja untuk kad & pilihan
  return{kekalSusun:true,
    q:`Nombor manakah <b>${lebih?"lebih besar":"lebih kecil"} daripada ${fmt(rujuk)}</b>?`,
    vis:`<div style="display:flex;gap:clamp(8px,1.8vh,16px);justify-content:center;flex-wrap:wrap">
      ${susun.map(v=>kadNombor(v)).join("")}</div>`,
    opts:susun.map(fmt),ans:-1,ansVal:fmt(sah[0]),
    hint:`${fmt(sah[0])} ${lebih?"lebih besar":"lebih kecil"} daripada ${fmt(rujuk)}.`};
};

/* --- Kombinasi nombor: persamaan penuh supaya jumlah jelas kelihatan --- */
function kotakObjek(n,e,lbl){
  return `<div class="pbox">${lbl?`<div class="plbl">${lbl}</div>`:""}
    ${Array(n).fill(`<span class="obj">${e}</span>`).join("")}</div>`;
}
ENJIN.kombinasi=c=>()=>{
  const t=R(3,c.max||10),a=R(1,t-1),b=t-a,e=pick(OBJ);
  const pilihan=[b,b+1,Math.max(0,b-1),t].filter((v,i,x)=>x.indexOf(v)===i&&v>=0).map(String);
  const nama1=pick(NAMA);let nama2=pick(NAMA);while(nama2===nama1)nama2=pick(NAMA);
  const benda=pick([["bola","⚽"],["guli","🔵"],["pensel","✏️"],["gula-gula","🍬"],["buku","📕"]]);
  const jenis=pick(["objek","objek","angka","kata","cerita","bakul","depan"]);

  // 1) objek + ? = objek  (kedua-dua belah bergambar)
  if(jenis==="objek")
    return{q:`Berapa lagi diperlukan untuk menjadi <b>${t}</b>?`,
      vis:`<div class="pers">
        ${kotakObjek(a,e,"Ada")}
        <div class="psym">+</div>
        <div class="pbox tanya">?</div>
        <div class="psym">=</div>
        ${kotakObjek(t,e,"Jumlah")}
      </div>`,
      opts:pilihan,ans:-1,ansVal:String(b),
      hint:`${a} dan ${b} membentuk ${t}. Ayat matematik: ${a} + ${b} = ${t}.`};

  // 2) objek + ? = angka besar
  if(jenis==="angka")

  // 3) guna perkataan "sama dengan" dan "campur"
  if(jenis==="kata")
    return{q:"Lengkapkan kombinasi nombor ini",
      vis:`<div class="pers">
        ${kotakObjek(a,e)}

  // 4) nombor hilang di HADAPAN: ? + objek = jumlah
  if(jenis==="depan")
    return{q:"Berapakah nombor yang hilang di hadapan?",
      vis:`<div class="pers">
        <div class="pbox tanya">?</div>
        <div class="psym">+</div>
        ${kotakObjek(b,e)}
        <div class="psym">=</div>
        <div class="pbox jumlah">${t}</div>

      opts:[a,a+1,Math.max(0,a-1),t].filter((v,i,x)=>x.indexOf(v)===i&&v>=0).map(String),
      ans:-1,ansVal:String(a),
      hint:`Jumlah ${t}, sudah ada ${b}. Jadi yang hilang ialah ${a}.`};

  // 5) di dalam / di luar bakul
  if(jenis==="bakul")
    return{q:`Semuanya ada <b>${t}</b> ${benda[0]}. Berapa ${benda[0]} di dalam bakul?`,

      opts:[a,a+1,Math.max(0,a-1),t].filter((v,i,x)=>x.indexOf(v)===i&&v>=0).map(String),
      ans:-1,ansVal:String(a),
      hint:`${t} semuanya, ${b} di luar bakul. Jadi ${a} di dalam bakul.`};

  // 6) ayat cerita bernama
  return{q:`Berapa ${benda[0]} ${nama1}?`,
    vis:`<div class="ref" style="font-size:clamp(13px,2.1vh,16px);line-height:1.7;text-align:center">

      </div>
      <div class="pers">

        ${kotakObjek(b,benda[1])}
        <div class="psym">=</div>

      </div>`,
    opts:[a,a+1,Math.max(0,a-1),t].filter((v,i,x)=>x.indexOf(v)===i&&v>=0).map(String),
    ans:-1,ansVal:String(a),
    hint:`${nama2} ada ${b}, jumlah ${t}. Jadi ${nama1} ada ${t} − ${b} = ${a}.`};

/* --- Nilai tempat & nilai digit --- */
/* Menanda digit yang dimaksudkan menghapuskan kekaburan apabila
   nombor mempunyai digit berulang (cth: 11, 55, 343). */
function nomborSorot(n,idx){
  const sn=String(n);
  return `<div class="digitrow">${sn.split("").map((d,i)=>
    `<div class="dgt${i===idx?" garis":""}">${d}</div>`
  ).join("")}</div>`;
}
ENJIN.nilaitempat=c=>()=>{
  const max=c.max||99,n=R(Math.floor(max/10)+1,max);
  const sn=String(n),nama=c.tempat||["puluh","sa"];
  const off=nama.length-sn.length;
  const i=R(Math.max(0,off),nama.length-1);
  const pos=i-off;                       // kedudukan digit dalam nombor
  const digit=+sn[pos];
  const tempat=nama[i];
  const nilaiDigit=digit*Math.pow(10,sn.length-1-pos);
  const sorot=nomborSorot(n,pos);

  if(c.digit&&Math.random()<.5){
    const semua=[];
    for(let z=0;z<sn.length;z++){
      const d2=+sn[z], nd2=d2*Math.pow(10,sn.length-1-z);
      semua.push(nd2,d2);
    }
    const o=shuffle([nilaiDigit,...semua,digit*10])
      .filter((v,x,a)=>a.indexOf(v)===x&&v>0&&v<=max&&Number.isInteger(v)).slice(0,4);
    if(!o.includes(nilaiDigit))o[0]=nilaiDigit;
    return{q:`Apakah <b>nilai digit</b> bagi digit yang <b>bergaris</b>?`,
      vis:sorot+dienes(n),
      opts:shuffle(o).map(fmt),ans:-1,ansVal:fmt(nilaiDigit),
      hint:`Digit ${digit} yang bergaris berada di tempat <b>${tempat}</b>, `
        +`jadi nilai digitnya ialah <b>${fmt(nilaiDigit)}</b>.`};
  }
  const o=shuffle(nama).slice(0,4);
  if(!o.includes(tempat))o[0]=tempat;
  return{q:`Digit yang <b>bergaris</b> berada pada <b>nilai tempat</b> apa?`,
    vis:sorot+dienes(n),
    opts:shuffle(o),ans:-1,ansVal:tempat,
    hint:`Nilai tempat ialah nama kedudukan digit. Digit ${digit} yang bergaris `
      +`berada pada kedudukan <b>${tempat}</b>.`};
};
