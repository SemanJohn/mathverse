}
function teksTandatanganSoalan(t){
  return String(t||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
}
function tandatanganSoalan(it){
  const visual=String(it&&it.vis||"").replace(/\s+/g," ").trim();
  return [
    teksTandatanganSoalan(it&&it.q),
    teksTandatanganSoalan(it&&it.qs),
    String(it&&it.ansVal),
    String(it&&it.interaksi||""),
    visual
  ].join("§");
}

/* ===================== PELARI AKTIVITI ===================== */
let AK={soal:[],i:0,rek:[],jana:null,sub:null,unit:null,jam:null,masa:0};
const BIL_SOALAN=6;

function vMain(){
  const t=nav.t,c=CURR[t],u=c.unit.find(x=>x.id===nav.u),s=u.s.find(x=>x.id===nav.s);
  AK.sub=s;AK.unit=u;
  const enj=ENJIN[s.a];
  if(!enj){
    app.innerHTML=topbar(esc(u.n)+" › "+esc(s.n),`go('unit',${t},'${u.id}')`)+
      `<div class="skrin"><div class="stage" style="overflow-y:auto">
        <h2 class="sec">📖 ${esc(s.n)}</h2>
        <div class="ref"><b>Kod:</b> ${u.id}_${s.id}<br>
          <b>Unit:</b> ${esc(u.n)}<br>
          <b>Rujukan:</b> ${s.p?("Buku Teks / Buku Aktiviti KSSR, muka surat "+s.p):"DSKP KSSR Semakan"}<br>
          <b>Tahun:</b> ${esc(c.nama)}</div>
        <div class="note-b">Aktiviti interaktif untuk kemahiran ini belum tersedia dalam versi ini.
          Gunakan buku teks sebagai rujukan utama.</div>
        <div class="center"><button class="btn g" onclick="tandaSiap('${u.id}','${s.id}');toast('Ditanda selesai');go('unit',${t},'${u.id}')">Tanda Selesai</button></div>
      </div></div>`;
    return;
  }
  HAD=(s.c&&s.c.had)||c.hadNombor||Infinity;
  AK.jana=enj(s.c||{});
  AK.soal=[];AK.i=0;AK.rek=[];
  // jana soalan tanpa pengulangan dalam satu set
  const dilihat=new Set();
  const modelDilihat=new Set();
  const corakDilihat=new Set();
  for(let k=0;k<BIL_SOALAN;k++){
    let it=null;
    for(let cuba=0;cuba<80;cuba++){
      try{
        const calon=bersih(AK.jana());
        const t=tandatanganSoalan(calon);
        const km=String(calon&&calon.kunciModel||"");
        const kc=String(calon&&calon.kunciCorak||"");
        if(!dilihat.has(t)&&(!km||!modelDilihat.has(km))&&(!kc||!corakDilihat.has(kc))){
          dilihat.add(t);if(km)modelDilihat.add(km);if(kc)corakDilihat.add(kc);it=calon;break;
        }
      }catch(e){/* cuba lagi */}
    }
    if(it)AK.soal.push(it);
  }
  if(!AK.soal.length)AK.soal.push({q:"Ralat menjana soalan",vis:"",opts:["OK"],ans:0,hint:""});
  // Jaminan: gaya soalan tertentu MESTI ada sekurang-kurangnya sekali dalam setiap set
  const wajib=s.c&&s.c.wajib?[].concat(s.c.wajib):[];
  wajib.forEach(gy=>{
    if(AK.soal.some(x=>x.gaya===gy))return;
    const janaWajib=enj(Object.assign({},s.c,{gaya:[gy]}));
    // ganti soalan yang gayanya paling kerap muncul supaya kepelbagaian dikekalkan
    const kira={};AK.soal.forEach(x=>{kira[x.gaya]=(kira[x.gaya]||0)+1;});
    let idx=0,byk=-1;
    AK.soal.forEach((x,i)=>{const c2=kira[x.gaya]||0;if(c2>byk){byk=c2;idx=i;}});
    for(let cuba=0;cuba<80;cuba++){
      try{
        const calon=bersih(janaWajib());
        const t=tandatanganSoalan(calon);
        const km=String(calon&&calon.kunciModel||"");
        const lama=String(AK.soal[idx]&&AK.soal[idx].kunciModel||"");
        const kc=String(calon&&calon.kunciCorak||"");
        const corakLama=String(AK.soal[idx]&&AK.soal[idx].kunciCorak||"");
        if(!dilihat.has(t)&&(!km||km===lama||!modelDilihat.has(km))
            &&(!kc||kc===corakLama||!corakDilihat.has(kc))){
          dilihat.delete(tandatanganSoalan(AK.soal[idx]));
          if(lama)modelDilihat.delete(lama);
          if(km)modelDilihat.add(km);
          if(corakLama)corakDilihat.delete(corakLama);
          if(kc)corakDilihat.add(kc);
          dilihat.add(t);AK.soal[idx]=calon;break;
        }
      }catch(e){}
    }
  });
  paparSoalan();
}

/* Semua kotak dalam satu baris dibuat SAMA LEBAR mengikut isi terpanjang,
   supaya nombor 2 digit dan 3 digit tidak menghasilkan kotak besar-kecil. */
function seragamkanKotak(){
  document.querySelectorAll(".urut,.bank,.slots").forEach(baris=>{
    const anak=[...baris.children];
    if(anak.length<2){baris.style.removeProperty("--kotak");return;}
    const panjang=Math.max(...anak.map(e=>{
      const t=(e.textContent||"").replace(/\s+/g," ").trim();
      return t==="?"?1:t.length;
    }),1);
    baris.style.setProperty("--kotak",panjang+"ch");
  });
}
let PEMERHATI_MUAT=null,RAF_MUAT=0;
function muatSatuMuka(){
  const luar=document.querySelector(".skrin.aktiviti .isi");
  const dalam=document.getElementById("isiDalam");
  if(!luar||!dalam)return;
  // Tanggalkan skala DAHULU sebelum mengukur. Tanpa ini, ukuran kedua
  // dikira atas kandungan yang sudah dikecilkan, jadi ia tidak pernah
  // membetulkan dirinya — itu sebab papan kekunci masih terpotong.
  dalam.style.transform="none";
  const tinggiAda=Math.max(1,luar.clientHeight-2);
  const lebarAda=Math.max(1,luar.clientWidth-2);
  const tinggiPerlu=Math.max(1,dalam.scrollHeight,dalam.offsetHeight);
  const lebarPerlu=Math.max(1,dalam.scrollWidth,dalam.offsetWidth);
  const skala=Math.max(.5,Math.min(1,tinggiAda/tinggiPerlu,lebarAda/lebarPerlu));
  dalam.style.transform=skala>=.999?"none":`scale(${skala.toFixed(3)})`;
  dalam.setAttribute("data-skala",skala.toFixed(3));
}
function jadualMuat(){
  cancelAnimationFrame(RAF_MUAT);
  RAF_MUAT=requestAnimationFrame(()=>requestAnimationFrame(muatSatuMuka));
}
let PEMERHATI_SAIZ=null,MASA_MUAT=[];
function pantauMuatSatuMuka(){
  if(PEMERHATI_MUAT)PEMERHATI_MUAT.disconnect();
  if(PEMERHATI_SAIZ)PEMERHATI_SAIZ.disconnect();
  MASA_MUAT.forEach(clearTimeout);MASA_MUAT=[];
  const st=document.querySelector(".skrin.aktiviti .stage");
  if(!st)return;
  PEMERHATI_MUAT=new MutationObserver(jadualMuat);
  PEMERHATI_MUAT.observe(st,{childList:true,subtree:true,characterData:true});
  // Bar alamat Safari & papan kekunci boleh menukar tinggi selepas paparan;
  // ResizeObserver menangkap perubahan itu.
  if(window.ResizeObserver){
    PEMERHATI_SAIZ=new ResizeObserver(jadualMuat);
    PEMERHATI_SAIZ.observe(st);
    const isi=st.querySelector(".isi"); if(isi)PEMERHATI_SAIZ.observe(isi);
  }
  // emoji dan gambar selesai dimuat selepas bingkai pertama
  st.querySelectorAll("img").forEach(im=>{
    if(!im.complete)im.addEventListener("load",jadualMuat,{once:true});
  });
  jadualMuat();
  MASA_MUAT=[60,220,600].map(ms=>setTimeout(muatSatuMuka,ms));
}
addEventListener("resize",jadualMuat);
addEventListener("orientationchange",()=>setTimeout(muatSatuMuka,250));
if(window.visualViewport)visualViewport.addEventListener("resize",jadualMuat);
function paparSoalan(){
  const t=nav.t,u=AK.unit,s=AK.sub;
  if(AK.i>=AK.soal.length)return paparRingkasan();
  const it=AK.soal[AK.i];
  clearInterval(AK.jam);
  AK.dijawab=false;              // tetapkan semula bagi soalan baharu
  const dots=AK.soal.map((_,i)=>`<div class="dot ${i<AK.i?(AK.rek[i]?"ok":"no"):i===AK.i?"now":""}"></div>`).join("");
  let opsHtml="";
  if(it.mod==="interaktif"){
    // jika papan sudah ada kekunci ⏎, tidak perlu butang semak berasingan
    opsHtml=(it.vis||"").includes('id="kbdEnter"')?""
      :`<div class="aksi" id="barAksi"><button type="button" class="btn g" id="btnCek"
        onclick="cekInteraktif()">✓ Semak Jawapan</button></div>`;
  }else{
    opsHtml=`<div class="opts" id="opts">${it.opts.map((o,i)=>
      `<button class="opt" onclick="jawab(${i})">${esc(o)}</button>`).join("")}</div>`;
  }
  app.innerHTML=topbar(esc(u.n)+" › "+esc(s.n),`go('unit',${t},'${u.id}')`)+
    `<div class="skrin aktiviti"><div class="stage pop">
      <div class="prog">${dots}</div>
      ${it.masa?`<div class="timer" id="timer">⏱️ ${it.masa}s</div>`:""}
      <div class="isi">
        <div class="isi-dalam" id="isiDalam">
          <div class="q">${it.q}</div>
          ${it.qs?`<div class="qs">${esc(it.qs)}</div>`:""}
          ${it.vis||""}
          ${it.mod!=="interaktif"?opsHtml:""}
        </div>
      </div>
      <div class="fb" id="fb"></div>
      <div class="hint" id="hint"></div>
      ${it.mod==="interaktif"?opsHtml:""}
    </div></div>`;
  kemasPaparanPecahan(document.getElementById("isiDalam"));
  if(it.mod==="interaktif"){
    if(it.vis.includes('id="wlt"'))WLTdraw();
    if(it.vis.includes('id="garisLukisWrap"'))GARIS2sedia();
    if(it.vis.includes('id="lukis2dWrap"'))B2Lsedia();
    if(it.vis.includes('id="slotWrap"')){MODINP="slot";SLOTsedia();}
    if(it.vis.includes('id="lazimWrap"'))LZMsedia();
    if(it.vis.includes('id="operasiLazimWrap"')){MODINP="nombor";INP="";OPLdraw();}
    if(it.vis.includes('id="teknikWrap"'))TEKsedia();
    if(it.vis.includes('id="darabWrap"'))DRBsedia();
    if(it.vis.includes('id="bahagiWrap"'))BHGsedia();
    if(it.vis.includes('id="mangkukWrap"'))MANGKUKsedia();
    if(it.vis.includes('id="mangkukCampurWrap"'))MANGKUKCsedia();
    if(it.vis.includes('id="jalanKerjaWrap"'))JKRsedia();
    if(it.vis.includes('id="fractionWarnaWrap"'))FRWsedia();
    if(it.vis.includes('id="suaiWrap"'))SUAIsedia();
    if(it.vis.includes('id="urutWrap"'))ISIsedia();
    if(it.vis.includes('id="jawabPecahan"')){
      MODINP="pecahan";INP="";PINPsedia();
    }else if(it.vis.includes('id="inpBox"')){
      // tetapkan mod papan MENGIKUT SOALAN YANG DIPAPAR
      MODINP=it.vis.includes('id="lazimWrap"')?"lazim"
        :it.vis.includes('id="slotWrap"')?"slot"
        :it.vis.includes('id="jawabSendiri"')?"jawapan"
        :it.vis.includes('class="kbd"')?"huruf":"nombor";
      INP="";INPdraw();
    }
  }
  seragamkanKotak();
  pantauMuatSatuMuka();
  if(it.masa){
    AK.masa=it.masa;
    AK.jam=setInterval(()=>{
      AK.masa--;
      const el=document.getElementById("timer");
      if(el)el.textContent="⏱️ "+AK.masa+"s";
      if(AK.masa<=0){clearInterval(AK.jam);habisMasa();}
    },1000);
  }
}

function nilaiBetul(it,idx){
  if(it.ans>=0)return idx===it.ans;
  return it.opts[idx]===it.ansVal;
}
function jawab(idx){
  if(AK.dijawab)return;          // halang jawapan berganda
  AK.dijawab=true;
  clearInterval(AK.jam);
  const it=AK.soal[AK.i];
  const betul=nilaiBetul(it,idx);
  const btns=document.querySelectorAll("#opts .opt");
  if(betul){
    AK.rek[AK.i]=true;markah(true,it.masa?15:10);
    btns.forEach((b,i)=>{
      b.disabled=true;b.onclick=null;
      if(i===idx)b.classList.add("ok");
    });
  }else{
    btns.forEach((b,i)=>{if(i===idx)b.classList.add("no");});
  }
  selesaiSoalan(betul,it,false,!betul);
}
function cekInteraktif(){
  if(AK.dijawab)return;          // halang semakan berganda (markah berganda)
  AK.dijawab=true;
  const it=AK.soal[AK.i];
  const betul=!!(it.cek&&it.cek());
  if(betul){AK.rek[AK.i]=true;markah(true,15);}
  selesaiSoalan(betul,it,false,!betul);
}
function habisMasa(){
  if(AK.dijawab)return;
  AK.dijawab=true;
  const it=AK.soal[AK.i];
  AK.rek[AK.i]=false;markah(false,0);
  document.querySelectorAll("#opts .opt").forEach((b,i)=>{
    b.disabled=true;b.onclick=null;
    if(it.ans>=0?i===it.ans:it.opts[i]===it.ansVal)b.classList.add("ok");});
  selesaiSoalan(false,it,true);
}
function selesaiSoalan(betul,it,masa,bolehCuba){
  const fb=document.getElementById("fb"),hn=document.getElementById("hint");
  if(fb){fb.className="fb";fb.textContent="";}
  if(hn)hn.textContent="";
  const st=document.querySelector(".stage");
  if(st){
    const lama=document.getElementById("keputusanPopup");if(lama)lama.remove();
    st.classList.add("keputusan-terbuka");
    const d=document.createElement("div"),akhir=AK.i>=AK.soal.length-1;
    const tajuk=betul?pick(["Bagus!","Tepat sekali!","Hebat!","Syabas!"])
      :masa?"Masa tamat":"Belum tepat";
    const penerangan=betul?"Jawapan kamu betul. Teruskan kepada soalan berikutnya."
      :masa?"Masa untuk soalan ini telah tamat."
      :"Cuba semula atau langkau ke soalan berikutnya.";
    d.id="keputusanPopup";d.className="keputusan-lapik";
    d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");
    d.setAttribute("aria-label",betul?"Jawapan betul":"Jawapan salah");
    d.innerHTML=`<div class="keputusan-kad ${betul?"betul":"salah"}">
      <div class="keputusan-ikon" aria-hidden="true">${betul?"&#10003;":"&#10005;"}</div>
      <h2>${tajuk}</h2><p>${penerangan}</p>
      <div class="keputusan-tindakan">${
        bolehCuba
          ?`<button type="button" class="btn g" id="btnRetry" onclick="cubaLagiSoalan()">Cuba Lagi</button>
             <button type="button" class="btn senyap" onclick="langkauSoalan()">${akhir?"Langkau & Lihat Keputusan":"Langkau Soalan"}</button>`
          :`<button type="button" class="btn g" id="btnNext" onclick="seterusnya()">${akhir?"Lihat Keputusan":"Soalan Seterusnya &rsaquo;"}</button>`
      }</div></div>`;
    st.appendChild(d);
    jadualMuat();
  }
}
function cubaLagiSoalan(){
  const p=document.getElementById("keputusanPopup");if(p)p.remove();
  const st=document.querySelector(".stage");if(st)st.classList.remove("keputusan-terbuka","shake");
  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.disabled=false;b.classList.remove("no","ok");
  });
  if(document.querySelector(".pad,.kbd"))INPkosong();
  if(document.getElementById("garisLukisWrap"))GARIS2sedia();
  if(document.getElementById("lukis2dWrap"))B2Lsedia();
  if(document.getElementById("mangkukWrap"))MANGKUKsedia();
  if(document.getElementById("mangkukCampurWrap"))MANGKUKCsedia();
  AK.dijawab=false;
  jadualMuat();
}
function langkauSoalan(){
  if(!AK.dijawab)return;
  AK.rek[AK.i]=false;markah(false,0);seterusnya();
}
function seterusnya(){AK.i++;window.scrollTo(0,0);paparSoalan();}

function paparRingkasan(){
  const t=nav.t,u=AK.unit,s=AK.sub;
  const b=AK.rek.filter(Boolean).length,j=AK.soal.length;
  const pct=Math.round(b/j*100);
  const lulus=pct>=60;
  if(lulus)tandaSiap(u.id,s.id);
  const msg=pct===100?"Cemerlang! Kamu kuasai kemahiran ini."
    :pct>=60?"Bagus! Kamu sudah menguasai kemahiran ini. 👍"
    :"Cuba sekali lagi untuk kuasai kemahiran ini. 💪";
  app.innerHTML=topbar(esc(u.n)+" › "+esc(s.n),`go('unit',${t},'${u.id}')`)+
    `<div class="skrin"><div class="stage pop" style="text-align:center;overflow-y:auto">
      <div style="font-size:64px">${pct===100?"✅":pct>=60?"🎉":"💪"}</div>
      <h2 class="sec">${b} / ${j} betul</h2>
      <div class="bar" style="max-width:320px;margin:0 auto 18px"><i style="width:${pct}%"></i></div>
      <div style="font-size:16px;color:var(--dim);margin-bottom:8px">${msg}</div>
      <div class="prog" style="margin:18px 0">${AK.rek.map(r=>`<div class="dot ${r?"ok":"no"}"></div>`).join("")}</div>
      <div class="ref" style="text-align:left">
        <b>Kemahiran:</b> ${esc(s.n)}<br>
        <b>Kod:</b> ${u.id}_${s.id}<br>
        <b>Rujukan:</b> ${s.p?("Buku KSSR m/s "+s.p):"DSKP KSSR Semakan"}
      </div>
      <div class="center" style="display:flex;gap:11px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="vMain()">Cuba Lagi</button>
        <button class="btn g" onclick="go('unit',${t},'${u.id}')">Kembali ke Unit</button>
      </div>
    </div></div>`;
}

/* ===================== MULA ===================== */
window.addEventListener("keydown",e=>{
  if(nav.v!=="main")return;
  // mod menulis jawapan — papan kekunci sebenar turut berfungsi
  if((document.getElementById("inpBox")||document.getElementById("jawabPecahan")
      ||document.getElementById("slotWrap")
      ||document.getElementById("lazimWrap")||document.getElementById("operasiLazimWrap")
      ||document.getElementById("teknikWrap")
      ||document.getElementById("darabWrap")||document.getElementById("bahagiWrap")
      ||document.getElementById("mangkukWrap")
      ||document.getElementById("mangkukCampurWrap")
      ||document.getElementById("jalanKerjaWrap"))&&!AK.dijawab){
    if((MODINP==="nombor"||MODINP==="jawapan")&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="pecahan"&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="jawapan"&&/^[.\/:]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="lazim"&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="teknik"&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="darab"&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="bahagi"&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="mangkuk"&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="mangkuk-campur"&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="jalan"&&/^[0-9]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="jalan"&&/^[.\/:]$/.test(e.key)){INPtambah(e.key);e.preventDefault();return;}
    if(MODINP==="jalan"&&e.key===" "){INPtambah(" ");e.preventDefault();return;}
    if((MODINP==="huruf"||MODINP==="slot")&&/^[a-zA-Z]$/.test(e.key)){
      INPtambah(e.key.toLowerCase());e.preventDefault();return;}
    if(MODINP==="slot"&&e.key===" "){
      if(SLOTAKTIF<SLOT.length-1)SLOTAKTIF++;
      SLOTdraw();e.preventDefault();return;}
    if(e.key==="Backspace"){INPpadam();e.preventDefault();return;}
  }
  if(e.key==="Enter"){
    const b=document.getElementById("btnNext")||document.getElementById("btnRetry")
      ||document.getElementById("btnCek")
      ||document.getElementById("kbdEnter");
    if(b){e.preventDefault();b.click();return;}
  }
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4){const b=document.querySelectorAll("#opts .opt")[n-1];if(b&&!b.disabled)b.click();}
});
window.addEventListener("resize",jadualMuat);
render();
